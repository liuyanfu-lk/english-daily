const AN = {"gh":{"https://github.com/nodejs/node/pull/66698":{"titleZh":"tls：将缓冲的记录合并为一次读取","pre":true,"sents":[["[[SSL_read() returns at most one TLS record per call]], and TLSWrap::ClearOut() emits a separate read for each one.","SSL_read() 每次调用最多返回一条 TLS 记录，而 ClearOut() 会为每条记录单独触发一次读取。"],["Records can be up to 16 KiB, but [[plenty of servers send smaller ones]]: nginx defaults ssl_buffer_size to 4 KiB.","记录最大可达 16 KiB，但很多服务器发得更小：nginx 默认 ssl_buffer_size 是 4 KiB。"],["With this change ClearOut() [[keeps calling SSL_read() into the same 16 KiB buffer]] while the next record is application data.","这个改动让 ClearOut() 持续把 SSL_read() 读进同一个 16 KiB 缓冲区，只要下一条是应用数据。"],["It never waits for more input, [[it only merges records that have already arrived]], and reads never get bigger than one full record already makes them.","它从不等待更多输入，只合并已经到达的记录，读取从不会超过单条完整记录本身的量。"]],"phrases":[["returns at most one X per call","每次调用最多返回一个 X","描述 API 行为边界","/ɹɪtˈɝnz ˈæt mˈoʊst wˈʌn … pˈɝ kˈɔl/"],["plenty of ... do","很多……会","口语但正式可用","/ˈplɛnti əv ... du/"],["keeps doing X while Y","在 Y 成立时持续做 X","描述循环条件","/kˈips dˈuɪŋ … wˈaɪl …/"],["never waits for more input","从不等待更多输入","强调非阻塞语义","/nˈɛvɚ wˈeɪts fˈɔɹ mˈɔɹ ˈɪnpˌʊt/"],["already arrived","已经到达的","区分缓冲与网络","/ɔlɹˈɛdi ɚˈaɪvd/"]],"sentsHl":[["[[SSL_read() returns at most one TLS record per call]], and TLSWrap::ClearOut() emits a separate read for each one.","SSL_read() 每次调用最多返回一条 TLS 记录，而 ClearOut() 会为每条记录单独触发一次读取。"],["Records can be up to 16 KiB, but [[plenty of servers send smaller ones]]: nginx defaults ssl_buffer_size to 4 KiB.","记录最大可达 16 KiB，但很多服务器发得更小：nginx 默认 ssl_buffer_size 是 4 KiB。"],["With this change ClearOut() [[keeps calling SSL_read() into the same 16 KiB buffer]] while the next record is application data.","这个改动让 ClearOut() 持续把 SSL_read() 读进同一个 16 KiB 缓冲区，只要下一条是应用数据。"],["It never waits for more input, [[it only merges records that have already arrived]], and reads never get bigger than one full record already makes them.","它从不等待更多输入，只合并已经到达的记录，读取从不会超过单条完整记录本身的量。"]]},"https://github.com/rust-lang/rust/pull/163946":{"titleZh":"修复可转换性类型不匹配的缺陷","pre":true,"sents":[["Fixes rust-lang/rust#161251","修复 issue #161251。"],["[[The change was done as instructed by]] @ShoyuVanilla and @lcnr on Zulip.","这个改动是按 @ShoyuVanilla 和 @lcnr 在 Zulip 上的指示完成的。"],["There are some leftover questions [[I'll add as comments]] (self review).","还有一些遗留问题我会以评论形式补充（自我审查）。"]],"phrases":[["fixes #123","修复 #123","PR 关联 issue 的标准写法","/ˈfɪksɪz ˈhʌndrəd ˈtwɛnti ˈθri/"],["as instructed by ...","按……的指示","交代决策来源","/æz ɪnˈstrʌktɪd baɪ .../"],["leftover questions","遗留问题","诚实标注未完成项","/lˈɛftˌoʊvɚ kwˈɛstʃənz/"]],"sentsHl":[["Fixes rust-lang/rust#161251","修复 issue #161251。"],["[[The change was done as instructed by]] @ShoyuVanilla and @lcnr on Zulip.","这个改动是按 @ShoyuVanilla 和 @lcnr 在 Zulip 上的指示完成的。"],["There are some leftover questions [[I'll add as comments]] (self review).","还有一些遗留问题我会以评论形式补充（自我审查）。"]]},"https://github.com/vercel/next.js/pull/100566":{"titleZh":"turbo-bitset：新增 Bitset——一个在有限位区间上运行的高速位集","sents":[["The module graph fixed-point traversals track set membership with `RoaringBitmap`, which is built for compact storage, not speed.","模块图的定点遍历使用 `RoaringBitmap` 来跟踪集合成员关系，而它的设计目标是紧凑存储，而非速度。"],["This PR adds a new `turbo-bitset` crate with `Bitset`: a `Vec<usize>` of blocks plus an offset counted in whole blocks.","本 PR 新增了一个 `turbo-bitset` crate，其中提供 `Bitset`：它由一个存放块的 `Vec<usize>` 再加上一个以整块为单位计数的偏移量组成。"],["Bit `i` is stored at `i - offset * usize::BITS`, so a set only stores the word range between its lowest and highest bit.","第 `i` 位存放在 `i - offset * usize::BITS` 处，因此一个集合只存储其最低位与最高位之间的字范围。"],["Unions, intersections, differences, subset checks, `is_disjoint` and `intersection_len` are word loops over the overlapping range, so their cost is proportional to the range, not the number of bits.","并集、交集、差集、子集判断、`is_disjoint` 和 `intersection_len` 都是对重叠范围做按字的循环，因此其开销与范围大小成正比，而与位数无关。"],["`union_with` returns whether it added a bit.","`union_with` 会返回它是否新增了某一位。"],["It ORs the words and collects the added bits in the same loop, so a traversal checks for a change and applies the union in one pass instead of a subset check plus `|=`.","它在同一个循环里对各个字做按位或并收集新增的位，因此一次遍历就能在单趟中完成“是否发生变化”的检查和并集操作，而不必先做子集判断再做 `|=`。"]],"phrases":[["fixed-point traversal","不动点遍历","指反复迭代直到结果不再变化的图遍历算法，常见于编译器与构建系统的图分析。","/fɪkst pɔɪnt trəˈvɜrsəl/"],["be built for compact storage, not speed","为紧凑存储而非速度而设计","用于评价数据结构取舍的固定说法：built for X, not Y，说明设计目标所在。","/bˈi bˈɪlt fˈɔɹ kˈɑmpækt stˈɔɹədʒ nˈɑt spˈid/"],["be proportional to the number of bits","与位数成正比","描述算法复杂度的常用句式，be proportional to 后接度量对象。","/bˈi pɹəpˈɔɹʃənəl tˈu ðə nˈʌmbɚ ˈʌv bˈɪts/"],["subset check","子集判断／子集检查","集合类 API 中的高频名词搭配，同类还有 membership check、bounds check。","/sˈʌbsˌɛt tʃˈɛk/"],["in one pass","一趟完成／单趟完成","强调只需遍历一次数据即可完成多件事，常与 instead of 对比引出优化前做法。","/ɪn wˈʌn pˈæs/"]],"sentsHl":[["The module graph [[fixed-point traversal]]s track set membership with `RoaringBitmap`, which is built for compact storage, not speed.","模块图的定点遍历使用 `RoaringBitmap` 来跟踪集合成员关系，而它的设计目标是紧凑存储，而非速度。"],["This PR adds a new `turbo-bitset` crate with `Bitset`: a `Vec<usize>` of blocks plus an offset counted in whole blocks.","本 PR 新增了一个 `turbo-bitset` crate，其中提供 `Bitset`：它由一个存放块的 `Vec<usize>` 再加上一个以整块为单位计数的偏移量组成。"],["Bit `i` is stored at `i - offset * usize::BITS`, so a set only stores the word range between its lowest and highest bit.","第 `i` 位存放在 `i - offset * usize::BITS` 处，因此一个集合只存储其最低位与最高位之间的字范围。"],["Unions, intersections, differences, [[subset check]]s, `is_disjoint` and `intersection_len` are word loops over the overlapping range, so their cost is proportional to the range, not the number of bits.","并集、交集、差集、子集判断、`is_disjoint` 和 `intersection_len` 都是对重叠范围做按字的循环，因此其开销与范围大小成正比，而与位数无关。"],["`union_with` returns whether it added a bit.","`union_with` 会返回它是否新增了某一位。"],["It ORs the words and collects the added bits in the same loop, so a traversal checks for a change and applies the union [[in one pass]] instead of a [[subset check]] plus `|=`.","它在同一个循环里对各个字做按位或并收集新增的位，因此一次遍历就能在单趟中完成“是否发生变化”的检查和并集操作，而不必先做子集判断再做 `|=`。"]]},"https://github.com/vercel/next.js/pull/100620":{"titleZh":"turbo-persistence：并行化大规模 batch_get 读取","sents":[["Parallelize large `TurboPersistence::batch_get` calls in `turbo-persistence`.","在 `turbo-persistence` 中并行化大规模的 `TurboPersistence::batch_get` 调用。"],["Batches with **more than 2048 keys** (`PARALLEL_BATCH_GET_THRESHOLD`) are split into chunks and run on the database's existing `ParallelScheduler`.","键数**超过 2048**（`PARALLEL_BATCH_GET_THRESHOLD`）的批次会被拆分成多个块，并交由数据库已有的 `ParallelScheduler` 执行。"],["Smaller batches run serially, one chunk per shard.","较小的批次则串行执行，每个分片一个块。"],["Every chunk stays inside _one shard_ of the family's current shard index, so small shards produce smaller chunks.","每个块都限定在该 family 当前分片索引中的_单个分片_内，因此分片越小，产生的块也越小。"],["Values are materialized as soon as an SST lookup finds them and written directly into the output `Vec`.","一旦 SST 查找命中，值就会被实际读取出来并直接写入输出的 `Vec`。"],["Parallel chunks write disjoint indices concurrently through a small `ConcurrentSlice`.","并行的块通过一个小巧的 `ConcurrentSlice` 并发写入互不相交的索引。"]],"phrases":[["split into chunks","拆分成若干块","描述把大批量任务切小以便并行时的高频说法，常与 batch、task 搭配。","/splˈɪt ˈɪntu tʃˈʌŋks/"],["run serially","串行运行","与 run in parallel 相对，强调一次只跑一个，常用于对比并行与串行策略。","/rʌn ˈsɪriəli/"],["disjoint indices","互不相交的索引","并发写入安全性的关键修饰语，表示各线程写的下标集合没有交集。","/dɪsdʒˈɔɪnt ˈɪndɪsˌiz/"],["heap-allocate","在堆上分配（内存）","性能讨论常用，说某结构“不会 heap-allocate”即指不触发堆分配、没有额外开销。","/hip ˈæləkeɪt/"],["available parallelism","可用并行度","指当前环境能同时运行的任务数，常见于调度器与线程池相关文档。","/əvˈeɪləbəl pˈɛɹəlˌɛlˌɪzəm/"]],"sentsHl":[["Parallelize large `TurboPersistence::batch_get` calls in `turbo-persistence`.","在 `turbo-persistence` 中并行化大规模的 `TurboPersistence::batch_get` 调用。"],["Batches with **more than 2048 keys** (`PARALLEL_BATCH_GET_THRESHOLD`) are [[split into chunks]] and run on the database's existing `ParallelScheduler`.","键数**超过 2048**（`PARALLEL_BATCH_GET_THRESHOLD`）的批次会被拆分成多个块，并交由数据库已有的 `ParallelScheduler` 执行。"],["Smaller batches [[run serially]], one chunk per shard.","较小的批次则串行执行，每个分片一个块。"],["Every chunk stays inside _one shard_ of the family's current shard index, so small shards produce smaller chunks.","每个块都限定在该 family 当前分片索引中的_单个分片_内，因此分片越小，产生的块也越小。"],["Values are materialized as soon as an SST lookup finds them and written directly into the output `Vec`.","一旦 SST 查找命中，值就会被实际读取出来并直接写入输出的 `Vec`。"],["Parallel chunks write [[disjoint indices]] concurrently through a small `ConcurrentSlice`.","并行的块通过一个小巧的 `ConcurrentSlice` 并发写入互不相交的索引。"]]},"https://github.com/microsoft/vscode/pull/343329":{"titleZh":"sanity：保留失败桌面 UI 测试的应用日志","sents":[["This is a diagnostics-only change to the sanity tests.","这是对 sanity 测试的一项仅涉及诊断的改动。"],["When a desktop UI test fails, it keeps the app's own logs so the failure's real cause can be identified.","当桌面 UI 测试失败时，它会保留应用自身的日志，以便能查明失败的真正原因。"],["All 3 install attempts in the same app instance failed 0.3–0.9 s after clicking Install.","同一个应用实例中的全部 3 次安装尝试都在点击 Install 后 0.3–0.9 秒内失败。"],["Mocha's retry, which starts a new app instance, passed immediately.","Mocha 的重试会启动一个新的应用实例，而它立刻通过了。"],["The product's reason for the failure is only in the app's logs.","产品侧记录的失败原因只存在于应用日志中。"],["Those live in a temporary user data dir that the test deletes, so they never reach the artifacts.","这些日志位于一个临时用户数据目录中，而该目录会被测试删除，因此它们永远不会进入构建产物。"]],"phrases":[["diagnostics-only change","仅涉及诊断的改动","表示改动不影响产品行为，只增加诊断信息，常用于 PR 开头声明风险很低。","/ˌdaɪəgˈnɑstɪks ˈoʊnli tʃeɪndʒ/"],["race in the test","测试中的竞态","race 是 race condition 的简写，技术语境中常直接说 a race。","/ɹˈeɪs ɪn ðə tˈɛst/"],["app instance","应用实例","指一次启动的进程实例，重启应用即 new app instance。","/ˈæp ˈɪnstəns/"],["user data dir","用户数据目录","dir 是 directory 的缩写，在日志和代码注释中很常见。","/ˈjuzər ˈdeɪtə dɪr/"],["reach the artifacts","进入构建产物（归档工件）","CI 语境中 artifacts 指上传保存的构建产出，reach 表示“最终到达、被收集到”。","/ɹˈitʃ ðə ˈɑɹtəfˌækts/"]],"sentsHl":[["This is a [[diagnostics-only change]] to the sanity tests.","这是对 sanity 测试的一项仅涉及诊断的改动。"],["When a desktop UI test fails, it keeps the app's own logs so the failure's real cause can be identified.","当桌面 UI 测试失败时，它会保留应用自身的日志，以便能查明失败的真正原因。"],["All 3 install attempts in the same [[app instance]] failed 0.3–0.9 s after clicking Install.","同一个应用实例中的全部 3 次安装尝试都在点击 Install 后 0.3–0.9 秒内失败。"],["Mocha's retry, which starts a new [[app instance]], passed immediately.","Mocha 的重试会启动一个新的应用实例，而它立刻通过了。"],["The product's reason for the failure is only in the app's logs.","产品侧记录的失败原因只存在于应用日志中。"],["Those live in a temporary [[user data dir]] that the test deletes, so they never reach the artifacts.","这些日志位于一个临时用户数据目录中，而该目录会被测试删除，因此它们永远不会进入构建产物。"]]},"https://github.com/microsoft/vscode/pull/342372":{"titleZh":"画布：项目画布扩展以工作区信任作为启动门控","sents":[["Project Copilot extensions can execute code to contribute canvases, but their launch path previously checked only that the extension was located under an active working directory.","项目级 Copilot 扩展可以执行代码来贡献画布，但其启动路径此前只检查了该扩展是否位于某个活动工作目录之下。"],["This allowed project extensions to launch while the workspace was untrusted.","这使得项目扩展在工作区处于不受信任状态时仍然可以启动。"],["This change gates project extension launches on the Agent Host workspace trust configuration.","本次改动将项目扩展的启动门控到 Agent Host 的工作区信任配置上。"],["Project extension paths, admitted roots, and trusted roots are canonicalized to the same filesystem identity; trust, containment, and admission are revalidated after asynchronous resolution.","项目扩展路径、准入根目录和受信任根目录都会被规范化为同一文件系统标识；信任、包含关系与准入在异步解析之后会重新校验。"],["Missing trust configuration and untrusted workspaces fail closed, while Workspace Trust disablement and explicit remote or cloud-sandbox connection-authority trust preserve expected launches.","缺失信任配置与不受信任的工作区一律按失败关闭处理，而禁用工作区信任、以及显式信任远程或云沙箱连接授权这两种情况仍保留预期的启动行为。"],["User and plugin extension sources are unchanged.","用户扩展与插件扩展的来源保持不变。"]],"phrases":[["gate ... on ...","以……作为……的门控条件／用……来把关……","安全类改动中常见，表示把某个动作的准入条件绑定到某配置或检查上，如 gate launches on workspace trust。","/geɪt ... ɑn .../"],["workspace trust","工作区信任","VS Code 的安全模型术语，指用户是否信任当前打开的工作区可以执行代码；常与 untrusted 连用。","/wˈɝkspˌeɪs tɹˈʌst/"],["fail closed","失败即拒绝（默认关闭）","安全设计原则：检查不通过时按最严格方式处理，宁可拒绝也不放行；反义为 fail open。","/fˈeɪl klˈoʊzd/"],["launch path","启动路径（代码执行链路）","指从触发到实际启动扩展的整条代码路径，review 中常问“does the launch path check X?”。","/lˈɔntʃ pˈæθ/"],["be canonicalized to the same filesystem identity","被规范化为同一文件系统标识","用于判断两个路径是否实为同一目录（处理符号链接、.. 等），是路径校验类 PR 的高频表述。","/bi kəˈnɑnɪkəlaɪzd tu ðə seɪm ˈfaɪlsɪstəm aɪˈdɛntəti/"]],"sentsHl":[["Project Copilot extensions can execute code to contribute canvases, but their [[launch path]] previously checked only that the extension was located under an active working directory.","项目级 Copilot 扩展可以执行代码来贡献画布，但其启动路径此前只检查了该扩展是否位于某个活动工作目录之下。"],["This allowed project extensions to launch while the workspace was untrusted.","这使得项目扩展在工作区处于不受信任状态时仍然可以启动。"],["This change gates project extension launches on the Agent Host [[workspace trust]] configuration.","本次改动将项目扩展的启动门控到 Agent Host 的工作区信任配置上。"],["Project extension paths, admitted roots, and trusted roots are canonicalized to the same filesystem identity; trust, containment, and admission are revalidated after asynchronous resolution.","项目扩展路径、准入根目录和受信任根目录都会被规范化为同一文件系统标识；信任、包含关系与准入在异步解析之后会重新校验。"],["Missing trust configuration and untrusted workspaces [[fail closed]], while [[Workspace Trust]] disablement and explicit remote or cloud-sandbox connection-authority trust preserve expected launches.","缺失信任配置与不受信任的工作区一律按失败关闭处理，而禁用工作区信任、以及显式信任远程或云沙箱连接授权这两种情况仍保留预期的启动行为。"],["User and plugin extension sources are unchanged.","用户扩展与插件扩展的来源保持不变。"]]},"https://github.com/rust-lang/rust/pull/164425":{"titleZh":"通过 `rustc_index::newtype_index!` 声明 `SyntaxContext`","sents":[["Declare `SyntaxContext` through `rustc_index::newtype_index!`","通过 `rustc_index::newtype_index!` 声明 `SyntaxContext`。"],["`SyntaxContext` is basically an index type but it is not declared through `newtype_index`.","`SyntaxContext` 基本上就是一个索引类型，但它并不是通过 `newtype_index` 声明的。"],["*[View all comments](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/164425)*","*[查看全部评论](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/164425)*"],["r? @petrochenkov","请求 @petrochenkov 评审。"]],"phrases":[["declare X through Y","通过 Y 声明 X","说明某个类型/宏是用什么机制产生或定义的，常见于重构类 PR 描述。","/dɪklˈɛɹ … θɹˈu …/"],["an index type","索引类型","指本质上是整数下标、用于索引表的类型，常与 newtype 包装一起出现。","/ˈæn ˈɪndɛks tˈaɪp/"],["newtype_index!","newtype 索引宏","Rust 编译器内部宏，用一行声明生成带类型的索引 newtype 及其相关实现。","/ˈnu taɪp ˈɪndɛks/"],["r? @someone","请求某人评审","Rust 社区 PR 惯例写法，r? 后跟 GitHub 用户名即指派评审人。","/ˈɑɹ sˈʌmwˌʌn/"],["is basically ... but it is not ...","基本上算是……但并不是……","先承认近似性质、再指出不足的委婉句式，常用于为改动找理由。","/ɪz ˈbeɪsɪkli ... bʌt ɪt ɪz nɑt .../"]],"sentsHl":[["Declare `SyntaxContext` through `rustc_index::[[newtype_index!]]`","通过 `rustc_index::newtype_index!` 声明 `SyntaxContext`。"],["`SyntaxContext` is basically [[an index type]] but it is not declared through `newtype_index`.","`SyntaxContext` 基本上就是一个索引类型，但它并不是通过 `newtype_index` 声明的。"],["*[View all comments](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/164425)*","*[查看全部评论](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/164425)*"],["r? @petrochenkov","请求 @petrochenkov 评审。"]]},"https://github.com/rust-lang/rust/pull/164458":{"titleZh":"避免使用标准库的 `impl Hash for Path` 以保证稳定哈希","sents":[["A subtle consequence of the stage0 redesign is that the compiler must take care to avoid relying on any stdlib-provided Hash impl when computing stable hashes, or at least any such impl that is actually liable to change.","stage0 重构带来的一个微妙后果是：编译器在计算稳定哈希时必须小心，不要依赖任何由标准库提供的 Hash 实现，至少不能依赖任何确实可能发生变化的此类实现。"],["This was noticed when trying to strengthen the provided Hash impl for Path, which triggered baffling CI failures because the stable hashes produced by the stage1 compiler (built against stage0 stdlib) were inconsistent with the ones that would have been produced by the stage2 compiler (built against in-tree stdlib).","这个问题是在尝试加强现有的 Path 的 Hash 实现时被发现的：它引发了令人费解的 CI 失败，因为 stage1 编译器（基于 stage0 标准库构建）产生的稳定哈希，与 stage2 编译器（基于仓库内的标准库构建）本应产生的稳定哈希不一致。"],["This PR aims to unblock changes to `impl Hash for Path`, by making the compiler not rely on it for stable hashing.","这个 PR 的目标是通过让编译器在稳定哈希时不再依赖 `impl Hash for Path`，来解除对该实现进行修改的阻塞。"],["It does not attempt to solve the broader problem of the compiler relying on stdlib hash details.","它并不试图解决编译器依赖标准库哈希细节这一更广泛的问题。"]],"phrases":[["take care to avoid","小心避免","用于说明某项实现需要留意的风险点，常接动名词。","/tˈeɪk kˈɛɹ tˈu əvˈɔɪd/"],["stable hash","稳定哈希","编译器中跨 stage、跨版本必须保持一致的哈希值，是本文的核心概念。","/stˈeɪbəl hˈæʃ/"],["CI failure","CI 失败","指持续集成流水线中的失败，常与 trigger、baffling 等词搭配。","/ˌsi ˈaɪ ˈfeɪljər/"],["in-tree","仓库内自带的","指与主仓库同一源码树中的组件，如 in-tree stdlib 与外部依赖相对。","/ɪn tri/"],["unblock","解除阻塞","PR 常用语，表示让另一个被卡住的 PR 或改动得以继续推进。","/ʌnˈblɑk/"]],"sentsHl":[["A subtle consequence of the stage0 redesign is that the compiler must [[take care to avoid]] relying on any stdlib-provided Hash impl when computing stable hashes, or at least any such impl that is actually liable to change.","stage0 重构带来的一个微妙后果是：编译器在计算稳定哈希时必须小心，不要依赖任何由标准库提供的 Hash 实现，至少不能依赖任何确实可能发生变化的此类实现。"],["This was noticed when trying to strengthen the provided Hash impl for Path, which triggered baffling [[CI failure]]s because the [[stable hash]]es produced by the stage1 compiler (built against stage0 stdlib) were inconsistent with the ones that would have been produced by the stage2 compiler (built against in-tree stdlib).","这个问题是在尝试加强现有的 Path 的 Hash 实现时被发现的：它引发了令人费解的 CI 失败，因为 stage1 编译器（基于 stage0 标准库构建）产生的稳定哈希，与 stage2 编译器（基于仓库内的标准库构建）本应产生的稳定哈希不一致。"],["This PR aims to [[unblock]] changes to `impl Hash for Path`, by making the compiler not rely on it for [[stable hash]]ing.","这个 PR 的目标是通过让编译器在稳定哈希时不再依赖 `impl Hash for Path`，来解除对该实现进行修改的阻塞。"],["It does not attempt to solve the broader problem of the compiler relying on stdlib hash details.","它并不试图解决编译器依赖标准库哈希细节这一更广泛的问题。"]]},"https://github.com/nodejs/node/pull/66895":{"titleZh":"src：修复使用 `--shared-brotli` 时的构建失败","sents":[["`BROTLI_DECODER_ERROR_FORMAT_BLOCK_SWITCH` isn't in any brotli release yet (1.2.0 is the latest), so building with `--shared-brotli` fails since 7ba22c2812.","`BROTLI_DECODER_ERROR_FORMAT_BLOCK_SWITCH` 尚未出现在任何 brotli 发布版本中（1.2.0 是最新版本），因此自 7ba22c2812 起，使用 `--shared-brotli` 构建会失败。"],["It's an enum value and the bundled brotli still reports 1.2.0, so there's nothing to `#ifdef` on.","它是一个枚举值，而内置的 brotli 仍报告版本 1.2.0，所以没有可用于 `#ifdef` 判断的依据。"],["This only exposes the constant when brotli is bundled and skips the matching test otherwise.","这样只在 brotli 为内置时才暴露该常量，否则跳过对应的测试。"],["I built with `--shared-brotli` against Homebrew brotli 1.2.0 and ran `parallel/test-zlib*` (90 tests, all pass).","我用 `--shared-brotli` 针对 Homebrew 的 brotli 1.2.0 进行了构建，并运行了 `parallel/test-zlib*`（90 个测试，全部通过）。"],["The GN change is untested, I had no `gn` locally.","GN 相关的改动未经过测试，我本地没有 `gn`。"]],"phrases":[["build with `--shared-brotli`","使用 `--shared-brotli` 构建","命令行选项常用 with 引出配置项，构建类 PR 标题里很常见。","/bɪld wɪð ˈʃɛrd ˈbroʊtli/"],["in any ... release yet","尚未出现在任何……发布版本中","yet 与否定句连用表示“到目前为止还没有”，说明上游版本尚未包含该特性。","/ɪn ˈɛni rɪˈlis jɛt/"],["nothing to `#ifdef` on","没有可用于 `#ifdef` 判断的依据","介词 on 后接判断条件；说明条件编译缺少可检测的宏。","/ˈnʌθɪŋ tu ˈhæʃ ɪf dɛf ɑn/"],["bundled brotli","内置（随源码捆绑）的 brotli","bundled 指随项目一起打包的第三方库，与系统的 shared 版本相对。","/ˈbʌndəld ˈbroʊtli/"],["all pass","全部通过","描述测试结果的简略说法，常见于 PR 说明中的括号补充。","/ˈɔl pˈæs/"]],"sentsHl":[["`BROTLI_DECODER_ERROR_FORMAT_BLOCK_SWITCH` isn't in any brotli release yet (1.2.0 is the latest), so building with `--shared-brotli` fails since 7ba22c2812.","`BROTLI_DECODER_ERROR_FORMAT_BLOCK_SWITCH` 尚未出现在任何 brotli 发布版本中（1.2.0 是最新版本），因此自 7ba22c2812 起，使用 `--shared-brotli` 构建会失败。"],["It's an enum value and the [[bundled brotli]] still reports 1.2.0, so there's [[nothing to `#ifdef` on]].","它是一个枚举值，而内置的 brotli 仍报告版本 1.2.0，所以没有可用于 `#ifdef` 判断的依据。"],["This only exposes the constant when brotli is bundled and skips the matching test otherwise.","这样只在 brotli 为内置时才暴露该常量，否则跳过对应的测试。"],["I built with `--shared-brotli` against Homebrew brotli 1.2.0 and ran `parallel/test-zlib*` (90 tests, [[all pass]]).","我用 `--shared-brotli` 针对 Homebrew 的 brotli 1.2.0 进行了构建，并运行了 `parallel/test-zlib*`（90 个测试，全部通过）。"],["The GN change is untested, I had no `gn` locally.","GN 相关的改动未经过测试，我本地没有 `gn`。"]]},"https://github.com/nodejs/node/pull/66820":{"titleZh":"依赖：将 V8 打补丁更新至 15.6.75.25","sents":[["deps: patch V8 to 15.6.75.25","依赖：将 V8 打补丁升级到 15.6.75.25"],["This is an automated patch update of V8 to 15.6.75.25.","这是一次将 V8 自动打补丁更新到 15.6.75.25 的改动。"]],"phrases":[["automated patch update","自动化补丁更新","常见于机器人（bot）提交的依赖升级 PR 描述，强调无需人工干预。","/ˈɔtəmˌeɪtɪd pˈætʃ əpdˈeɪt/"],["patch V8 to 15.6.75.25","把 V8 打补丁升级到 15.6.75.25","patch A to B 表示在保留版本线的前提下把 A 升到 B，多用于小版本或安全修复。","/pætʃ vi eɪt tu ˈfɪfˈtin pɔɪnt sɪks ˈsɛvəntiˈfaɪv pɔɪnt tuˈfaɪv/"],["deps:","依赖：","提交信息（commit/PR 标题）里的前缀，表示这条改动只涉及依赖版本，不含业务代码。","/dɛps/"],["an update of X to Y","把 X 更新到 Y 的更新","名词化表达，update of 后接被更新的对象，to 后接目标版本号。","/ˈæn əpdˈeɪt ˈʌv … tˈu …/"],["V8 to 15.6.75.25","V8 升级到 15.6.75.25","技术写作中常用『组件 + to + 版本号』的省略句式，简洁标明升级目标。","/vi eɪt tu ˈfɪfˈtin pɔɪnt sɪks ˈsɛvəntiˈfaɪv pɔɪnt tuˈfaɪv/"]],"sentsHl":[["[[deps:]] [[patch V8 to 15.6.75.25]]","依赖：将 V8 打补丁升级到 15.6.75.25"],["This is an [[automated patch update]] of V8 to 15.6.75.25.","这是一次将 V8 自动打补丁更新到 15.6.75.25 的改动。"]]},"https://github.com/openai/openai-python/pull/4175":{"titleZh":"feat(api)：扩展 Live Decision 的条目与问题类型","sents":[["Support more message, tool call, and question input types in Live Decisions.","在 Live Decisions 中支持更多消息、工具调用和问题输入类型。"],["Accept user, developer, system, and assistant messages in Live Decision items.","在 Live Decision 条目中接受 user、developer、system 和 assistant 消息。"],["Add function and custom tool call and output types.","添加函数与自定义工具调用及输出类型。"],["Allow strings or structured instruction parts in Live Decision questions.","允许在 Live Decision 问题中使用字符串或结构化指令片段。"]],"phrases":[["tool call","工具调用","常与 function、custom 搭配，表示模型调用外部工具。","/tˈul kˈɔl/"],["input types","输入类型","API 文档中常用来指可接收的参数或数据种类。","/ˈɪnpˌʊt tˈaɪps/"],["structured instruction parts","结构化指令片段","parts 表示可组合的组成部分，不要译成“零件”。","/stɹˈʌktʃɚd ˌɪnstɹˈʌkʃən pˈɑɹts/"],["Live Decisions","实时决策（功能名）","产品/功能专名，翻译时通常保留英文或加注。","/lˈaɪv dɪsˈɪʒənz/"]],"sentsHl":[["Support more message, [[tool call]], and question input types in Live Decisions.","在 Live Decisions 中支持更多消息、工具调用和问题输入类型。"],["Accept user, developer, system, and assistant messages in Live Decision items.","在 Live Decision 条目中接受 user、developer、system 和 assistant 消息。"],["Add function and custom [[tool call]] and output types.","添加函数与自定义工具调用及输出类型。"],["Allow strings or [[structured instruction parts]] in Live Decision questions.","允许在 Live Decision 问题中使用字符串或结构化指令片段。"]]},"https://github.com/openai/openai-python/pull/4192":{"titleZh":"fix(examples)：处理即按即说中的打断与断连","sents":[["Pressing Enter tried to use a button the app never mounted, and transcripts containing Rich tags could crash the session.","按 Enter 键会去使用一个应用从未挂载的按钮，而包含 Rich 标签的转写文本可能导致会话崩溃。"],["This change displays transcripts and API errors as literal text, reports failed or incomplete responses, and closes the audio device and SDK client on exit.","本次改动把转写文本和 API 错误按纯文本显示，报告失败或未完成的响应，并在退出时关闭音频设备和 SDK 客户端。"],["When K interrupts playback, the sample cancels the active response and truncates unheard audio, including queued items after response.done.","当按 K 打断播放时，示例会取消当前活跃的响应，并截断尚未播放的音频，包括 response.done 之后排队的内容项。"],["Capture starts before awaiting cancellation and truncation; microphone sends wait until those writes finish.","采集在等待取消和截断完成之前就已启动；麦克风数据的发送会等到这些写入完成之后再进行。"],["A response.created event that arrives after K, before any new audio is offered, belongs to the earlier turn.","在按 K 之后、尚未提供任何新音频之前到达的 response.created 事件，属于之前的那一轮。"],["Microphone appends and manual commits recheck that work after obtaining the lock and yield outside it when necessary.","麦克风追加和手动提交在获得锁之后会重新检查该工作，并在必要时在锁外让出。"]],"phrases":[["push-to-talk","即按即说（按住说话）","语音交互里的“按住键说话”模式，常缩写为 PTT，与免提常开模式相对。","/ˈpʊʃ tu ˈtɔk/"],["truncate unheard audio","截断尚未播放的音频","truncate 指把音频尾部直接砍掉，不是降低音量；常与 audio、transcript 搭配。","/tɹˈʌŋkˌeɪt ənhˈɝd ˈɑdiˌoʊ/"],["wait for the send lock","等待发送锁","锁的固定搭配是 acquire/obtain/release the lock，wait for the lock 表示阻塞等待。","/wˈeɪt fˈɔɹ ðə sˈɛnd lˈɑk/"],["exit with code 1","以退出码 1 退出","退出码用介词 with，不说 by code；0 表示正常，非 0 表示异常。","/ˈɛɡzɪt wɪð koʊd wʌn/"],["reserve the server input buffer","预留服务器输入缓冲区","reserve 强调“先占位”，常用于缓冲区、内存、配额等资源。","/ɹɪzˈɝv ðə sˈɝvɚ ˈɪnpˌʊt bˈʌfɚ/"]],"sentsHl":[["Pressing Enter tried to use a button the app never mounted, and transcripts containing Rich tags could crash the session.","按 Enter 键会去使用一个应用从未挂载的按钮，而包含 Rich 标签的转写文本可能导致会话崩溃。"],["This change displays transcripts and API errors as literal text, reports failed or incomplete responses, and closes the audio device and SDK client on exit.","本次改动把转写文本和 API 错误按纯文本显示，报告失败或未完成的响应，并在退出时关闭音频设备和 SDK 客户端。"],["When K interrupts playback, the sample cancels the active response and truncates unheard audio, including queued items after response.done.","当按 K 打断播放时，示例会取消当前活跃的响应，并截断尚未播放的音频，包括 response.done 之后排队的内容项。"],["Capture starts before awaiting cancellation and truncation; microphone sends wait until those writes finish.","采集在等待取消和截断完成之前就已启动；麦克风数据的发送会等到这些写入完成之后再进行。"],["A response.created event that arrives after K, before any new audio is offered, belongs to the earlier turn.","在按 K 之后、尚未提供任何新音频之前到达的 response.created 事件，属于之前的那一轮。"],["Microphone appends and manual commits recheck that work after obtaining the lock and yield outside it when necessary.","麦克风追加和手动提交在获得锁之后会重新检查该工作，并在必要时在锁外让出。"]]},"https://github.com/vercel/next.js/pull/100884":{"titleZh":"turbo-tasks：通过 KeyedReadRef 增加批量键读取","sents":[["Adds `vc.keyed_reader().await?`, which returns a `KeyedReadRef<T>` for `cell = \"keyed\"` values, and uses it for NFT generation (`crates/next-api/src/nft.rs`, `crates/next-api/src/nft_json.rs`).","新增 `vc.keyed_reader().await?`，它为 `cell = \"keyed\"` 的值返回一个 `KeyedReadRef<T>`，并将其用于 NFT 生成（`crates/next-api/src/nft.rs`、`crates/next-api/src/nft_json.rs`）。"],["`vc.get(key).await?` and `vc.contains_key(key).await?` register a fine-grained dependency per read.","`vc.get(key).await?` 和 `vc.contains_key(key).await?` 每一次读取都会注册一个细粒度依赖。"],["That gets expensive when one task reads many keys from the same map, as the NFT tasks do.","当一个任务从同一个 map 中读取大量键时（NFT 相关任务正是如此），这种做法的代价就很高。"],["It records the hashes of the accessed keys (the same hash `vc.get` uses), not the keys themselves.","它记录的是被访问键的哈希（与 `vc.get` 使用的是同一个哈希），而不是键本身。"],["calling `keyed_reader()` allocates a dedicated `CellKey::Keyed(id)` dependency for the current task execution before the future is created.","调用 `keyed_reader()` 会在创建 future 之前，为当前这次任务执行分配一个专属的 `CellKey::Keyed(id)` 依赖。"],["one batched backend call replaces the `Keyed(id)` dependency with `CellKey::Hash(h)` dependencies for the accessed keys.","一次批量后端调用会把 `Keyed(id)` 依赖替换为针对所访问键的 `CellKey::Hash(h)` 依赖。"]],"phrases":[["fine-grained dependency","细粒度依赖","指精确到单个键（而非整个单元）的依赖粒度，常与 coarse-grained 相对。","/faɪn ɡreɪnd dɪˈpɛndənsi/"],["register a dependency","注册依赖","增量计算框架里的固定说法：读取数据时登记依赖，以便后续判断失效。","/ɹˈɛdʒɪstɚ ə dɪpˈɛndənsi/"],["resolve to Result<...>","解析为 Result<...>","描述 Future 完成后的返回值类型，写文档时常用 resolving to + 类型。","/ɹizˈɑlv tˈu ɹɪzˈʌlt/"],["batched backend call","批量后端调用","batch 作动词/形容词表示“合并成一批”，用于减少加锁与往返开销。","/bætʃt ˈbækˌɛnd kɔl/"],["full-cell dependency","整单元依赖","cell 是 turbo-tasks 中的缓存单元；full-cell 指整个单元级别的依赖，与按键级依赖对照。","/fʊl sɛl dɪˈpɛndənsi/"]],"sentsHl":[["Adds `vc.keyed_reader().await?`, which returns a `KeyedReadRef<T>` for `cell = \"keyed\"` values, and uses it for NFT generation (`crates/next-api/src/nft.rs`, `crates/next-api/src/nft_json.rs`).","新增 `vc.keyed_reader().await?`，它为 `cell = \"keyed\"` 的值返回一个 `KeyedReadRef<T>`，并将其用于 NFT 生成（`crates/next-api/src/nft.rs`、`crates/next-api/src/nft_json.rs`）。"],["`vc.get(key).await?` and `vc.contains_key(key).await?` register a [[fine-grained dependency]] per read.","`vc.get(key).await?` 和 `vc.contains_key(key).await?` 每一次读取都会注册一个细粒度依赖。"],["That gets expensive when one task reads many keys from the same map, as the NFT tasks do.","当一个任务从同一个 map 中读取大量键时（NFT 相关任务正是如此），这种做法的代价就很高。"],["It records the hashes of the accessed keys (the same hash `vc.get` uses), not the keys themselves.","它记录的是被访问键的哈希（与 `vc.get` 使用的是同一个哈希），而不是键本身。"],["calling `keyed_reader()` allocates a dedicated `CellKey::Keyed(id)` dependency for the current task execution before the future is created.","调用 `keyed_reader()` 会在创建 future 之前，为当前这次任务执行分配一个专属的 `CellKey::Keyed(id)` 依赖。"],["one [[batched backend call]] replaces the `Keyed(id)` dependency with `CellKey::Hash(h)` dependencies for the accessed keys.","一次批量后端调用会把 `Keyed(id)` 依赖替换为针对所访问键的 `CellKey::Hash(h)` 依赖。"]]},"https://github.com/vercel/next.js/pull/101040":{"titleZh":"修复布局客户端代码块跨异步服务端导入的泄漏问题","sents":[["When a layout reaches a shared client reference through a server-side `import()`, the reference can belong to different chunk groups than its owner.","当布局通过服务端 `import()` 访问到某个共享的客户端引用时，该引用所属的 chunk 组可能与它的所有者不同。"],["Falling back to every group containing that reference could then pull unrelated page code into the layout’s initial client chunks.","此时若回退到所有包含该引用的组，就可能把不相关的页面代码拉进布局的初始客户端 chunk 中。"],["Select groups by direct owner membership or transitive async-import ancestry, with cycle detection.","改为按直接所有者归属或传递性异步导入的祖先关系来选择组，并加入循环检测。"],["Only fall back when owner information is absent; error when a known owner cannot be matched.","仅在所有者信息缺失时才回退；当已知所有者无法匹配时则报错。"],["Added async/nested/cyclic regression coverage.","新增了异步、嵌套、循环三种场景的回归测试覆盖。"],["Existing layout chunk-sharing and CSS-order tests pass in production and development with rebuilt native bindings.","在重新构建原生绑定后，现有的布局 chunk 共享测试与 CSS 顺序测试在生产环境和开发环境下均通过。"]],"phrases":[["chunk leakage","chunk 泄漏（代码块被错误地打入其他产物）","指打包产物中代码块被错误地包含进不该包含它的包，常用于描述打包器或构建管线的问题。","/tʃˈʌŋk lˈikədʒ/"],["shared client reference","共享的客户端引用","在服务端与客户端边界上被多处引用的模块引用，讨论 RSC/SSR 场景时高频出现。","/ʃˈɛɹd klˈaɪənt ɹˈɛfɚəns/"],["chunk group","chunk 组","打包器对代码块的分组单位，常与 belong to / map to 等动词搭配。","/tʃˈʌŋk ɡɹˈup/"],["cycle detection","循环检测","处理图结构（依赖、引用关系）时的标准说法，常与 with 连用表示“并做循环检测”。","/sˈaɪkəl dɪtˈɛkʃən/"],["regression coverage","回归测试覆盖","表示“为某类回归问题补充了测试”，常搭配 add / increase。","/ɹəɡɹˈɛʃən kˈʌvɚədʒ/"]],"sentsHl":[["When a layout reaches a [[shared client reference]] through a server-side `import()`, the reference can belong to different chunk groups than its owner.","当布局通过服务端 `import()` 访问到某个共享的客户端引用时，该引用所属的 chunk 组可能与它的所有者不同。"],["Falling back to every group containing that reference could then pull unrelated page code into the layout’s initial client chunks.","此时若回退到所有包含该引用的组，就可能把不相关的页面代码拉进布局的初始客户端 chunk 中。"],["Select groups by direct owner membership or transitive async-import ancestry, with [[cycle detection]].","改为按直接所有者归属或传递性异步导入的祖先关系来选择组，并加入循环检测。"],["Only fall back when owner information is absent; error when a known owner cannot be matched.","仅在所有者信息缺失时才回退；当已知所有者无法匹配时则报错。"],["Added async/nested/cyclic [[regression coverage]].","新增了异步、嵌套、循环三种场景的回归测试覆盖。"],["Existing layout chunk-sharing and CSS-order tests pass in production and development with rebuilt native bindings.","在重新构建原生绑定后，现有的布局 chunk 共享测试与 CSS 顺序测试在生产环境和开发环境下均通过。"]]},"https://github.com/microsoft/vscode/pull/344806":{"titleZh":"当右键菜单获得焦点时保持快速输入框打开","sents":[["With HTML (custom) context menus, right-clicking the Command Palette or any quick pick dismisses it as soon as the menu appears.","在使用 HTML（自定义）右键菜单时，右击命令面板或任意快速选择控件，菜单刚一出现，它就会被关闭。"],["The menu takes DOM focus into a context view outside `.quick-input-widget`, so the quick input's focus tracker sees a blur and hides.","菜单会把 DOM 焦点带入 `.quick-input-widget` 之外的上下文视图，于是快速输入框的焦点追踪器检测到失焦（blur），就把输入框隐藏了。"],["Native macOS menus never move DOM focus, so they were not affected.","macOS 原生菜单从不会移动 DOM 焦点，所以它们不受影响。"],["Hosting the menu inside its owner (`domForShadowRoot`) keeps focus in the owner, but then the owner's `overflow: hidden` and transforms clip the menu.","把菜单托管在其宿主（`domForShadowRoot`）内部可以让焦点留在宿主中，但这样一来，宿主的 `overflow: hidden` 和 transform 会把菜单裁剪掉。"],["The creator of a context view still passes its owner explicitly, as before.","上下文视图的创建者仍然和以前一样，显式传入它的宿主。"],["the menu renders in the top layer, unclipped by the owner's overflow or transforms.","菜单渲染在顶层（top layer），不会被宿主的 overflow 或 transform 裁剪。"]],"phrases":[["right-click","右击","动词用法，直接接宾语，如 right-click the Command Palette，比 click with the right mouse button 更简洁。","/ˈraɪt klɪk/"],["take / move DOM focus","夺取、移动 DOM 焦点","take focus into ... 表示把焦点带入某个 DOM 区域；这一点是否发生，往往是判断失焦问题的关键。","/teɪk / muv di oʊ ɛm ˈfoʊkəs/"],["opt-in","需主动开启的、可选的","与默认开启的 opt-out 相对，常作定语，如 an opt-in popover mode。","/ˈɑpt ɪn/"],["host ... as a popover","以浮层（popover）方式托管","host 指把某个子视图挂到宿主 DOM 里面；as a popover 说明挂载的具体形式。","/hoʊst ... æz ə ˈpɑpˌoʊvər/"],["top layer","顶层","浏览器渲染的最上层，不受父级 overflow 或 transform 裁剪，是解决浮层被裁剪问题的常用手段。","/tˈɑp lˈeɪɚ/"]],"sentsHl":[["With HTML (custom) context menus, [[right-click]]ing the Command Palette or any quick pick dismisses it as soon as the menu appears.","在使用 HTML（自定义）右键菜单时，右击命令面板或任意快速选择控件，菜单刚一出现，它就会被关闭。"],["The menu takes DOM focus into a context view outside `.quick-input-widget`, so the quick input's focus tracker sees a blur and hides.","菜单会把 DOM 焦点带入 `.quick-input-widget` 之外的上下文视图，于是快速输入框的焦点追踪器检测到失焦（blur），就把输入框隐藏了。"],["Native macOS menus never move DOM focus, so they were not affected.","macOS 原生菜单从不会移动 DOM 焦点，所以它们不受影响。"],["Hosting the menu inside its owner (`domForShadowRoot`) keeps focus in the owner, but then the owner's `overflow: hidden` and transforms clip the menu.","把菜单托管在其宿主（`domForShadowRoot`）内部可以让焦点留在宿主中，但这样一来，宿主的 `overflow: hidden` 和 transform 会把菜单裁剪掉。"],["The creator of a context view still passes its owner explicitly, as before.","上下文视图的创建者仍然和以前一样，显式传入它的宿主。"],["the menu renders in the [[top layer]], unclipped by the owner's overflow or transforms.","菜单渲染在顶层（top layer），不会被宿主的 overflow 或 transform 裁剪。"]]},"https://github.com/microsoft/vscode/pull/346652":{"titleZh":"Agent Host：面向 Copilot 的模型路由器（实验性）","sents":[["This adds model routers to Copilot in Agent Host sessions.","本次改动为 Agent Host 会话中的 Copilot 增加了模型路由器。"],["A model router is a `<name>.model-router.yaml` file that lists models and when to use each.","模型路由器就是一个 `<name>.model-router.yaml` 文件，其中列出各个模型以及每个模型的使用时机。"],["It appears as a model in the picker, and each main-agent turn asks `gpt-6-luna-decisions` which route fits the request.","它在模型选择器中表现为一个模型，主智能体的每一轮都会询问 `gpt-6-luna-decisions` 该请求适合哪条路由。"],["With the setting off, nothing changes: no router rows, no skill, no check tool, and the runtime's `DECISIONS_API` flag stays off.","关闭该设置时一切保持不变：没有路由器行、没有技能、没有检查工具，运行时的 `DECISIONS_API` 标志也保持关闭。"],["`effort: off` leaves each model's default effort, and the checker warns that any route `effort` is ignored.","当 `effort: off` 时，各模型保持其默认的 effort，检查器会警告该路由上的 `effort` 被忽略。"]],"phrases":[["model router","模型路由器","这里的 router 指按条件将请求分发到不同模型的组件，与网络硬件无关。","/mˈɑdəl ɹˈutɚ/"],["fallback list","回退列表","当首选模型不可用时，依次尝试的候选模型清单。","/fˈɔlbˌæk lˈɪst/"],["hidden from the Settings editor","在设置编辑器中隐藏","hidden from 表示从某个界面或视图中看不到，常用于隐藏实验性开关。","/hˈɪdən fɹˈʌm ðə sˈɛtɪŋz ˈɛdətɚ/"],["count as unavailable","视为不可用","count as 意为「算作、被视为」，后面接形容词或名词。","/kˈaʊnt ˈæz ˌʌnəvˈeɪləbəl/"],["turn it on","把它打开（启用）","指开启某个开关；关闭用 turn it off，正式文档中也常用 enable/disable。","/tˈɝn ˈɪt ˈɑn/"]],"sentsHl":[["This adds [[model router]]s to Copilot in Agent Host sessions.","本次改动为 Agent Host 会话中的 Copilot 增加了模型路由器。"],["A [[model router]] is a `<name>.model-router.yaml` file that lists models and when to use each.","模型路由器就是一个 `<name>.model-router.yaml` 文件，其中列出各个模型以及每个模型的使用时机。"],["It appears as a model in the picker, and each main-agent turn asks `gpt-6-luna-decisions` which route fits the request.","它在模型选择器中表现为一个模型，主智能体的每一轮都会询问 `gpt-6-luna-decisions` 该请求适合哪条路由。"],["With the setting off, nothing changes: no router rows, no skill, no check tool, and the runtime's `DECISIONS_API` flag stays off.","关闭该设置时一切保持不变：没有路由器行、没有技能、没有检查工具，运行时的 `DECISIONS_API` 标志也保持关闭。"],["`effort: off` leaves each model's default effort, and the checker warns that any route `effort` is ignored.","当 `effort: off` 时，各模型保持其默认的 effort，检查器会警告该路由上的 `effort` 被忽略。"]]},"https://github.com/rust-lang/rust/pull/165078":{"titleZh":"在 CI 中使用 `2.38` 版本的 binutils","sents":[["Use the `2.38` binutils version in CI","在 CI 中使用 `2.38` 版本的 binutils。"],["Blocked on https://github.com/rust-lang/ci-mirrors/pull/61.","该 PR 被 https://github.com/rust-lang/ci-mirrors/pull/61 阻塞（需等它先合并）。"],["View all comments","查看全部评论（这是机器人自动生成的评论链接）。"],["r? @Kobzol","请求 @Kobzol 进行代码审查。"]],"phrases":[["binutils version","binutils 版本","binutils 是链接器/汇编器等二进制工具集的统称，指定版本常用于控制工具链行为。","/ˈbaɪˌnuˌtɪlz ˈvɜrʒən/"],["Blocked on <PR/issue>","被……阻塞；需先解决……","PR 描述里说明依赖项尚未合并时的标准说法，常后接链接。","/blɑkt ɑn <piˈɑr/ˈɪʃu>/"],["r? @username","请某人 review（审查）","rust 社区机器人(rustbot/triagebot)可识别的指令，r? 即 request review。","/ˈɑɹ jˈuzɚnˌeɪm/"],["in CI","在持续集成环境中","CI = continuous integration；标题中说明改动只影响 CI 配置而非产品代码。","/ɪn ˌsiˈaɪ/"],["View all comments","查看全部评论","GitHub 机器人评论中的固定链接文字。","/vjˈu ˈɔl kˈɑmɛnts/"]],"sentsHl":[["Use the `2.38` [[binutils version]] in CI","在 CI 中使用 `2.38` 版本的 binutils。"],["Blocked on https://github.com/rust-lang/ci-mirrors/pull/61.","该 PR 被 https://github.com/rust-lang/ci-mirrors/pull/61 阻塞（需等它先合并）。"],["[[View all comments]]","查看全部评论（这是机器人自动生成的评论链接）。"],["r? @Kobzol","请求 @Kobzol 进行代码审查。"]]},"https://github.com/rust-lang/rust/pull/165376":{"titleZh":"为 `Forget` trait 添加 feature gate（特性门控）","sents":[["Add an unstable feature gate for the `Forget` trait.","为 `Forget` trait 添加一个不稳定特性门控。"],["Creating the feature gate allows experimentation with its implementation.","创建这个特性门控可以让人们对其实现进行试验。"],["Note that this does not commit to anything w.r.t. stabilization of the forget trait.","请注意，这并不表示对 forget trait 的稳定化做出任何承诺。"],["A feature gate can be removed at any time.","特性门控随时都可以被移除。"],["Part of https://github.com/rust-lang/rust/issues/165370","属于 https://github.com/rust-lang/rust/issues/165370 的一部分。"]],"phrases":[["feature gate","特性门控、功能开关","Rust 编译器用于隔离未稳定功能的机制，用户需用 `#![feature(...)]` 才能启用。","/fˈitʃɚ ɡˈeɪt/"],["unstable feature gate","不稳定特性门控","“unstable” 强调该功能尚未稳定，接口可能随时变更，是 Rust 社区的标准说法。","/ənstˈeɪbəl fˈitʃɚ ɡˈeɪt/"],["allow experimentation with","允许对……进行试验","allow + 名词 + with 是提案类 PR 的常见搭配，表示在某一方向上放开尝试。","/əlˈaʊ ɪkspˌɛɹəməntˈeɪʃən wˈɪð/"],["commit to","对……做出承诺、承诺保证","此处 “does not commit to anything” 意为不作任何保证，常用于给提案划定边界。","/kəmˈɪt tˈu/"],["w.r.t.","关于、就……而言","with respect to 的缩写，技术写作与 code review 中很常见，正式文档中可写全。","/ˌdʌbəljuˌɑrˈti/"]],"sentsHl":[["Add an unstable [[feature gate]] for the `Forget` trait.","为 `Forget` trait 添加一个不稳定特性门控。"],["Creating the [[feature gate]] allows experimentation with its implementation.","创建这个特性门控可以让人们对其实现进行试验。"],["Note that this does not [[commit to]] anything w.r.t. stabilization of the forget trait.","请注意，这并不表示对 forget trait 的稳定化做出任何承诺。"],["A [[feature gate]] can be removed at any time.","特性门控随时都可以被移除。"],["Part of https://github.com/rust-lang/rust/issues/165370","属于 https://github.com/rust-lang/rust/issues/165370 的一部分。"]]},"https://github.com/nodejs/node/pull/67062":{"titleZh":"2026-10-28，版本 27.0.0-alpha.0.0.0（Alpha）","sents":[["The V8 engine is updated to version 15.6.75.13, up from 14.6 in Node.js 26.","V8 引擎已从 Node.js 26 中的 14.6 升级到 15.6.75.13。"],["New language features enabled by default: `Math.sumPrecise()`, `Intl.Locale.prototype.variants`, `Iterator.prototype.join()`, `Iterator.prototype.includes()`, `Iterator.zip()` and `Iterator.zipKeyed()`.","默认启用的新语言特性：`Math.sumPrecise()`、`Intl.Locale.prototype.variants`、`Iterator.prototype.join()`、`Iterator.prototype.includes()`、`Iterator.zip()` 和 `Iterator.zipKeyed()`。"],["Applications that relied on the previous defaults should set `--max-old-space-size` explicitly.","依赖此前默认值的应用应显式设置 `--max-old-space-size`。"],["`v8.serialize()`, `structuredClone()` and `postMessage()` use a new format that older Node.js releases cannot read.","`v8.serialize()`、`structuredClone()` 和 `postMessage()` 使用了一种旧版 Node.js 无法读取的新格式。"],["`error.stack` is no longer looked up through the prototype chain;","`error.stack` 不再通过原型链查找；"],["`Array.prototype.sort()` uses PowerSort for large arrays","`Array.prototype.sort()` 对大型数组使用 PowerSort。"]],"phrases":[["updated to version","更新至……版本","描述依赖或引擎升级时的高频说法，后接具体版本号。","/əpdˈeɪtɪd tˈu vˈɝʒən/"],["enabled by default","默认启用","与 behind flags（需通过标志开启）相对，常用于发布说明中区分功能成熟度。","/ɛnˈeɪbəld bˈaɪ dɪfˈɔlt/"],["behind flags","位于标志之后（需加参数开启）","指实验性功能默认不开启，需显式传入命令行标志。","/bɪhˈaɪnd flˈæɡz/"],["counts toward the heap limit","计入堆内存上限","count toward 意为“算入、计入”，描述内存统计口径时常用。","/kˈaʊnts təwˈɔɹd ðə hˈip lˈɪmət/"],["set ... explicitly","显式设置……","强调不要依赖默认值，升级文档中常用来提醒用户手动配置。","/sɛt ... ɪkˈsplɪsətli/"]],"sentsHl":[["The V8 engine is [[updated to version]] 15.6.75.13, up from 14.6 in Node.js 26.","V8 引擎已从 Node.js 26 中的 14.6 升级到 15.6.75.13。"],["New language features [[enabled by default]]: `Math.sumPrecise()`, `Intl.Locale.prototype.variants`, `Iterator.prototype.join()`, `Iterator.prototype.includes()`, `Iterator.zip()` and `Iterator.zipKeyed()`.","默认启用的新语言特性：`Math.sumPrecise()`、`Intl.Locale.prototype.variants`、`Iterator.prototype.join()`、`Iterator.prototype.includes()`、`Iterator.zip()` 和 `Iterator.zipKeyed()`。"],["Applications that relied on the previous defaults should set `--max-old-space-size` explicitly.","依赖此前默认值的应用应显式设置 `--max-old-space-size`。"],["`v8.serialize()`, `structuredClone()` and `postMessage()` use a new format that older Node.js releases cannot read.","`v8.serialize()`、`structuredClone()` 和 `postMessage()` 使用了一种旧版 Node.js 无法读取的新格式。"],["`error.stack` is no longer looked up through the prototype chain;","`error.stack` 不再通过原型链查找；"],["`Array.prototype.sort()` uses PowerSort for large arrays","`Array.prototype.sort()` 对大型数组使用 PowerSort。"]]},"https://github.com/nodejs/node/pull/67187":{"titleZh":"http：按解析器 execute 调用批量处理 body spans","sents":[["http: batch body spans per parser execute","http：按解析器 execute 调用批量处理 body spans"],["Buffer body spans in `on_body()` and deliver them to JS once per `execute()` call instead of once per chunk.","在 `on_body()` 中缓冲 body spans，并在每次 `execute()` 调用时一次性把它们传给 JS，不再每处理一个分块就传一次。"],["A body sent as many small chunks no longer costs one C++ to JS call and `Buffer` per chunk.","以许多小分块发送的 body 不再为每个分块付出一次 C++ 到 JS 调用和一个 `Buffer` 的代价。"],["Chunks that arrive in the same read now produce a single `'data'` event on `IncomingMessage`.","在同一次读取中到达的多个分块，现在在 `IncomingMessage` 上只产生一个 `'data'` 事件。"],["Chunk boundaries were never documented, but code that treats each `'data'` event as a full message could break, so this needs a CITGM run.","分块边界从未写进文档，但把每个 `'data'` 事件当作一条完整消息处理的代码可能会出问题，因此需要跑一次 CITGM。"]],"phrases":[["body spans","body 片段（连续内存区间）","span 指一段连续的内存视图，不要译成“跨度”；这里指待拼接的 body 数据片段。","/bˈɑdi spˈænz/"],["once per chunk","每个分块一次","once per + 名词，表示频率；常与 instead of 连用对比两种频率。","/wˈʌns pˈɝ tʃˈʌŋk/"],["C++ to JS call","C++ 到 JS 的调用（跨语言调用）","to 表示方向；这类调用开销大，因此常用 batch 来减少次数。","/ˌsiˌplʌsˈplʌs tə ˌdʒeɪˈɛs kɔl/"],["produce a single 'data' event","产生单个 'data' 事件","produce/emit/fire an event 都常用来描述事件触发，single 强调“合并为一个”。","/pɹədˈus ə sˈɪŋɡəl dˈeɪtə ɪvˈɛnt/"],["CITGM run","跑一次 CITGM（Canary in the Goldmine 兼容性回归测试）","Node.js 项目里的固定说法，指用真实生态模块做一遍兼容性验证。","/ˈsɪtɡəm rʌn/"]],"sentsHl":[["http: batch [[body spans]] per parser execute","http：按解析器 execute 调用批量处理 body spans"],["Buffer [[body spans]] in `on_body()` and deliver them to JS once per `execute()` call instead of once per chunk.","在 `on_body()` 中缓冲 body spans，并在每次 `execute()` 调用时一次性把它们传给 JS，不再每处理一个分块就传一次。"],["A body sent as many small chunks no longer costs one [[C++ to JS call]] and `Buffer` per chunk.","以许多小分块发送的 body 不再为每个分块付出一次 C++ 到 JS 调用和一个 `Buffer` 的代价。"],["Chunks that arrive in the same read now produce a single `'data'` event on `IncomingMessage`.","在同一次读取中到达的多个分块，现在在 `IncomingMessage` 上只产生一个 `'data'` 事件。"],["Chunk boundaries were never documented, but code that treats each `'data'` event as a full message could break, so this needs a [[CITGM run]].","分块边界从未写进文档，但把每个 `'data'` 事件当作一条完整消息处理的代码可能会出问题，因此需要跑一次 CITGM。"]]},"https://github.com/openai/openai-python/pull/4213":{"titleZh":"feat(api)：改进 WebSocket 恢复与投递上报","sents":[["Apply the configured recovery policy to eligible WebSocket closures and report queued frames that could not be sent.","对符合条件的 WebSocket 关闭应用已配置的恢复策略，并上报那些无法发送的排队帧。"],["Recover from close codes 1001 and 1005 when reconnection is enabled; normal close 1000 without pending work still ends iteration.","在启用重连时，从关闭码 1001 和 1005 中恢复；而没有待处理工作的正常关闭 1000 仍会结束迭代。"],["Preserve typed and raw frame order through recovery and after an initial write fails.","在恢复过程中以及初始写入失败之后，保持类型化帧与原始帧的顺序。"],["For callers waiting on an ordinary queued send, report a failure of their own frame even if another caller sent it.","对于等待普通排队发送的调用方，即使该帧是由另一个调用方发送的，也要向其报告自己那一帧的失败。"],["A final close prevents the old flusher from starting frames already reported unsent, while keeping those frames available for the reader's report.","最终关闭会阻止旧的刷新器启动那些已上报为未发送的帧，同时让这些帧仍可供读取方上报使用。"],["If your application treats close codes 1001 or 1005 as completion, disable recovery or abort the connection when that work is complete.","如果你的应用将关闭码 1001 或 1005 视为完成，请禁用恢复，或在相关工作完成时中止连接。"]],"phrases":[["recovery policy","恢复策略","指连接异常断开后系统自动重连与恢复所采用的既定规则，常与 apply/configure 搭配。","/ɹɪkˈʌvɹi pˈɑləsi/"],["close code","关闭码","WebSocket 关闭帧中表示关闭原因的数字，如 1000 正常关闭、1001 对端离开。","/klˈoʊs kˈoʊd/"],["queued frames","排队帧","尚在发送队列中未发出的帧，讨论背压与丢弃时高频出现。","/kjud freɪmz/"],["initial write fails","初始写入失败","指首次发送就失败的场景，常用于说明后续重试或数据保留行为。","/ˌɪnˈɪʃəl ɹˈaɪt fˈeɪlz/"],["minor release","次要版本发布","语义化版本中兼容旧接口的版本升级，用于说明改动不破坏兼容性。","/mˈaɪnɚ ɹilˈis/"]],"sentsHl":[["Apply the configured [[recovery policy]] to eligible WebSocket closures and report queued frames that could not be sent.","对符合条件的 WebSocket 关闭应用已配置的恢复策略，并上报那些无法发送的排队帧。"],["Recover from [[close code]]s 1001 and 1005 when reconnection is enabled; normal close 1000 without pending work still ends iteration.","在启用重连时，从关闭码 1001 和 1005 中恢复；而没有待处理工作的正常关闭 1000 仍会结束迭代。"],["Preserve typed and raw frame order through recovery and after an [[initial write fails]].","在恢复过程中以及初始写入失败之后，保持类型化帧与原始帧的顺序。"],["For callers waiting on an ordinary queued send, report a failure of their own frame even if another caller sent it.","对于等待普通排队发送的调用方，即使该帧是由另一个调用方发送的，也要向其报告自己那一帧的失败。"],["A final close prevents the old flusher from starting frames already reported unsent, while keeping those frames available for the reader's report.","最终关闭会阻止旧的刷新器启动那些已上报为未发送的帧，同时让这些帧仍可供读取方上报使用。"],["If your application treats [[close code]]s 1001 or 1005 as completion, disable recovery or abort the connection when that work is complete.","如果你的应用将关闭码 1001 或 1005 视为完成，请禁用恢复，或在相关工作完成时中止连接。"]]},"https://github.com/nodejs/node/pull/67242":{"titleZh":"测试：在没有 proc io 的情况下跳过 readFileSync 管道测试","sents":[["The readFileSync short reads regression test depends on /proc/<pid>/io, which is not present on some Linux systems.","readFileSync 短读回归测试依赖于 /proc/<pid>/io，而某些 Linux 系统上并不存在该文件。"],["It now skips when /proc/self/io is unavailable.","现在当 /proc/self/io 不可用时，该测试会被跳过。"],["Verification: git diff --check passed.","验证：git diff --check 已通过。"],["python tools/test.py --mode=release parallel/test-fs-readfilesync-pipe-short-reads could not run because this checkout has no built Release/node.exe.","python tools/test.py --mode=release parallel/test-fs-readfilesync-pipe-short-reads 无法运行，因为该检出目录中没有构建好的 Release/node.exe。"],["**Regression test:** untested: CONTRIBUTING does not mention tests","**回归测试：** 未测试：CONTRIBUTING 中没有提及测试相关内容。"]],"phrases":[["regression test","回归测试","指防止已修复缺陷再次出现的自动化测试，常用搭配 run/skip a regression test。","/ɹəɡɹˈɛʃən tˈɛst/"],["depends on","依赖于","描述前置条件时最常用；后接名词或动名词，比 rely on 更中性。","/dɪpˈɛndz ˈɑn/"],["not present on some systems","在某些系统上不存在","描述平台差异时的常见句式，可替换为 unavailable on ...。","/nˈɑt pɹˈɛzənt ˈɑn sˈʌm sˈɪstəmz/"],["could not run because ...","因……而无法运行","PR 验证说明中高频句式，用于解释测试未执行的原因。","/kʊd nɑt rʌn bɪˈkɔz .../"],["checkout","检出（的代码副本）","Git 术语，指本地某次检出得到的代码目录，常与 built artifacts 搭配讨论。","/tʃˈɛkˌaʊt/"]],"sentsHl":[["The readFileSync short reads [[regression test]] depends on /proc/<pid>/io, which is not present on some Linux systems.","readFileSync 短读回归测试依赖于 /proc/<pid>/io，而某些 Linux 系统上并不存在该文件。"],["It now skips when /proc/self/io is unavailable.","现在当 /proc/self/io 不可用时，该测试会被跳过。"],["Verification: git diff --check passed.","验证：git diff --check 已通过。"],["python tools/test.py --mode=release parallel/test-fs-readfilesync-pipe-short-reads could not run because this [[checkout]] has no built Release/node.exe.","python tools/test.py --mode=release parallel/test-fs-readfilesync-pipe-short-reads 无法运行，因为该检出目录中没有构建好的 Release/node.exe。"],["**[[Regression test]]:** untested: CONTRIBUTING does not mention tests","**回归测试：** 未测试：CONTRIBUTING 中没有提及测试相关内容。"]]},"https://github.com/openai/openai-python/pull/4205":{"titleZh":"feat(api)：新增组织外部密钥管理","sents":[["feat(api): add organization external key management","feat(api)：新增组织外部密钥管理"],["Add organization external-key registration and validation for AWS, GCP and Azure.","为 AWS、GCP 和 Azure 添加组织外部密钥的注册与验证。"],["Create, retrieve, list, delete and validate organization external-key registrations.","创建、获取、列出、删除并验证组织外部密钥注册。"],["Filter external-key listings by purpose and paginate through results.","按用途筛选外部密钥列表，并对结果进行分页。"]],"phrases":[["external-key registration","外部密钥注册","指将外部密钥登记到系统中，以便后续校验或管理。","/ɪkˈstɜrnəl ki ˌrɛdʒəˈstreɪʃən/"],["validation for AWS, GCP and Azure","针对 AWS、GCP 和 Azure 的验证","多个云平台并列时用 and 连接，for 表示验证对象。","/ˌvælɪˈdeɪʃən fər ˌeɪˌdʌbəljuˈɛs, ˌdʒiˌsiˈpi ænd ˈæʒər/"],["create, retrieve, list, delete and validate","创建、获取、列出、删除并验证","常见 CRUD 动词并列，末尾可再加 validate 表示校验操作。","/kɹiˈeɪt ɹɪtɹˈiv lˈɪst dɪlˈit ənd vˈælədeɪt/"],["filter ... by purpose","按用途筛选……","filter by 后接筛选维度，purpose 表示用途。","/ˈfɪltər ... baɪ ˈpɜrpəs/"],["paginate through results","对结果进行分页","paginate through 表示分页浏览或遍历结果集。","/ˈpædʒəˌneɪt θru rɪˈzʌlts/"]],"sentsHl":[["feat(api): add organization external key management","feat(api)：新增组织外部密钥管理"],["Add organization [[external-key registration]] and validation for AWS, GCP and Azure.","为 AWS、GCP 和 Azure 添加组织外部密钥的注册与验证。"],["[[Create, retrieve, list, delete and validate]] organization [[external-key registration]]s.","创建、获取、列出、删除并验证组织外部密钥注册。"],["Filter external-key listings by purpose and [[paginate through results]].","按用途筛选外部密钥列表，并对结果进行分页。"]]},"https://github.com/vercel/next.js/pull/100948":{"titleZh":"turbo-tasks：支持以 IndexMap 为底层存储的 AutoMap 和 AutoSet","sents":[["`AutoMap` and `AutoSet` from the `auto-hash-map` crate can now use an `IndexMap` as their backing map, which makes them insertion ordered:","`auto-hash-map` crate 中的 `AutoMap` 和 `AutoSet` 现在可以使用 `IndexMap` 作为底层映射，从而使其保持插入顺序："],["`AutoMap`/`AutoSet` are now type aliases of new generic `RawAutoMap<K, V, M, L>` / `RawAutoSet<K, M, L>` types. `M` is the backing map storage and `L` is the backing list storage used while the collection is small.","`AutoMap`/`AutoSet` 现在是新的泛型类型 `RawAutoMap<K, V, M, L>` / `RawAutoSet<K, M, L>` 的类型别名。`M` 是底层映射存储，`L` 是集合较小时使用的底层列表存储。"],["The `AutoMap`/`AutoSet` aliases keep their existing parameters (`H`, `I`) and mean exactly what they did before: `HashMap` + `TinyVec`, with unchanged size, behavior, and hashing. Existing users compile without changes.","`AutoMap`/`AutoSet` 别名保留其现有参数（`H`、`I`），含义与之前完全相同：`HashMap` + `TinyVec`，大小、行为和哈希均未改变。现有用户无需修改即可编译。"],["New `OrderedAutoMap`/`OrderedAutoSet` aliases use `IndexMap` + `TinyVec`. They keep insertion order in both the list and the map representation, and their equality is order sensitive: `{a, b} != {b, a}`.","新的 `OrderedAutoMap`/`OrderedAutoSet` 别名使用 `IndexMap` + `TinyVec`。它们在列表和映射两种表示中都保持插入顺序，并且其相等性对顺序敏感：`{a, b} != {b, a}`。"],["The list-then-map optimization of `AutoMap`/`AutoSet` is useful for collections whose iteration order matters too. Until now the only option for those was a plain `IndexMap`/`IndexSet`, which costs a hash table allocation even for one or two entries.","`AutoMap`/`AutoSet` 的“先列表后映射”优化对于迭代顺序也很重要的集合同样有用。在此之前，这类集合唯一的选择是普通的 `IndexMap`/`IndexSet`，即使只有一两个条目也要分配哈希表。"],["`BackingMapStorage::eq` compares two map storages: the hash map order-insensitively, as before, the index map by its iteration sequence (`IndexMap`'s own `PartialEq` ignores order).","`BackingMapStorage::eq` 比较两个映射存储：哈希映射和以前一样不敏感于顺序，索引映射则按其迭代序列比较（`IndexMap` 自身的 `PartialEq` 忽略顺序）。"]],"phrases":[["type alias","类型别名","Rust 中用 `type` 关键字为已有类型起新名字，常见于简化泛型签名。","/tˈaɪp ˈeɪliəs/"],["backing map","底层映射","指实际存储数据的容器，与上层包装类型相对。","/bˈækɪŋ mˈæp/"],["insertion ordered","按插入顺序排列","描述集合保持元素插入先后顺序的特性，常用于对比无序的 HashMap。","/ˌɪnsˈɝʃən ˈɔɹdɚd/"],["iteration order","迭代顺序","遍历集合时元素的返回顺序；对顺序敏感的代码必须明确依赖它。","/ˌɪtɚˈeɪʃən ˈɔɹdɚ/"],["order sensitive","对顺序敏感","表示相等性比较或结果会受元素顺序影响，反义为 order-insensitive。","/ˈɔɹdɚ sˈɛnsətɪv/"]],"sentsHl":[["`AutoMap` and `AutoSet` from the `auto-hash-map` crate can now use an `IndexMap` as their [[backing map]], which makes them insertion ordered:","`auto-hash-map` crate 中的 `AutoMap` 和 `AutoSet` 现在可以使用 `IndexMap` 作为底层映射，从而使其保持插入顺序："],["`AutoMap`/`AutoSet` are now [[type alias]]es of new generic `RawAutoMap<K, V, M, L>` / `RawAutoSet<K, M, L>` types. `M` is the backing map storage and `L` is the backing list storage used while the collection is small.","`AutoMap`/`AutoSet` 现在是新的泛型类型 `RawAutoMap<K, V, M, L>` / `RawAutoSet<K, M, L>` 的类型别名。`M` 是底层映射存储，`L` 是集合较小时使用的底层列表存储。"],["The `AutoMap`/`AutoSet` aliases keep their existing parameters (`H`, `I`) and mean exactly what they did before: `HashMap` + `TinyVec`, with unchanged size, behavior, and hashing. Existing users compile without changes.","`AutoMap`/`AutoSet` 别名保留其现有参数（`H`、`I`），含义与之前完全相同：`HashMap` + `TinyVec`，大小、行为和哈希均未改变。现有用户无需修改即可编译。"],["New `OrderedAutoMap`/`OrderedAutoSet` aliases use `IndexMap` + `TinyVec`. They keep insertion order in both the list and the map representation, and their equality is [[order sensitive]]: `{a, b} != {b, a}`.","新的 `OrderedAutoMap`/`OrderedAutoSet` 别名使用 `IndexMap` + `TinyVec`。它们在列表和映射两种表示中都保持插入顺序，并且其相等性对顺序敏感：`{a, b} != {b, a}`。"],["The list-then-map optimization of `AutoMap`/`AutoSet` is useful for collections whose [[iteration order]] matters too. Until now the only option for those was a plain `IndexMap`/`IndexSet`, which costs a hash table allocation even for one or two entries.","`AutoMap`/`AutoSet` 的“先列表后映射”优化对于迭代顺序也很重要的集合同样有用。在此之前，这类集合唯一的选择是普通的 `IndexMap`/`IndexSet`，即使只有一两个条目也要分配哈希表。"],["`BackingMapStorage::eq` compares two map storages: the hash map order-insensitively, as before, the index map by its iteration sequence (`IndexMap`'s own `PartialEq` ignores order).","`BackingMapStorage::eq` 比较两个映射存储：哈希映射和以前一样不敏感于顺序，索引映射则按其迭代序列比较（`IndexMap` 自身的 `PartialEq` 忽略顺序）。"]]},"https://github.com/vercel/next.js/pull/100873":{"titleZh":"turbo-tasks-backend：将早期聚合边移除追踪为跟随者债务而非重试","sents":[["Replace aggregation-edge removal retries with **negative follower counts** (\"debt\").","用**负的跟随者计数**（“债务”）替代聚合边移除重试。"],["A removal that overtakes its addition records debt; the late addition cancels it instead of spinning, requeuing, or eventually panicking.","先于添加发生的移除会记录债务；迟到的添加会抵消这笔债务，而不是自旋、重新入队或最终 panic。"],["An edge `U → F` lives either in `F.upper[U]` (unsigned) or in `U.followers[F]` (now `i32`).","一条边 `U → F` 要么存在于 `F.upper[U]`（无符号）中，要么存在于 `U.followers[F]`（现在为 `i32`）中。"],["**Only followers can go negative. Only counts greater than zero are real edges.**","**只有跟随者计数可以为负。只有大于零的计数才是真实边。**"],["**Removal, without a pair lock:** decrement an existing inner edge under F's lock; otherwise decrement the follower count under U's lock, possibly creating debt.","**移除操作，不持有配对锁：** 在 F 的锁下递减已有的内部边计数；否则在 U 的锁下递减跟随者计数，可能产生债务。"],["**Addition:** pay existing debt on the follower side before creating an inner edge.","**添加操作：** 在创建内部边之前，先偿还跟随者侧的已有债务。"]],"phrases":[["aggregation-edge removal","聚合边移除","aggregation 修饰 edge，指图聚合结构中删除边的操作。","/ˌæɡrəˈɡeɪʃən ɛdʒ rɪˈmuvəl/"],["negative follower counts","负跟随者计数","用计数为负表示“欠账”，是并发控制中的常见技巧。","/nˈɛɡətɪv fˈɑloʊɚ kˈaʊnts/"],["concurrent graph-churn stress tests","并发图频繁变更压力测试","churn 指频繁创建与销毁造成的动荡，stress test 为压力测试。","/kənˈkɜrənt ɡræf tʃɜrn strɛs tɛsts/"],["under F's lock","在 F 的锁保护下","under ... lock 表示持有某把锁执行操作，技术写作高频。","/ˈʌndɚ ˈɛfs lˈɑk/"],["schedule `BalanceEdge`","调度 `BalanceEdge`","schedule 后接任务名，表示安排执行某个平衡操作。","/ˈskɛdʒul ˈbæləns ɛdʒ/"]],"sentsHl":[["Replace [[aggregation-edge removal]] retries with **negative follower counts** (\"debt\").","用**负的跟随者计数**（“债务”）替代聚合边移除重试。"],["A removal that overtakes its addition records debt; the late addition cancels it instead of spinning, requeuing, or eventually panicking.","先于添加发生的移除会记录债务；迟到的添加会抵消这笔债务，而不是自旋、重新入队或最终 panic。"],["An edge `U → F` lives either in `F.upper[U]` (unsigned) or in `U.followers[F]` (now `i32`).","一条边 `U → F` 要么存在于 `F.upper[U]`（无符号）中，要么存在于 `U.followers[F]`（现在为 `i32`）中。"],["**Only followers can go negative. Only counts greater than zero are real edges.**","**只有跟随者计数可以为负。只有大于零的计数才是真实边。**"],["**Removal, without a pair lock:** decrement an existing inner edge [[under F's lock]]; otherwise decrement the follower count under U's lock, possibly creating debt.","**移除操作，不持有配对锁：** 在 F 的锁下递减已有的内部边计数；否则在 U 的锁下递减跟随者计数，可能产生债务。"],["**Addition:** pay existing debt on the follower side before creating an inner edge.","**添加操作：** 在创建内部边之前，先偿还跟随者侧的已有债务。"]]},"https://github.com/microsoft/vscode/pull/346656":{"titleZh":"性能优化：批量处理测试资源管理器的测试运行更新","sents":[["Large Test Explorer runs send a separate RPC for each test registration, state change, message and output chunk.","大型测试资源管理器运行会为每个测试注册、状态变更、消息和输出块分别发送一次 RPC。"],["Thousands of these messages add work in the extension host and renderer.","成千上万条这样的消息会增加扩展主机和渲染进程的工作量。"],["Batch ordered updates in `BatchedTestRunRpc`, with limits on batch size and payload.","在 `BatchedTestRunRpc` 中批量处理有序更新，并限制批次大小和载荷。"],["Flush pending updates before task completion, coverage, result-reading commands and retirement.","在任务完成、覆盖率、读取结果的命令以及退役之前，刷新待处理的更新。"],["Support both string and buffer output, and preserve results when profiles share a run.","同时支持字符串和缓冲区输出，并在多个配置共享同一次运行时保留结果。"],["5000 Mocha tests","5000 个 Mocha 测试"]],"phrases":[["send a separate RPC","发送单独的 RPC","用于描述每个操作都要额外发起一次远程调用，常用来引出性能问题。","/sɛnd ə ˈsɛpərət ˌɑr pi ˈsi/"],["batch ordered updates","批量处理有序更新","batch 作动词表示“批量处理”，ordered 强调更新顺序不能乱。","/bˈætʃ ˈɔɹdɚd əpdˈeɪts/"],["limit on batch size and payload","限制批次大小和载荷","limit on 后接被限制的对象；payload 指单次请求携带的数据量。","/lˈɪmət ˈɑn bˈætʃ sˈaɪz ənd pˈeɪlˌoʊd/"],["flush pending updates","刷新待处理的更新","flush 在技术语境中常指把缓冲中的待处理数据立即写出。","/flˈʌʃ pˈɛndɪŋ əpdˈeɪts/"],["preserve results","保留结果","在并发或共享场景中强调不丢失已有数据。","/pɹəzˈɝv ɹɪzˈʌlts/"]],"sentsHl":[["Large Test Explorer runs [[send a separate RPC]] for each test registration, state change, message and output chunk.","大型测试资源管理器运行会为每个测试注册、状态变更、消息和输出块分别发送一次 RPC。"],["Thousands of these messages add work in the extension host and renderer.","成千上万条这样的消息会增加扩展主机和渲染进程的工作量。"],["[[Batch ordered updates]] in `BatchedTestRunRpc`, with limits on batch size and payload.","在 `BatchedTestRunRpc` 中批量处理有序更新，并限制批次大小和载荷。"],["[[Flush pending updates]] before task completion, coverage, result-reading commands and retirement.","在任务完成、覆盖率、读取结果的命令以及退役之前，刷新待处理的更新。"],["Support both string and buffer output, and [[preserve results]] when profiles share a run.","同时支持字符串和缓冲区输出，并在多个配置共享同一次运行时保留结果。"],["5000 Mocha tests","5000 个 Mocha 测试"]]},"https://github.com/rust-lang/rust/pull/165458":{"titleZh":"修复 MSVC 上不正确的字节计数后缀","sents":[["fixes rust-lang/rust#165299","修复 rust-lang/rust#165299"],["this moves the byte count calculation into a shared helper in `rustc_codegen_ssa`.","这将字节计数计算移入 `rustc_codegen_ssa` 中的一个共享辅助函数。"],["Please read our [LLM policy] before opening a PR,","在提交 PR 之前，请阅读我们的 [LLM 政策]，"],["If you used an LLM to generate any part of this PR, including the PR description, please disclose that according to our [guidelines][disclosure guidelines].","如果你使用 LLM 生成了此 PR 的任何部分（包括 PR 描述），请根据我们的[指南][disclosure guidelines]进行披露。"],["LLM contributions are not banned, but are held to a higher standard of review and correctness.","LLM 贡献并未被禁止，但会按照更高的审查和正确性标准来要求。"],["When merged, your PR's description becomes part of the commit message of a merge commit.","合并后，你的 PR 描述会成为合并提交的提交信息的一部分。"]],"phrases":[["byte count suffix","字节计数后缀","指编译输出中表示字节数的后缀，如 b、kb 等单位标记。","/bˈaɪt kˈaʊnt sˈʌfɪks/"],["shared helper","共享辅助函数","指被多个模块复用的工具函数，常用于重构时提取公共逻辑。","/ʃˈɛɹd hˈɛlpɚ/"],["commit message","提交信息","git commit 时填写的说明文字，PR 描述合并后会成为其一部分。","/kəmˈɪt mˈɛsədʒ/"],["merge commit","合并提交","合并分支时生成的提交，通常包含被合并 PR 的描述。","/mˈɝdʒ kəmˈɪt/"],["tracking issue","跟踪 issue","用于跟踪某个特性或长期任务进展的 GitHub issue。","/tɹˈækɪŋ ˈɪʃu/"]],"sentsHl":[["fixes rust-lang/rust#165299","修复 rust-lang/rust#165299"],["this moves the byte count calculation into a [[shared helper]] in `rustc_codegen_ssa`.","这将字节计数计算移入 `rustc_codegen_ssa` 中的一个共享辅助函数。"],["Please read our [LLM policy] before opening a PR,","在提交 PR 之前，请阅读我们的 [LLM 政策]，"],["If you used an LLM to generate any part of this PR, including the PR description, please disclose that according to our [guidelines][disclosure guidelines].","如果你使用 LLM 生成了此 PR 的任何部分（包括 PR 描述），请根据我们的[指南][disclosure guidelines]进行披露。"],["LLM contributions are not banned, but are held to a higher standard of review and correctness.","LLM 贡献并未被禁止，但会按照更高的审查和正确性标准来要求。"],["When merged, your PR's description becomes part of the [[commit message]] of a merge commit.","合并后，你的 PR 描述会成为合并提交的提交信息的一部分。"]]},"https://github.com/openai/openai-python/pull/4215":{"titleZh":"feat(api)：支持 WebSocket 预热并保留取消操作","sents":[["Add optional `generate` to stable and beta Responses WebSocket create events.","为稳定版和测试版 Responses WebSocket 创建事件添加可选的 `generate` 字段。"],["An unset field stays absent from the request; explicit `false` and `true` stay on the wire.","未设置的字段不会出现在请求中；显式的 `false` 和 `true` 会保留在传输报文中。"],["Preserve cancellation raised while a WebSocket connection closes, even when the context body already raised an error.","在 WebSocket 连接关闭期间引发的取消操作会被保留，即使上下文主体已经抛出了错误。"],["The seven Realtime, translation, Live, and Responses manager paths still preserve the original body error if ordinary cleanup fails.","如果普通清理失败，七条 Realtime、翻译、Live 和 Responses 管理器路径仍会保留原始主体错误。"],["Their cleanup handlers catch `Exception`, so cancellation and other process-control exceptions propagate.","它们的清理处理程序会捕获 `Exception`，因此取消操作和其他进程控制异常会继续向上传播。"],["Validation: 2,014 tests passed against installed SDK wheels across Pydantic v1 and v2.","验证：针对已安装的 SDK wheel 包，在 Pydantic v1 和 v2 下共 2,014 项测试通过。"]],"phrases":[["WebSocket warmup","WebSocket 预热","指在正式建立连接前预先完成握手或初始化，常用于降低首次请求延迟。","/ˈwɛbˌsɑkɪt ˈwɔrmˌʌp/"],["create events","创建事件","API 中表示“创建”动作的事件类型，常与 WebSocket 或消息队列搭配。","/kɹiˈeɪt ɪvˈɛnts/"],["stay on the wire","保留在传输报文中","on the wire 指实际网络传输的数据，强调字段不会被序列化时省略。","/stˈeɪ ˈɑn ðə wˈaɪɚ/"],["process-control exceptions","进程控制异常","如取消、超时等用于控制进程生命周期的异常，通常不应被普通异常处理吞掉。","/ˈprɑsɛs kənˈtroʊl ɪkˈsɛpʃənz/"],["SDK wheels","SDK wheel 包","wheel 是 Python 的预编译安装包格式，常与 installed、build 等词搭配。","/ˌɛs di ˈkeɪ wilz/"]],"sentsHl":[["Add optional `generate` to stable and beta Responses WebSocket [[create events]].","为稳定版和测试版 Responses WebSocket 创建事件添加可选的 `generate` 字段。"],["An unset field stays absent from the request; explicit `false` and `true` [[stay on the wire]].","未设置的字段不会出现在请求中；显式的 `false` 和 `true` 会保留在传输报文中。"],["Preserve cancellation raised while a WebSocket connection closes, even when the context body already raised an error.","在 WebSocket 连接关闭期间引发的取消操作会被保留，即使上下文主体已经抛出了错误。"],["The seven Realtime, translation, Live, and Responses manager paths still preserve the original body error if ordinary cleanup fails.","如果普通清理失败，七条 Realtime、翻译、Live 和 Responses 管理器路径仍会保留原始主体错误。"],["Their cleanup handlers catch `Exception`, so cancellation and other [[process-control exceptions]] propagate.","它们的清理处理程序会捕获 `Exception`，因此取消操作和其他进程控制异常会继续向上传播。"],["Validation: 2,014 tests passed against installed [[SDK wheels]] across Pydantic v1 and v2.","验证：针对已安装的 SDK wheel 包，在 Pydantic v1 和 v2 下共 2,014 项测试通过。"]]},"https://github.com/microsoft/vscode/pull/345730":{"titleZh":"聊天：将宿主自有的 Microsoft 凭据桥接到 Copilot","sents":[["Builds on merged #345132 and targets `main`.","基于已合并的 #345132，目标分支为 `main`。"],["This is the credential-bridge layer of native [stack #345731](https://github.com/microsoft/vscode/stack/345731): it lets the Agent Host's Copilot provider use Microsoft credentials that VS Code owns, without adding a sign-in flow, a protocol method or a token store.","这是原生 [stack #345731](https://github.com/microsoft/vscode/stack/345731) 的凭据桥接层：它让 Agent Host 的 Copilot 提供程序使用 VS Code 拥有的 Microsoft 凭据，而无需新增登录流程、协议方法或令牌存储。"],["When `chat.agentHost.copilot.m365.enabled` was on at the time the host started (the startup-effective value from #345132), the Copilot provider passes the SDK's `entra.tokenProvider` a callback backed by credentials received over the existing `authenticate` request.","当宿主启动时 `chat.agentHost.copilot.m365.enabled` 处于开启状态（即 #345132 中的启动时生效值），Copilot 提供程序会向 SDK 的 `entra.tokenProvider` 传入一个回调，该回调由通过现有 `authenticate` 请求收到的凭据支撑。"],["The callback never waits: it returns a matching stored credential, or `unavailable` while advertising the requirement through the existing `auth/required` notification.","该回调从不等待：它返回匹配的已存储凭据，或者在通过现有 `auth/required` 通知通告该需求的同时返回 `unavailable`。"],["A credential is accepted only for the advertised resource and scopes, from the Microsoft account the host is already bound to.","凭据仅针对所通告的资源和作用域、来自宿主已绑定的 Microsoft 账户时才会被接受。"],["A different account is rejected rather than substituted.","不同的账户会被拒绝，而不会被替换。"]],"phrases":[["credential-bridge layer","凭据桥接层","用于描述在两个组件之间传递凭据的中间层。","/krɪˈdɛnʃəl brɪdʒ ˈleɪər/"],["sign-in flow","登录流程","常见于认证相关 PR，指用户登录的完整交互过程。","/ˈsaɪn ɪn floʊ/"],["token provider","令牌提供程序","SDK 中负责获取令牌的接口或组件名。","/tˈoʊkən pɹəvˈaɪdɚ/"],["startup-effective value","启动时生效值","强调配置在启动时读取并固定，后续变更不回溯生效。","/ˈstɑrtʌp ɪˈfɛktɪv ˈvælju/"],["advertised resource and scopes","所通告的资源和作用域","认证场景中描述服务端声明可接受的资源与权限范围。","/ˈædvɚtˌaɪzd ɹˈisɔɹs ənd skˈoʊps/"]],"sentsHl":[["Builds on merged #345132 and targets `main`.","基于已合并的 #345132，目标分支为 `main`。"],["This is the [[credential-bridge layer]] of native [stack #345731](https://github.com/microsoft/vscode/stack/345731): it lets the Agent Host's Copilot provider use Microsoft credentials that VS Code owns, without adding a sign-in flow, a protocol method or a token store.","这是原生 [stack #345731](https://github.com/microsoft/vscode/stack/345731) 的凭据桥接层：它让 Agent Host 的 Copilot 提供程序使用 VS Code 拥有的 Microsoft 凭据，而无需新增登录流程、协议方法或令牌存储。"],["When `chat.agentHost.copilot.m365.enabled` was on at the time the host started (the [[startup-effective value]] from #345132), the Copilot provider passes the SDK's `entra.tokenProvider` a callback backed by credentials received over the existing `authenticate` request.","当宿主启动时 `chat.agentHost.copilot.m365.enabled` 处于开启状态（即 #345132 中的启动时生效值），Copilot 提供程序会向 SDK 的 `entra.tokenProvider` 传入一个回调，该回调由通过现有 `authenticate` 请求收到的凭据支撑。"],["The callback never waits: it returns a matching stored credential, or `unavailable` while advertising the requirement through the existing `auth/required` notification.","该回调从不等待：它返回匹配的已存储凭据，或者在通过现有 `auth/required` 通知通告该需求的同时返回 `unavailable`。"],["A credential is accepted only for the [[advertised resource and scopes]], from the Microsoft account the host is already bound to.","凭据仅针对所通告的资源和作用域、来自宿主已绑定的 Microsoft 账户时才会被接受。"],["A different account is rejected rather than substituted.","不同的账户会被拒绝，而不会被替换。"]]},"https://github.com/nodejs/node/pull/67239":{"titleZh":"sea：在第 0 层将 SEA VFS 挂载到 worker 中","sents":[["A single executable application built with `\"useVfs\": true` and plain `\"assets\"` mounts its VFS only in the main thread, at a mount point numbered in mount order.","使用 `\"useVfs\": true` 和普通 `\"assets\"` 构建的单可执行应用程序仅在主线程中挂载其 VFS，挂载点按挂载顺序编号。"],["A worker started from a path into it, such as a worker script bundled as an asset, finds nothing there.","从该路径启动的 worker（例如作为资源打包的 worker 脚本）在那里找不到任何内容。"],["On Windows the failure is especially confusing: paths under `\\\\.\\nul` open the NUL device, so the loader \"finds\" the file and then rejects `\\\\.\\nul\\package.json` as an invalid package.json (`ERR_INVALID_PACKAGE_CONFIG`).","在 Windows 上，这种失败尤其令人困惑：`\\\\.\\nul` 下的路径会打开 NUL 设备，因此加载器“找到”了文件，然后以无效的 package.json（`ERR_INVALID_PACKAGE_CONFIG`）为由拒绝 `\\\\.\\nul\\package.json`。"],["Layer 1 is reserved for the assets of such a SEA, so the mount point is the same in every thread whatever else a thread mounts.","第 1 层保留给此类 SEA 的资源，因此无论线程挂载什么其他内容，每个线程中的挂载点都相同。"],["For a VFS mounted with `vfs.mount()`, which a worker cannot see, the worker now fails with a new `ERR_VFS_NOT_MOUNTED` instead of whatever the real file system answers.","对于使用 `vfs.mount()` 挂载的 VFS（worker 无法看到它），worker 现在会以新的 `ERR_VFS_NOT_MOUNTED` 失败，而不是返回真实文件系统的任何响应。"]],"phrases":[["single executable application","单可执行应用程序","Node.js 中打包为单个可执行文件的术语，常缩写为 SEA。","/ˈsɪŋɡəl ɪɡˈzɛkjətɪv ˌæplɪˈkeɪʃən/"],["mount point","挂载点","文件系统或虚拟文件系统挂载的位置标识。","/mˈaʊnt pˈɔɪnt/"],["worker thread","工作线程","Node.js 中通过 worker_threads 创建的线程，与主线程隔离。","/wˈɝkɚ θɹˈɛd/"],["reserved for","保留给","表示某资源或编号专门留给特定用途，常用于配置或层编号。","/ɹɪzˈɝvd fˈɔɹ/"],["fail with an error","以错误失败","描述程序抛出特定错误而终止，后接错误码或错误名。","/fˈeɪl wˈɪð ˈæn ˈɛɹɚ/"]],"sentsHl":[["A [[single executable application]] built with `\"useVfs\": true` and plain `\"assets\"` mounts its VFS only in the main thread, at a mount point numbered in mount order.","使用 `\"useVfs\": true` 和普通 `\"assets\"` 构建的单可执行应用程序仅在主线程中挂载其 VFS，挂载点按挂载顺序编号。"],["A worker started from a path into it, such as a worker script bundled as an asset, finds nothing there.","从该路径启动的 worker（例如作为资源打包的 worker 脚本）在那里找不到任何内容。"],["On Windows the failure is especially confusing: paths under `\\\\.\\nul` open the NUL device, so the loader \"finds\" the file and then rejects `\\\\.\\nul\\package.json` as an invalid package.json (`ERR_INVALID_PACKAGE_CONFIG`).","在 Windows 上，这种失败尤其令人困惑：`\\\\.\\nul` 下的路径会打开 NUL 设备，因此加载器“找到”了文件，然后以无效的 package.json（`ERR_INVALID_PACKAGE_CONFIG`）为由拒绝 `\\\\.\\nul\\package.json`。"],["Layer 1 is [[reserved for]] the assets of such a SEA, so the [[mount point]] is the same in every thread whatever else a thread mounts.","第 1 层保留给此类 SEA 的资源，因此无论线程挂载什么其他内容，每个线程中的挂载点都相同。"],["For a VFS mounted with `vfs.mount()`, which a worker cannot see, the worker now fails with a new `ERR_VFS_NOT_MOUNTED` instead of whatever the real file system answers.","对于使用 `vfs.mount()` 挂载的 VFS（worker 无法看到它），worker 现在会以新的 `ERR_VFS_NOT_MOUNTED` 失败，而不是返回真实文件系统的任何响应。"]]}},"hn":{"Local Wikipedia: Wikipedia, but only for things a half hour walk from you":{"zh":"本地维基：只收录步行半小时内的地点","note":"only for things 后接范围定语，是英语里压缩信息的高频结构"},"Anthropic S-1":{"zh":"Anthropic 提交 S-1（上市招股书）","note":"S-1 是美国 IPO 招股说明书，属专业术语"},"Quad9 to exit France":{"zh":"Quad9 宣布退出法国市场","note":"to exit 用于新闻标题，省略 will"},"Ghostty 1.4":{"zh":"终端模拟器 Ghostty 发布 1.4","note":"版本号直接作标题"},"eMudhra to exit global SSL/TLS certificate business":{"zh":"eMudhra 将退出全球 SSL/TLS 证书业务","note":"business 前叠加多个名词作定语"},"Three new discoveries in mathematics, computer science, and physics":{"zh":"数学、计算机科学与物理学的三项新发现","note":"列举学科的标准句式"},"Today, we hacked what we'd set out to hack: the iPhone":{"zh":"今天我们攻破了原本要攻破的目标：iPhone","note":"what 引导名词性从句，回指目标"},"Evidence of a spying operation by ICE against left-wing social movements":{"zh":"有证据显示 ICE 对左翼社会运动实施监视行动","note":"by/against 双介词叠加的信息密度"},"sshole":{"zh":"sshole（原文如此）","note":"sshole 不是标准英文单词，疑为截断或拼写错误；单独成题时通常只能保留原形并加注说明。"},"Astra can read and write weights to improve Qwen":{"zh":"Astra 能读写权重以改进 Qwen","note":"read and write 为并列动词结构；weights 在 AI 语境中指模型权重/参数。"},"WTF Ubuntu?":{"zh":"Ubuntu 搞什么鬼？","note":"WTF 是非正式缩略语；标题采用省略式疑问片段，表达惊讶或不满。"},"Claude Code sends your email address to websites":{"zh":"Claude Code 会把你的邮箱地址发送给网站","note":"send sth to sb/sth 表示把某物发送给某人/某处。"},"Postman silently auto-installs AI plugins and attempts to share all API data":{"zh":"Postman 静默自动安装 AI 插件，并试图共享所有 API 数据","note":"attempt to do sth 表示试图做某事；silently 作副词修饰 auto-installs。"},"AI is forcing us to pay off 40 years of technical debt":{"zh":"AI 正迫使我们偿还 40 function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function hl(t){ return esc(t).replace(/\[\[(.+?)\]\]/g,"<mark>$1</mark>"); }

function ghCard(item){
  const a = AN.gh[item.url] || {};
  const sents = a.sentsHl || a.sents || [];
  let h = '<article class="card">';
  h += '<div class="meta"><span class="chip repo">' + esc(item.full) + '</span>' +
       '<span class="chip">' + item.comments + ' 条评论</span>' +
       '<a class="link" href="' + esc(item.url) + '" target="_blank" rel="noopener">GitHub ↗</a></div>';
  if (a.titleZh) h += '<h2 class="zh">' + esc(a.titleZh) + '</h2>';
  h += '<p class="en">' + hl(item.title) + '</p>';
  if (sents.length) {
    h += '<ol class="sents">' + sents.map(function(p){
      return '<li><div class="en-line">' + hl(p[0]) + '</div><div class="zh-line">' + esc(p[1]) + '</div></li>';
    }).join("") + '</ol>';
  } else {
    h += '<div class="note">本条尚未生成中英对照（下次运行 refresh 时自动补齐）</div>';
  }
  if (a.phrases && a.phrases.length) {
    h += '<div class="phrases"><h3>重点搭配 · Key Collocations</h3><table class="ptable"><tbody>' +
      a.phrases.map(function(p){
        var ipaTxt = (p && p[3]) ? '<span class="ipa">' + esc(p[3]) + '</span>' : '';
        return '<tr><td class="k"><button class="say" data-say="' + esc(p[0]) + '" title="朗读">🔊</button>' +
               esc(p[0]) + ipaTxt + '</td><td>' + esc(p[1]) +
               (p[2] ? '<div class="n">' + esc(p[2]) + '</div>' : '') + '</td></tr>';
      }).join("") + '</tbody></table></div>';
  }
  if (item.body) {
    h += '<details class="raw"><summary>英文原文</summary><pre>' + esc(item.body) + '</pre></details>';
  }
  h += '</article>';
  return h;
}

function hnCard(item){
  const a = AN.hn[item.title] || {};
  let h = '<article class="card">';
  h += '<div class="meta">' +
       (item.points >= 800 ? '<span class="chip hot">' + item.points + ' 分</span>' : '<span class="chip">' + item.points + ' 分</span>') +
       '<span class="chip">' + item.comments + ' 条评论</span>' +
       '<a class="link" href="' + esc(item.hn) + '" target="_blank" rel="noopener">HN 讨论 ↗</a></div>';
  if (a.zh) h += '<h2 class="zh">' + esc(a.zh) + '</h2>';
  h += '<p class="en">' + hl(item.title) + '</p>';
  if (a.note) h += '<div class="note">' + esc(a.note) + '</div>';
  if (!a.zh) h += '<div class="note">本条尚未生成中文标题</div>';
  h += '</article>';
  return h;
}

function renderGh(){
  document.getElementById("tabGh").className = "on";
  document.getElementById("tabHn").className = "";
  document.getElementById("view").innerHTML = GH.length ? GH.map(ghCard).join("") : '<p class="empty">暂无数据</p>';
}
function renderHn(){
  document.getElementById("tabGh").className = "";
  document.getElementById("tabHn").className = "on";
  document.getElementById("view").innerHTML = HN.hn.length ? HN.hn.map(hnCard).join("") : '<p class="empty">暂无数据</p>';
}
function speak(text){
  try {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.9;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
document.addEventListener("click", function(ev){
  var btn = ev.target.closest("[data-say]");
  if (!btn) return;
  ev.preventDefault();
  speak(btn.getAttribute("data-say"));
});
document.getElementById("tabGh").addEventListener("click", renderGh);
document.getElementById("tabHn").addEventListener("click", renderHn);
(location.hash === "#hn") ? renderHn() : renderGh();
</script>
</body>
</html>
