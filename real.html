<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>真实语料 · Real English</title>
<style>
:root{
  --bg:#f6f7f9; --bg-2:#eef1f4; --card:#ffffff; --ink:#14181c; --ink-2:#3d4650;
  --muted:#6b7684; --line:#e4e8ed; --line-2:#f0f3f6;
  --brand:#0b7a5a; --brand-2:#0fa472; --brand-soft:#e7f6ef;
  --mark:#fff3c4; --mark-ink:#6b4d00;
  --code:#f4f6f8; --shadow:0 1px 2px rgba(16,24,32,.04),0 8px 24px -12px rgba(16,24,32,.14);
  --shadow-hover:0 2px 6px rgba(16,24,32,.06),0 18px 40px -18px rgba(16,24,32,.22);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1216; --bg-2:#131a20; --card:#161d24; --ink:#e8eef4; --ink-2:#c3ced8;
    --muted:#8b98a5; --line:#25303a; --line-2:#1d262e;
    --brand:#3ddc9f; --brand-2:#2ec98f; --brand-soft:#143027;
    --mark:#5a4a10; --mark-ink:#ffe89a; --code:#1b242c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
    --shadow-hover:0 2px 8px rgba(0,0,0,.35),0 20px 48px -20px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.68;-webkit-font-smoothing:antialiased;font-size:15px}
.wrap{max-width:920px;margin:0 auto;padding:0 20px 96px}

/* ---------- sticky header ---------- */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 72%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  padding:18px 0 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:19px;margin:0;letter-spacing:-.2px;font-weight:650}
.brand .latin{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.3px}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);display:inline-block;
  box-shadow:0 0 0 4px var(--brand-soft);margin-right:2px}
.sub{margin-top:5px;font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sep{width:1px;height:11px;background:var(--line);display:inline-block}
.bar{margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.segment{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.segment button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink-2);
  padding:6px 14px;border-radius:9px;cursor:pointer;transition:.18s;font-weight:500}
.segment button:hover{color:var(--ink)}
.segment button.on{background:var(--card);color:var(--brand);box-shadow:0 1px 3px rgba(16,24,32,.1);font-weight:600}
.ghost{margin-left:auto;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);
  color:var(--ink-2);padding:7px 13px;border-radius:10px;cursor:pointer;text-decoration:none;transition:.18s}
.ghost:hover{border-color:var(--brand);color:var(--brand)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px 20px;
  margin-top:16px;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));opacity:.85}
.card:hover{box-shadow:var(--shadow-hover)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.chip{background:var(--bg-2);border:1px solid var(--line);color:var(--ink-2);
  padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:500;letter-spacing:.2px}
.chip.repo{background:var(--brand-soft);border-color:transparent;color:var(--brand);font-weight:600}
.chip.hot{background:var(--mark);border-color:transparent;color:var(--mark-ink);font-weight:600}
.meta .link{margin-left:auto;color:var(--muted);text-decoration:none;font-size:12px;border-bottom:1px dashed var(--line)}
.meta .link:hover{color:var(--brand);border-color:var(--brand)}

h2.zh{margin:11px 0 3px;font-size:17.5px;line-height:1.45;font-weight:650;letter-spacing:-.15px}
p.en{margin:0;font-size:13.5px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  word-break:break-word}
p.en mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 2px;font-weight:600}

/* ---------- sentences ---------- */
ol.sents{list-style:none;margin:16px 0 0;padding:0;counter-reset:s}
ol.sents li{counter-increment:s;position:relative;padding:13px 0 13px 36px;border-top:1px solid var(--line-2)}
ol.sents li:first-child{border-top:0}
ol.sents li::before{content:counter(s);position:absolute;left:0;top:15px;width:22px;height:22px;
  border-radius:8px;background:var(--brand-soft);color:var(--brand);font-size:11.5px;display:grid;
  place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.en-line{font-size:15px;line-height:1.62;color:var(--ink)}
.en-line mark{background:var(--mark);color:var(--mark-ink);padding:1px 3px;border-radius:4px;font-weight:600}
.zh-line{margin-top:5px;color:var(--muted);font-size:13.5px;line-height:1.6}

/* ---------- phrases ---------- */
.phrases{margin-top:16px;border-top:1px solid var(--line-2);padding-top:14px}
.phrases h3{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.6px;text-transform:uppercase;margin:0 0 10px}
.ptable{width:100%;border-collapse:collapse;font-size:13.5px}
.ptable td{padding:7px 10px 7px 0;vertical-align:top;border-top:1px solid var(--line-2)}
.ptable tr:first-child td{border-top:0}
.ptable td.k{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.8px;
  color:var(--brand);font-weight:600;white-space:nowrap;padding-right:16px}
.ptable td.n{color:var(--muted);font-size:12.5px}
.ipa{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.8px;
  color:var(--muted);font-weight:400;margin-top:2px;letter-spacing:.2px}
.say{border:0;background:transparent;cursor:pointer;padding:0 5px 0 0;font-size:11px;opacity:.55;transition:.15s}
.say:hover{opacity:1}

/* ---------- raw ---------- */
details.raw{margin-top:14px;border-top:1px solid var(--line-2);padding-top:10px}
details.raw summary{cursor:pointer;font-size:12.5px;color:var(--muted);list-style:none;user-select:none}
details.raw summary::-webkit-details-marker{display:none}
details.raw summary::before{content:"▸ ";color:var(--brand)}
details.raw[open] summary::before{content:"▾ "}
details.raw pre{margin:10px 0 0;background:var(--code);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
  max-height:260px;overflow:auto;color:var(--ink-2)}

/* ---------- notes ---------- */
.note{margin-top:10px;background:var(--brand-soft);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--brand)}
.empty{color:var(--muted);font-size:14px;padding:32px 0;text-align:center}
.foot{margin-top:36px;text-align:center;color:var(--muted);font-size:12px}
@media (max-width:620px){
  .wrap{padding:0 14px 72px}
  .card{padding:18px 16px 16px;border-radius:16px}
  h2.zh{font-size:16px}
  .ptable td.k{white-space:normal}
  .ghost{margin-left:0}
}
</style>
</head>
<body>
<div class="top">
  <div class="wrap" style="padding-bottom:0">
    <div class="brand">
      <span class="dot"></span>
      <h1>真实语料</h1>
      <span class="latin">Real English · GitHub & HN</span>
    </div>
    <div class="sub">
      <span>每条均含中英对照</span><span class="sep"></span><span>更新 <span id="upd">2026/11/26</span></span>
    </div>
    <div class="bar">
      <div class="segment">
        <button id="tabGh" class="on">GitHub PR</button>
        <button id="tabHn">Hacker News</button>
      </div>
      <a class="ghost" href="index.html">← 精编 14 课</a>
    </div>
  </div>
</div>

<script>
const GH = [{"repo":"next.js","full":"vercel/next.js","title":"Turbopack: limited escape analysis for dynamic process.env access","comments":3,"url":"https://github.com/vercel/next.js/pull/102093","body":"### What?\n\nAdds a limited escape analysis for dynamic `process.env` access to `turbopack-ecmascript`. When a module uses `process.env` in a way that can't be analyzed statically (so it could read any env var), `EnvVarInfo.runtime_all` is set to `true`.\n\n**Detected**\n\n- Unknown keys: `process.env[key]`, `key in process.env`, `const { [key]: v } = process.env`, and existence checks with an unknown key (`process.env.hasOwnProperty(key)`, `propertyIsEnumerable(key)`, `Object.hasOwn(process.env, key)`, and their `.call` forms, see #102284)\n- `process.env.valueOf()` (also `Object.prototype.valueOf.call(process.env)`), which returns `process.env` itself\n- Optional method calls on `process.env` (`process.env.hasOwnProperty?.(key)`), conservatively, because the analyzer has no call effect for optional calls\n- `process.env` escaping as a whole value: `foo(process.env)`, `const env = process.env`, `export const e = process.env`, `{ ...rest } = process.env`, default parameters, and a destructuring assignment whose result is consumed\n- The same through other ways to reach `process.env`: aliases (`const p = process`), computed keys that resolve to `'env'` (`process[key]`, `process[cond ? 'env' : 'argv']`), `globalThis.process.env`, optional chains, imports from `process` / `node:process`, and `const { env } = process`\n\n**Deliberately not detected**\n\n- `process` itself escaping (`foo(process)`), and `foo(process[key])` with a completely unknown key, to avoid broad deopts\n- Re-exports like `"},{"repo":"next.js","full":"vercel/next.js","title":"Turbopack: treat process.env.hasOwnProperty(key) as an env var existence check","comments":4,"url":"https://github.com/vercel/next.js/pull/102284","body":"### What?\n\nTurbopack's env var tracking (`EnvVarInfo.runtime`) now treats these as existence checks of `FOO`, like `'FOO' in process.env`:\n\n- `process.env.hasOwnProperty('FOO')` and `process.env.propertyIsEnumerable('FOO')` (the same for env vars)\n- `Object.hasOwn(process.env, 'FOO')`, also extracted (`const { hasOwn } = Object`)\n- `Object.prototype.hasOwnProperty.call(process.env, 'FOO')`, `process.env.hasOwnProperty.call(process.env, 'FOO')`, and a destructured method called with `.call`\n\nSince this works on linked values rather than syntax, it also covers `import { env } from 'node:process'`, aliases (`const e = process.env`), computed method names (`process.env['hasOwnProperty']`) and keys that resolve to a constant (`const key = 'FOO'`).\n\nBefore this, these calls weren't understood: `FOO` wasn't listed at all. Only `hasOwnProperty` itself was recorded as a runtime env var read (from the `process.env.hasOwnProperty` member expression).\n\n### Why?\n\nCode checks for an env var with `process.env.hasOwnProperty(name)` and its equivalents, so its result depends on whether `FOO` is set. Consumers of `EnvVarInfo.runtime` should see that dependency, consistently for all of these forms.\n\n### How?\n\n- New well-known values: `WellKnownObjectKind::ObjectPrototype` (`Object.prototype`) and the functions `HasOwnProperty`, `PropertyIsEnumerable` (`Object.prototype` methods, also inherited by `process.env`), `ObjectHasOwn` and `FunctionCall` (`Function.prototype.call`, only for these method"},{"repo":"vscode","full":"microsoft/vscode","title":"Editor window: worktree support (chat.editorWindow.enableWorktree)","comments":33,"url":"https://github.com/microsoft/vscode/pull/348306","body":"## What\n\nIn a window with a single local folder, `chat.editorWindow.enableWorktree` (experimental, default off) lets local agent host chats work in git worktrees of that folder: the window's folder follows the chat you open to its worktree, and new chats can start in a new worktree.\n\n## Changes\n\n- **Folder follow** (`agentHostWorktree.contribution.ts`): opening a chat moves the folder to where it works, and back for a local chat; it also follows a chat's working directory as it changes. It remembers the last chat per location, marks terminals left behind, and returns the folder when the setting or AI is turned off. Telemetry: `editorWindow.worktreeFolderSwitch`.\n- **Locations** (`IAgentHostWorktreeLocations`): worktrees that agent host sessions work in become folder locations, for every folder location picker.\n- **Chat input**: the folder chip with a Worktrees section, or a New Worktree checkbox while the folder has no worktrees; the New Chat menu offers **New Chat in Worktree**.\n- **Work in Parallel** (`IAgentHostWorktreeSendChoiceService`): on the first send of a new chat in a folder with another chat active there in the last day, a callout on the worktree control asks once; later chats use the answer.\n- **Worktrees filter** in both sessions lists (editor windows only): pick a folder to see only its sessions; picking opens its last-shown session.\n- **Submit handlers** answer with an outcome (`Continue` / `Handled` / `Cancelled`).\n- Accessibility help describes the checkbox "},{"repo":"vscode","full":"microsoft/vscode","title":"Check the release age and source of added dependencies in PR checks","comments":0,"url":"https://github.com/microsoft/vscode/pull/350048","body":"Adds a **Dependency Release Age** job to the PR workflow, which PR Gate reports. It checks the package versions that a change adds to `pnpm-lock.yaml`, `package-lock.json` and `Cargo.lock` against the dependency policy, using only public registry data, so it works the same for pull requests from forks and in the merge queue.\n\nFor every package version that a lockfile adds, compared with the base branch (for a merge group, with the commit of `main` that the group forks from):\n\n1. **Source:** it must resolve from `registry.npmjs.org` or crates.io. Git repositories, tarball URLs and other registries fail. Local workspace packages are ignored. The one exception is the CLI's crates from `github.com/microsoft/dev-tunnels` and `github.com/microsoft/vscode-russh`, which are allowed at any revision.\n2. **Release age:** it must have been published at least `minimumReleaseAge` minutes ago, as set by the nearest `pnpm-workspace.yaml` (the root one for `Cargo.lock`). Versions that its `minimumReleaseAgeExclude` lists are exempt, matched the way pnpm matches them. Versions that a lockfile on the base branch already locks aren't checked again.\n3. **Output:** each failure is an annotation on the lockfile that names the package, the version, when it was published and when it becomes allowed. Lockfiles that can't be parsed, for example with merge conflict markers, fail too.\n\nThe `packageManager` pnpm version in `package.json` is checked the same way.\n\n### Wiring\n\n- Detect Changes gets a `depen"},{"repo":"rust","full":"rust-lang/rust","title":"fix: non-deterministic temporary object paths in linker maps","comments":33,"url":"https://github.com/rust-lang/rust/pull/165971","body":"<!-- homu-ignore:start -->\n*[View all comments](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/165971)*\n<!-- homu-ignore:end -->\n\n<!-- homu-ignore:start -->\n<!--\nPlease read our [LLM policy] before opening a PR,\nIf you used an LLM to generate any part of this PR, including the PR description, please disclose that according to our [guidelines][disclosure guidelines].\nLLM contributions are not banned, but are held to a higher standard of review and correctness.\n\n[LLM policy]: https://forge.rust-lang.org/policies/llm-usage.html\n[disclosure guidelines]: https://rustc-dev-guide.rust-lang.org/llm-guidance/writing.html#disclosure-guidelines\n\nIf this PR is related to an unstable feature or an otherwise tracked effort,\nplease link to the relevant tracking issue here. If you don't know of a related\ntracking issue or there are none, feel free to ignore this.\n\nThis PR will get automatically assigned to a reviewer. In case you would like\na specific user to review your work, you can assign it to them by using\n\n    r? <reviewer name>\n\nWhen merged, your PR's description becomes part of the commit message of a merge commit.\nIf you do not want certain parts of it (such as your LLM disclosure) to show up in the permanent git history,\nsurround them with a pair of HTML comments containing `homu-ignore:start` and `homu-ignore:end`.\n-->\n<!-- homu-ignore:end -->\nfixes rust-lang/rust#142989 \n\nrustc creates temporary `rmeta.o` and `symbols.o` files in randomly named directories,"},{"repo":"node","full":"nodejs/node","title":"lib: use indexed append in ZIP central directory parser","comments":15,"url":"https://github.com/nodejs/node/pull/67456","body":"`readCentralDirectory()` appends one entry per archive file with\n`ArrayPrototypePush`, which `doc/contributing/primordials.md` lists among\nprimordials with known performance issues. This uses an indexed assignment\ninstead. Behavior and errors are unchanged.\n\nThe scope is narrowed to this one loop, which runs once per archive entry.\n\nLocal comparison of the header parsing loop (10 rounds, 3 runs each,\nNode v28.0.0-pre, V8 15.8.62.44-node.4, macOS arm64):\n\n| entries | push to indexed |\n|---------|-----------------|\n| 10      | +8% to +12%     |\n| 100     | +8% to +12%     |\n| 1,000   | +10% to +13%    |\n\n"},{"repo":"node","full":"nodejs/node","title":"[v26.x] V8 backports","comments":19,"url":"https://github.com/nodejs/node/pull/67452","body":"Extracted from:\n\n- https://github.com/nodejs/node/pull/66728\n- https://github.com/nodejs/node/pull/66729\n- https://github.com/nodejs/node/pull/67261\n- https://github.com/nodejs/node/pull/67207\n- https://github.com/nodejs/node/pull/65898\n- https://github.com/nodejs/node/pull/66736\n\nBundling them optimistically, to run CI once"},{"repo":"node","full":"nodejs/node","title":"tls: coalesce buffered records into one read","comments":11,"url":"https://github.com/nodejs/node/pull/66698","body":"`SSL_read()` returns at most one TLS record per call, and `TLSWrap::ClearOut()` emits a separate read for each one. Records can be up to 16 KiB, but plenty of servers send smaller ones: nginx defaults `ssl_buffer_size` to 4 KiB, and servers that do dynamic record sizing start out at around 1 KiB. Every record then pays for its own buffer allocation and call into JS.\n\nWith this change `ClearOut()` keeps calling `SSL_read()` into the same 16 KiB buffer while the next record in `enc_in_` is application data. It never waits for more input, it only merges records that have already arrived, and reads never get bigger than one full record already makes them.\n\nSome notes:\n\n- Batching stops in front of any other record type, and in front of application data records that are short enough to be empty, since `SSL_read()` skips empty records and goes straight on to the next one. In TLS 1.2 that means handshake and alert records are still processed after the preceding data has been emitted, so a `'data'` handler can e.g. still call `disableRenegotiation()` before a renegotiation that arrived in the same read. `test-tls-coalesce-renegotiation` covers that, and fails if the record type check is re"},{"repo":"rust","full":"rust-lang/rust","title":"Fix transmutability type mismatch bug","comments":24,"url":"https://github.com/rust-lang/rust/pull/163946","body":"<!-- homu-ignore:start -->\n*[View all comments](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/163946)*\n<!-- homu-ignore:end -->\n\n\nFixes rust-lang/rust#161251\n\nr? @ShoyuVanilla \n\nThe change was done as instructed by @ShoyuVanilla and @lcnr on Zulip.\nThere are some leftover questions I'll add as comments (self review).\nBut the original examples are both fixed."},{"repo":"next.js","full":"vercel/next.js","title":"turbo-bitset: add Bitset, a fast bitset over a bounded bit range","comments":2,"url":"https://github.com/vercel/next.js/pull/100566","body":"Stacked on #100452. This PR only adds the crate; the PRs above use it: #100643 (`compute_chunk_group_info`) → #100567 (`collect_graph`) → #100568 (`compute_merged_modules`) → #100630 (persisted chunk group sets) → #100724 (removes the FixedBitSet/Roaring comparisons from the benchmarks).\n\n## Summary\n\nThe module graph fixed-point traversals track set membership with `RoaringBitmap`, which is built for compact storage, not speed. They check \"would `current |= parent` change `current`?\" on every edge and then do the union; on array containers both cost time proportional to the number of bits.\n\nThis PR adds a new `turbo-bitset` crate with `Bitset`: a `Vec<usize>` of blocks plus an offset counted in whole blocks.\n\n- Bit `i` is stored at `i - offset * usize::BITS`, so a set only stores the word range between its lowest and highest bit. Sets whose bits are clustered at high indices stay small.\n- Unions, intersections, differences, subset checks, `is_disjoint` and `intersection_len` are word loops over the overlapping range, so their cost is proportional to the range, not the number of bits. The subset check reduces chunks of 4 words before branching, so it vectorizes.\n- `union_with` returns whether it added a bit. It ORs the words and collects the added bits in the same loop, so a traversal checks for a change and applies the union in one pass instead of a subset check plus `|=`. If the set stores no blocks (a module's first visit), it copies `other` without its zero edge blocks, re"},{"repo":"next.js","full":"vercel/next.js","title":"turbo-persistence: parallelize large batch_get reads","comments":1,"url":"https://github.com/vercel/next.js/pull/100620","body":"### What?\n\nParallelize large `TurboPersistence::batch_get` calls in `turbo-persistence`.\n\n- Batches with **more than 2048 keys** (`PARALLEL_BATCH_GET_THRESHOLD`) are split into chunks and run on the database's existing `ParallelScheduler`. Smaller batches run serially, one chunk per shard.\n- `split_into_batch_chunks` aims for **4 chunks per task the scheduler can run at the same time** (like `turbo_tasks::util::good_chunk_size`). Every chunk stays inside _one shard_ of the family's current shard index, so small shards produce smaller chunks.\n- New `ParallelScheduler` methods:\n  - `parallelism()`: the number of tasks the scheduler can run at once. The turbo-tasks scheduler returns `turbo_tasks::parallel::available_parallelism()`, `SerialScheduler` returns 1.\n  - `try_parallel_for_each_task_mut`: runs exactly one task per (already chunked) item.\n- Less memory traffic in `batch_get`:\n  - The sort is over compact `(u64 hash, u32 index)` cells.\n  - Values are materialized as soon as an SST lookup finds them and written directly into the output `Vec`. There is no final loop to re-order the results.\n  - Parallel chunks write disjoint indices concurrently through a small `ConcurrentSlice`.\n  - Each chunk tracks the keys already found in newer SST files with a `turbo_bitset::Bitset` backed by a `SmallVec`, plus a counter. The bitset is preallocated for the chunk's positions (`Bitset::with_len`) and its `SmallVec` stores up to 256 positions inline, so typical chunks don't heap-allocate"},{"repo":"vscode","full":"microsoft/vscode","title":"sanity: keep the app logs of failed desktop UI tests","comments":3,"url":"https://github.com/microsoft/vscode/pull/343329","body":"This is a diagnostics-only change to the sanity tests. When a desktop UI test fails, it keeps the app's own logs so the failure's real cause can be identified.\n\n## Why\nTwice in 14 days, the macOS universal desktop sanity test failed with `Failed to install extension after 3 attempts; last failure: Install button became available again before installation completed`. The runs were [484098](https://dev.azure.com/monacotools/Monaco/_build/results?buildId=484098) (Oct 14) and [487409](https://dev.azure.com/monacotools/Monaco/_build/results?buildId=487409) (Oct 21, attempt 3), both on arm64 agents.\n\nThis isn't a race in the test:\n- All 3 install attempts in the same app instance failed 0.3–0.9 s after clicking Install.\n- The uploaded screenshots (`screenshots-macos_arm64-3/desktop-darwin-universal-2..4.png`) show the product's **\"Error while installing 'GitHub Pull Requests' extension. Please check the log for more details\"**. The extension editor also shows **\"The editor could not be opened due to an unexpected error\"**.\n- Mocha's retry, which starts a new app instance, passed immediately.\n\nThe product's reason for the failure is only in the app's logs. Those live in a temporary user data dir that the test deletes, so they never reach the artifacts.\n\n## Change\n- `TestContext.captureLogs(logsDir)` copies VS Code's own process logs (an allowlist: `main`, `sharedprocess`, `renderer`, `exthost`, `ptyhost`, `agenthost` and `network`) from a logs folder into the existing screenshots di"},{"repo":"vscode","full":"microsoft/vscode","title":"Canvases: Gate project canvas extensions on workspace trust","comments":3,"url":"https://github.com/microsoft/vscode/pull/342372","body":"<!-- Thank you for submitting a Pull Request. Please:\n* Read our Pull Request guidelines:\n  https://github.com/microsoft/vscode/wiki/How-to-Contribute#pull-requests\n* Associate an issue with the Pull Request.\n* Ensure that the code is up-to-date with the `main` branch.\n* Include a description of the proposed changes and how to test them.\n-->\n\nProject Copilot extensions can execute code to contribute canvases, but their launch path previously checked only that the extension was located under an active working directory. This allowed project extensions to launch while the workspace was untrusted.\n\nThis change gates project extension launches on the Agent Host workspace trust configuration. Project extension paths, admitted roots, and trusted roots are canonicalized to the same filesystem identity; trust, containment, and admission are revalidated after asynchronous resolution. Missing trust configuration and untrusted workspaces fail closed, while Workspace Trust disablement and explicit remote or cloud-sandbox connection-authority trust preserve expected launches. Structurally validated VS Code isolated worktrees inherit project-extension launch trust from a currently trusted base repository, with revocation rechecked at launch and a canonical directory/repository grant persisted across first send, eager peers, moves, rollback, and runtime resume/restart. User and plugin extension sources are unchanged.\n\nThe project-extension authorization logic is isolated in `CopilotProjectE"},{"repo":"rust","full":"rust-lang/rust","title":"Declare `SyntaxContext` through `rustc_index::newtype_index!`","comments":26,"url":"https://github.com/rust-lang/rust/pull/164425","body":"<!-- homu-ignore:start -->\n*[View all comments](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/164425)*\n<!-- homu-ignore:end -->\n\n`SyntaxContext` is basically an index type but it is not declared through `newtype_index`.\n\nr? @petrochenkov"},{"repo":"rust","full":"rust-lang/rust","title":"Avoid stdlib's `impl Hash for Path` for stable hashing","comments":25,"url":"https://github.com/rust-lang/rust/pull/164458","body":"<!-- homu-ignore:start -->\n*[View all comments](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/164458)*\n<!-- homu-ignore:end -->\n\n<!-- homu-ignore:start -->\n- Intended to unblock https://github.com/rust-lang/rust/pull/164384\n- Also deals with https://github.com/rust-lang/rust/issues/164348\n- [Zulip thread](https://rust-lang.zulipchat.com/#narrow/channel/131828-t-compiler/topic/Hashing.20details.20from.20stage0.20stdlib.20leaking.20into.20stage1/with/632509711)\n---\n<!-- homu-ignore:end -->\n\nA subtle consequence of the stage0 redesign is that the compiler must take care to avoid relying on any stdlib-provided Hash impl when computing stable hashes, or at least any such impl that is actually liable to change.\n\nThis was noticed when trying to strengthen the provided Hash impl for Path, which triggered baffling CI failures because the stable hashes produced by the stage1 compiler (built against stage0 stdlib) were inconsistent with the ones that would have been produced by the stage2 compiler (built against in-tree stdlib).\n\nThis PR aims to unblock changes to `impl Hash for Path`, by making the compiler not rely on it for stable hashing. It does not attempt to solve the broader problem of the compiler relying on stdlib hash details."},{"repo":"node","full":"nodejs/node","title":"src: fix build with `--shared-brotli`","comments":12,"url":"https://github.com/nodejs/node/pull/66895","body":"`BROTLI_DECODER_ERROR_FORMAT_BLOCK_SWITCH` isn't in any brotli release yet (1.2.0 is the latest), so building with `--shared-brotli` fails since 7ba22c2812. It's an enum value and the bundled brotli still reports 1.2.0, so there's nothing to `#ifdef` on. This only exposes the constant when brotli is bundled and skips the matching test otherwise.\n\nI built with `--shared-brotli` against Homebrew brotli 1.2.0 and ran `parallel/test-zlib*` (90 tests, all pass). The GN change is untested, I had no `gn` locally.\n\nFixes: https://github.com/nodejs/node/issues/66894"},{"repo":"node","full":"nodejs/node","title":"deps: patch V8 to 15.6.75.25","comments":19,"url":"https://github.com/nodejs/node/pull/66820","body":"This is an automated patch update of V8 to 15.6.75.25."},{"repo":"openai-python","full":"openai/openai-python","title":"feat(api): expand Live Decision item and question types","comments":7,"url":"https://github.com/openai/openai-python/pull/4175","body":"## Summary\n\nSupport more message, tool call, and question input types in Live Decisions.\n\n## Changes\n\n- Accept user, developer, system, and assistant messages in Live Decision items.\n- Add function and custom tool call and output types.\n- Allow strings or structured instruction parts in Live Decision questions.\n"},{"repo":"openai-python","full":"openai/openai-python","title":"fix(examples): handle interruptions and disconnects in push-to-talk","comments":6,"url":"https://github.com/openai/openai-python/pull/4192","body":"Pressing Enter tried to use a button the app never mounted, and transcripts containing Rich tags could crash the session. This change displays transcripts and API errors as literal text, reports failed or incomplete responses, and closes the audio device and SDK client on exit. Q exits with code 0; an unexpected normal or abnormal disconnect exits with code 1.\n\nWhen K interrupts playback, the sample cancels the active response and truncates unheard audio, including queued items after response.done. Capture starts before awaiting cancellation and truncation; microphone sends wait until those writes finish. If audio or its transcript arrives after interruption, the sample truncates each previously unknown item part to zero once. It retains the original cutoff for partly played audio. Manual mode skips commit and response.create if no audio was sent before release. Manual finalization also reserves the server input buffer before the next recording can append, so successive recordings remain separate while capture and interruption can still proceed.\n\nA response.created event that arrives after K, before any new audio is offered, belongs to the earlier turn. The sample reserves interruption work before it waits for the send lock. Microphone appends and manual commits recheck that work after obtaining the lock and yield outside it when necessary. They cannot overtake a cancellation or truncation that was queued while they waited. It suppresses late audio and transcripts and truncat"},{"repo":"next.js","full":"vercel/next.js","title":"turbo-tasks: add batched keyed reads via KeyedReadRef","comments":1,"url":"https://github.com/vercel/next.js/pull/100884","body":"## Summary\n\nAdds `vc.keyed_reader().await?`, which returns a `KeyedReadRef<T>` for `cell = \"keyed\"` values, and uses it for NFT generation (`crates/next-api/src/nft.rs`, `crates/next-api/src/nft_json.rs`).\n\n### Why\n\n`vc.get(key).await?` and `vc.contains_key(key).await?` register a fine-grained dependency per read. Every read is a separate future that takes backend locks to register its dependency. That gets expensive when one task reads many keys from the same map, as the NFT tasks do.\n\n### How\n\n- **API:** `keyed_reader()` returns a `ReadKeyedReaderVcFuture<T>` resolving to `Result<KeyedReadRef<T>>`. It reads the cell once. The `KeyedReadRef` only allows synchronous `get(key)` and `contains_key(key)` calls. It records the hashes of the accessed keys (the same hash `vc.get` uses), not the keys themselves.\n- **Dependency while alive:** calling `keyed_reader()` allocates a dedicated `CellKey::Keyed(id)` dependency for the current task execution before the future is created. `id` is unique within that execution. For invalidation it behaves like a full-cell dependency, but as a separate entry it can be removed without affecting normal full reads of the same cell or other `KeyedReadRef`s. A call outside a task execution is a normal full-dependency read.\n- **Dropped within the same execution:** one batched backend call replaces the `Keyed(id)` dependency with `CellKey::Hash(h)` dependencies for the accessed keys. Like `vc.get`, the reader is then only invalidated when one of those k"},{"repo":"next.js","full":"vercel/next.js","title":"Fix layout client chunk leakage across async server imports","comments":1,"url":"https://github.com/vercel/next.js/pull/101040","body":"## Summary\n\nWhen a layout reaches a shared client reference through a server-side `import()`, the reference can belong to different chunk groups than its owner. Falling back to every group containing that reference could then pull unrelated page code into the layout’s initial client chunks.\n\nSelect groups by direct owner membership or transitive async-import ancestry, with cycle detection. Only fall back when owner information is absent; error when a known owner cannot be matched.\n\nFixes #100893.\n\n## Verification\n\nAdded async/nested/cyclic regression coverage. Existing layout chunk-sharing and CSS-order tests pass in production and development with rebuilt native bindings.\n\n<!-- NEXT_JS_LLM -->\n\n<!-- fleet 0ee043f2-90a6-4f09-8d0f-973c1aae4e2c -->"},{"repo":"vscode","full":"microsoft/vscode","title":"Keep quick input open while its context menu has focus","comments":7,"url":"https://github.com/microsoft/vscode/pull/344806","body":"🤖 Closes #153267\n\n### Problem\nWith HTML (custom) context menus, right-clicking the Command Palette or any quick pick dismisses it as soon as the menu appears. Custom menus are always used on web, and on desktop by default with the custom title bar. The menu takes DOM focus into a context view outside `.quick-input-widget`, so the quick input's focus tracker sees a blur and hides. #155546 only changed the z-index. Native macOS menus never move DOM focus, so they were not affected.\n\nHosting the menu inside its owner (`domForShadowRoot`) keeps focus in the owner, but then the owner's `overflow: hidden` and transforms clip the menu. That is why earlier revisions of this PR needed animation and `will-change` workarounds, and why item-row menus could not be fixed at all.\n\n### Change: an opt-in popover mode in ContextView\nThe creator of a context view still passes its owner explicitly, as before. It can now also ask for the view to be hosted **as a popover** there (`IContextMenuDelegate.hostAsPopover` / `IContextViewDelegate.hostAsPopover`). The view's DOM is a `popover=\"manual\"` element (optionally with a shadow root) inside the owner, so:\n- focus stays inside the owner, and the owner's focus tracker never sees a blur;\n- the menu renders in the top layer, unclipped by the owner's overflow or transforms.\n\nAll popover behaviour lives in `ContextView` (`base/browser/ui/contextview/contextview.ts`):\n- `showPopover()` with fallback: if it throws (e.g. the owner is disconnected or popov"},{"repo":"vscode","full":"microsoft/vscode","title":"Agent Host: model routers for Copilot (experimental)","comments":1,"url":"https://github.com/microsoft/vscode/pull/346652","body":"This adds model routers to Copilot in Agent Host sessions. A model router is a `<name>.model-router.yaml` file that lists models and when to use each. It appears as a model in the picker, and each main-agent turn asks `gpt-6-luna-decisions` which route fits the request.\n\nSpec: microsoft/vscode-internalbacklog#10628 (see the YAML revision in the comments).\n\n## Setting\n\n`chat.copilot.modelRouter.enabled` (default `false`). The setting is experimental, tagged `preview`, `advanced` and `experimental`, and hidden from the Settings editor, so turn it on in `settings.json`:\n\n```json\n\"chat.copilot.modelRouter.enabled\": true\n```\n\nWith the setting off, nothing changes: no router rows, no skill, no check tool, and the runtime's `DECISIONS_API` flag stays off.\n\n## What's in it\n\n1. **File format.** The router format lives in `common/modelRouter.ts`:\n   - `version: 1`, a description, effort, switching, guidance, and 2–10 routes with fallback lists;\n   - a strictly checked YAML subset (`base/common/yaml.ts` is lenient, and it is not changed); files saved with a UTF-8 BOM are read;\n   - a 32 KiB file limit, and a 64 KiB limit on the decision text after JSON escaping;\n   - matching against the account's models: BYOK ids must match exactly one model, policy-disabled models count as unavailable, and the effective effort level is checked;\n   - `effort: off` leaves each model's default effort, and the checker warns that any route `effort` is ignored.\n2. **Telemetry.** Router names are written by "},{"repo":"rust","full":"rust-lang/rust","title":"Use the `2.38` binutils version in CI","comments":53,"url":"https://github.com/rust-lang/rust/pull/165078","body":"<!-- homu-ignore:start -->\n*[View all comments](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/165078)*\n<!-- homu-ignore:end -->\n\nBlocked on https://github.com/rust-lang/ci-mirrors/pull/61.\n\nr? @Kobzol "},{"repo":"rust","full":"rust-lang/rust","title":"Add `Forget` trait feature gate","comments":40,"url":"https://github.com/rust-lang/rust/pull/165376","body":"<!-- homu-ignore:start -->\n*[View all comments](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/165376)*\n<!-- homu-ignore:end -->\n\nr? jonathanbrouwer\n\nAdd an unstable feature gate for the `Forget` trait. Creating the feature gate allows experimentation with its implementation. Note that this does not commit to anything w.r.t. stabilization of the forget trait. A feature gate can be removed at any time.\n\nPart of https://github.com/rust-lang/rust/issues/165370"},{"repo":"node","full":"nodejs/node","title":"2026-10-28, Version 27.0.0-alpha.0.0.0 (Alpha)","comments":17,"url":"https://github.com/nodejs/node/pull/67062","body":"## 2026-10-28, Version 27.0.0-alpha.0.0.0 (Alpha), @RafaelGSS\n\n### Notable Changes\n\n#### V8 15.6\n\nThe V8 engine is updated to version 15.6.75.13, up from 14.6 in Node.js 26. Highlights:\n\n* New language features enabled by default: `Math.sumPrecise()`, `Intl.Locale.prototype.variants`, `Iterator.prototype.join()`, `Iterator.prototype.includes()`, `Iterator.zip()` and `Iterator.zipKeyed()`.\n* Experimental features behind flags: `import defer` (`--js-defer-import-eval`), Immutable `ArrayBuffer` (`--js-immutable-arraybuffer`) and RegExp buffer boundaries (`--js-regexp-buffer-boundaries`).\n* Memory: when `--max-old-space-size` is not set, the default heap size limit is now half of the physical memory clamped between 256 MB and 4 GB, and memory held by `Buffer` and `ArrayBuffer` instances now counts toward the heap limit. Applications that relied on the previous defaults should set `--max-old-space-size` explicitly.\n* Serialization: `v8.serialize()`, `structuredClone()` and `postMessage()` use a new format that older Node.js releases cannot read. `v8.cachedDataVersionTag()` and the compile cache also change on every Node.js patch of V8, not only on V8 version changes.\n* Observable behavior changes: `Math` methods now use LLVM's libm and may differ in the last bit; `Math.random()` sequences change for a given `--random-seed`; `error.stack` is no longer looked up through the prototype chain; `await` incurs fewer microtasks; `Array.prototype.sort()` uses PowerSort for large arrays and"},{"repo":"node","full":"nodejs/node","title":"http: batch body spans per parser execute","comments":10,"url":"https://github.com/nodejs/node/pull/67187","body":"Buffer body spans in `on_body()` and deliver them to JS once per `execute()` call instead of once per chunk. A body sent as many small chunks no longer costs one C++ to JS call and `Buffer` per chunk.\n\nChunks that arrive in the same read now produce a single `'data'` event on `IncomingMessage`. Chunk boundaries were never documented, but code that treats each `'data'` event as a full message could break, so this needs a CITGM run.\n"},{"repo":"openai-python","full":"openai/openai-python","title":"feat(api): improve WebSocket recovery and delivery reporting","comments":6,"url":"https://github.com/openai/openai-python/pull/4213","body":"## Summary\n\nApply the configured recovery policy to eligible WebSocket closures and report queued frames that could not be sent.\n\n## Changes\n\n- Recover from close codes 1001 and 1005 when reconnection is enabled; normal close 1000 without pending work still ends iteration.\n- Preserve typed and raw frame order through recovery and after an initial write fails. Keep once and persistent listener registrations independent.\n- For callers waiting on an ordinary queued send, report a failure of their own frame even if another caller sent it. Report known terminal closure when a waiting caller's frame remains unattempted. Preserve the original error from an active transport write.\n- A final close prevents the old flusher from starting frames already reported unsent, while keeping those frames available for the reader's report.\n- If recovery takes over queued work, sends remain deferred and nonblocking. The reader reports the remaining frames if recovery later fails; a successful return during recovery does not confirm delivery.\n\n## Compatibility\n\nThis update is intended for a minor release. If your application treats close codes 1001 or 1005 as completion, disable recovery or abort the connection when that work is complete. Handle WebSocketConnectionClosedError and inspect unsent_frames (or unsent_messages for text) when queued work cannot be delivered. Messages retained after an initial write fails count toward the queue's byte limit. Handle WebSocketQueueFullError when a later mess"},{"repo":"node","full":"nodejs/node","title":"test: skip readFileSync pipe test without proc io","comments":10,"url":"https://github.com/nodejs/node/pull/67242","body":"The readFileSync short reads regression test depends on /proc/<pid>/io, which is not present on some Linux systems. It now skips when /proc/self/io is unavailable.\n\nVerification: git diff --check passed. python tools/test.py --mode=release parallel/test-fs-readfilesync-pipe-short-reads could not run because this checkout has no built Release/node.exe.\n\n**Regression test:** untested: CONTRIBUTING does not mention tests\n\nFixes #67241"},{"repo":"openai-python","full":"openai/openai-python","title":"feat(api): add organization external key management","comments":3,"url":"https://github.com/openai/openai-python/pull/4205","body":"## Summary\n\nAdd organization external-key registration and validation for AWS, GCP and Azure.\n\n## Changes\n\n- Create, retrieve, list, delete and validate organization external-key registrations.\n- Filter external-key listings by purpose and paginate through results.\n"},{"repo":"next.js","full":"vercel/next.js","title":"turbo-tasks: Support IndexMap backed AutoMap and AutoSet","comments":1,"url":"https://github.com/vercel/next.js/pull/100948","body":"### What?\n\n`AutoMap` and `AutoSet` from the `auto-hash-map` crate can now use an `IndexMap` as their backing map, which makes them insertion ordered:\n\n- `AutoMap`/`AutoSet` are now type aliases of new generic `RawAutoMap<K, V, M, L>` / `RawAutoSet<K, M, L>` types. `M` is the backing map storage and `L` is the backing list storage used while the collection is small.\n- The `AutoMap`/`AutoSet` aliases keep their existing parameters (`H`, `I`) and mean exactly what they did before: `HashMap` + `TinyVec`, with unchanged size, behavior, and hashing. Existing users compile without changes.\n- New `OrderedAutoMap`/`OrderedAutoSet` aliases use `IndexMap` + `TinyVec`. They keep insertion order in both the list and the map representation, and their equality is order sensitive: `{a, b} != {b, a}`.\n\n### Why?\n\nThe list-then-map optimization of `AutoMap`/`AutoSet` is useful for collections whose iteration order matters too. Until now the only option for those was a plain `IndexMap`/`IndexSet`, which costs a hash table allocation even for one or two entries.\n\n### How?\n\n- **`BackingMapStorage` trait**, implemented for `hashbrown::HashMap` and `indexmap::IndexMap`:\n  - Covers the map operations, entries, and raw entries that `RawAutoMap` forwards to.\n  - `BackingMapStorage::eq` compares two map storages: the hash map order-insensitively, as before, the index map by its iteration sequence (`IndexMap`'s own `PartialEq` ignores order). `RawAutoMap`'s `PartialEq` handles the list/map combinations i"},{"repo":"next.js","full":"vercel/next.js","title":"turbo-tasks-backend: track early aggregation edge removals as follower debt instead of retrying","comments":2,"url":"https://github.com/vercel/next.js/pull/100873","body":"### What?\n\nReplace aggregation-edge removal retries with **negative follower counts** (\"debt\"). A removal that overtakes its addition records debt; the late addition cancels it instead of spinning, requeuing, or eventually panicking. Remove `retry_loop`, the retry job fields, and `MAX_RETRIES`.\n\nAlso add deterministic regression tests, concurrent graph-churn stress tests, fuzz-driver improvements, and benchmarks.\n\n### How?\n\nAn edge `U → F` lives either in `F.upper[U]` (unsigned) or in `U.followers[F]` (now `i32`). **Only followers can go negative. Only counts greater than zero are real edges.**\n\n- **Removal, without a pair lock:** decrement an existing inner edge under F's lock; otherwise decrement the follower count under U's lock, possibly creating debt. If debt remains, recheck F and schedule `BalanceEdge` if an inner edge appeared meanwhile.\n- **Addition:** pay existing debt on the follower side before creating an inner edge. After creating a new inner edge, recheck U for debt unconditionally, including empty-data/no-activeness cases.\n- **Race argument:** removal writes U then reads F; addition writes F then reads U, each under the relevant task lock. For a split that survives intervening operations, both reads cannot precede the other write; at least one side schedules balancing. An intervening update may already resolve the split.\n- **Pair-locked balancing:** net follower debt against the inner count first, reverse any disappeared inner contribution, then place the rema"},{"repo":"vscode","full":"microsoft/vscode","title":"perf: batch Test Explorer test run updates","comments":7,"url":"https://github.com/microsoft/vscode/pull/346656","body":"### Details\n\nLarge Test Explorer runs send a separate RPC for each test registration, state change, message and output chunk. Thousands of these messages add work in the extension host and renderer.\n\n### Change\n\nBatch ordered updates in `BatchedTestRunRpc`, with limits on batch size and payload. Flush pending updates before task completion, coverage, result-reading commands and retirement. Support both string and buffer output, and preserve results when profiles share a run.\n\n### Performance\n\n5000 Mocha tests\n\n| Metric | Before | After | Change |\n| --- | ---: | ---: | ---: |\n| Test-run update RPCs (median) | 25,054 | **297** | **−98.8%** |\n| Extension host CPU time | 1,917 ms | **647 ms** | **−66.2%** |\n| Renderer CPU time | 19,377 ms | **16,851 ms** | **−13.0%** |\n\n#### Extension host\n\nBefore\n\n<img height=\"250\" alt=\"Extension host CPU before batching\" src=\"https://github.com/user-attachments/assets/621e0415-35e0-4b78-861c-4d3de106e399\">\n\nAfter\n\n<img height=\"250\" alt=\"Extension host CPU after batching\" src=\"https://github.com/user-attachments/assets/eaa5fe68-3a06-430d-b101-d9a7988afd52\">\n\n#### Renderer\n\nBefore\n\n<img height=\"250\" alt=\"Renderer CPU before batching\" src=\"https://github.com/user-attachments/assets/b3996840-e53f-4cb0-92d8-011b8db12fac\">\n\nAfter\n\n<img height=\"250\" alt=\"Renderer CPU after batching\" src=\"https://github.com/user-attachments/assets/33ed4b03-213b-4395-8cb3-aa1e3eae9d0e\">\n\n<sub>CPU profiles captured at `25b632f`, before subsequent review fixes.</sub>\n\n<br"},{"repo":"rust","full":"rust-lang/rust","title":"fix incorrect byte count suffix on MSVC","comments":55,"url":"https://github.com/rust-lang/rust/pull/165458","body":"<!-- homu-ignore:start -->\n*[View all comments](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/165458)*\n<!-- homu-ignore:end -->\n\n<!-- homu-ignore:start -->\n<!--\nPlease read our [LLM policy] before opening a PR,\nIf you used an LLM to generate any part of this PR, including the PR description, please disclose that according to our [guidelines][disclosure guidelines].\nLLM contributions are not banned, but are held to a higher standard of review and correctness.\n\n[LLM policy]: https://forge.rust-lang.org/policies/llm-usage.html\n[disclosure guidelines]: https://rustc-dev-guide.rust-lang.org/llm-guidance/writing.html#disclosure-guidelines\n\nIf this PR is related to an unstable feature or an otherwise tracked effort,\nplease link to the relevant tracking issue here. If you don't know of a related\ntracking issue or there are none, feel free to ignore this.\n\nThis PR will get automatically assigned to a reviewer. In case you would like\na specific user to review your work, you can assign it to them by using\n\n    r? <reviewer name>\n\nWhen merged, your PR's description becomes part of the commit message of a merge commit.\nIf you do not want certain parts of it (such as your LLM disclosure) to show up in the permanent git history,\nsurround them with a pair of HTML comments containing `homu-ignore:start` and `homu-ignore:end`.\n-->\n<!-- homu-ignore:end -->\n\nfixes rust-lang/rust#165299 \n\nthis moves the byte count calculation into a shared helper in `rustc_codegen_ssa`. it"},{"repo":"openai-python","full":"openai/openai-python","title":"feat(api): support WebSocket warmup and preserve cleanup cancellation","comments":1,"url":"https://github.com/openai/openai-python/pull/4215","body":"Add optional `generate` to stable and beta Responses WebSocket create events. An unset field stays absent from the request; explicit `false` and `true` stay on the wire.\n\nPreserve cancellation raised while a WebSocket connection closes, even when the context body already raised an error. The seven Realtime, translation, Live, and Responses manager paths still preserve the original body error if ordinary cleanup fails. Their cleanup handlers catch `Exception`, so cancellation and other process-control exceptions propagate.\n\nValidation: 2,014 tests passed against installed SDK wheels across Pydantic v1 and v2. Each environment passed 940 core tests, eight warmup tests, five parsing tests, four tool-runner configuration tests, and 50 authentication tests. The final comparison preserves the parsing and tool-runner behavior already on public main.\n"},{"repo":"vscode","full":"microsoft/vscode","title":"chat: bridge host-owned Microsoft credentials to Copilot","comments":2,"url":"https://github.com/microsoft/vscode/pull/345730","body":"<!-- Thank you for submitting a Pull Request. Please:\n* Read our Pull Request guidelines:\n  https://github.com/microsoft/vscode/wiki/How-to-Contribute#pull-requests\n* Associate an issue with the Pull Request.\n* Ensure that the code is up-to-date with the `main` branch.\n* Include a description of the proposed changes and how to test them.\n-->\n\nBuilds on merged #345132 and targets `main`. This is the credential-bridge layer of native [stack #345731](https://github.com/microsoft/vscode/stack/345731): it lets the Agent Host's Copilot provider use Microsoft credentials that VS Code owns, without adding a sign-in flow, a protocol method or a token store.\n\n## What this changes\n\n- **Host bridge.** When `chat.agentHost.copilot.m365.enabled` was on at the time the host started (the startup-effective value from #345132), the Copilot provider passes the SDK's `entra.tokenProvider` a callback backed by credentials received over the existing `authenticate` request. `CopilotClient`, `RuntimeConnection.forStdio` and the separate runtime process are unchanged. The callback never waits: it returns a matching stored credential, or `unavailable` while advertising the requirement through the existing `auth/required` notification. A later delivery satisfies a later retry.\n- **Binding.** A credential is accepted only for the advertised resource and scopes, from the Microsoft account the host is already bound to. A different account is rejected rather than substituted. Exchange, derived credentials "},{"repo":"node","full":"nodejs/node","title":"sea: mount the SEA VFS in workers at layer 0","comments":12,"url":"https://github.com/nodejs/node/pull/67239","body":"Fixes: https://github.com/nodejs/node/issues/67223\n\nA single executable application built with `\"useVfs\": true` and plain\n`\"assets\"` mounts its VFS only in the main thread, at a mount point numbered\nin mount order. A worker started from a path into it, such as a worker script\nbundled as an asset, finds nothing there. On Windows the failure is\nespecially confusing: paths under `\\\\.\\nul` open the NUL device, so the loader\n\"finds\" the file and then rejects `\\\\.\\nul\\package.json` as an invalid\npackage.json (`ERR_INVALID_PACKAGE_CONFIG`).\n\n#66709 already mounts the VFS in workers when it is backed by `\"vfsArchive\"`,\nusing the mount point reserved for `--vfs-load`. This does the same for\n`\"assets\"`:\n\n* Layer 1 is reserved for the assets of such a SEA, so the mount point is the\n  same in every thread whatever else a thread mounts. Other mounts are\n  numbered from 2 in that case. The decision is recorded in C++ as an internal\n  `[sea_vfs_assets]` option next to `[sea_vfs_archive]`, so that a worker of a\n  non-SEA process still does not load `internal/vfs/sea`.\n* Workers call `initSeaVfsInWorker()` for either kind of SEA VFS.\n\nFor a VFS mounted with `vfs.mount()`, which a worker cannot see, the worker\nnow fails with a new `ERR_VFS_NOT_MOUNTED` instead of whatever the real file\nsystem answers. The check only runs for a filename containing `vfs`, so other\nworkers do not load the VFS modules.\n\nTests:\n\n* `test/sea/test-single-executable-application-vfs.js`: the fixture now\n  starts a work"},{"repo":"next.js","full":"vercel/next.js","title":"docs: add native DOM examples to Activity guide","comments":2,"url":"https://github.com/vercel/next.js/pull/101581","body":"## Summary\n\nAdds the native popover example from #100208 to the existing Activity guide, with cleanup and unique IDs for elements in preserved pages. Also corrects the form-reset example to keep its callback ref stable across rerenders and distinguishes uncontrolled DOM values from controlled React state. Clarifies that an Effect running again does not necessarily mean a page was shown again, because Strict Mode also repeats setup and cleanup in development.\n\n## Verification\n\n- Checked the examples against React's Activity cleanup implementation and the React and MDN API references.\n- Prettier and `git diff --check` pass.\n- Browser tests were not run for this docs-only change.\n\n<!-- NEXT_JS_LLM -->\n"},{"repo":"next.js","full":"vercel/next.js","title":"turbo-tasks: capture effects on multiple workers","comments":2,"url":"https://github.com/vercel/next.js/pull/101514","body":"## What?\n\n`take_effects` now captures many effects on several workers instead of polling all captures on one thread.\n\nThe workers are spawned with a new crate-private `spawn_in_current_task` helper. The spawned futures share the current task's state like local tasks do, so their cell reads are tracked as dependencies of the task that calls `take_effects`, and the task execution waits for them before it completes. Workers take the next effect from a shared counter and the results keep the original effect order, so dedup, conflict detection and retry behaviour are unchanged.\n\nContext: #100250 (making `next build` scale beyond 16 cores).\n\n## Why?\n\nIn a warm build (persistent cache) every effect is captured again, and a capture reads the effect cell and the content it writes. That data is not in memory yet, so each read restores it from the persistent cache synchronously on the reading thread. All captures were polled by one `try_join` in one task, so all restores ran one by one on a single thread.\n\nOn `bench/large-app-router` (5000 routes, ~200k output files) with 32 CPUs, a warm build's emit step had a ~4s window with one busy thread: ~200k captures with ~167k individual task data/meta restores. With this change the window is ~0.9s.\n\n**Why at most 8 workers:** every capture still records its read as a dependency of the one task calling `take_effects`, which locks that task, so the workers contend on that lock. Measured capture times on the warm build were 4.3s with 1 worker, 1."},{"repo":"next.js","full":"vercel/next.js","title":"docs: Add more clarification about SVG security policies","comments":2,"url":"https://github.com/vercel/next.js/pull/101311","body":"Additional follow-up to https://github.com/vercel/next.js/pull/101301\n\nDiscussion: https://vercel.slack.com/archives/C0CATBS8W1E/p1794004367277349?thread_ts=1793979996.030529&cid=C0CATBS8W1E\n\nI did a bunch of iterations (with claude, codex, and gemini reviewing) on this to try to be as clear as possible about what every option is doing exactly why they're important."},{"repo":"vscode","full":"microsoft/vscode","title":"Align animated menus and action widgets to device pixels","comments":9,"url":"https://github.com/microsoft/vscode/pull/347805","body":"Fixes #347796\n\n## What\n\nWith Modern UI and motion on, the open animation of title bar menus, context menus and action widgets (for example the chat pickers) could end with some or all rows snapping by one device pixel.\n\n## Why\n\nThese surfaces open by animating `transform: scale(0.97 → 1)` on a child of a positioned container. While the transform is active, Chromium paints the content from a pixel-snapped offset. Once the animation ends, it paints the content at its exact device-pixel offset. When the container is on a fractional device pixel, which is common (for example the View menu sits at `top: 28.5px` below the title bar at DPR 1), the two can round rows differently. Rows then move by one device pixel in the frame after the animation finishes.\n\n## How\n\nNew helper `DOM.alignToDevicePixels(element, direction?)`:\n- It measures the element and nudges its inline px `left`/`top` (or `right`/`bottom` when those are the anchored insets) so the element starts on a whole device pixel.\n- It takes into account the window's `devicePixelRatio` and CSS zoom, including zoom on shadow hosts.\n- It ignores offsets within Chromium's layout precision (positions are floored to 1/64 CSS px), so calling it again doesn't move the element.\n\nWhere it is called:\n- **`ContextView.doLayout()`** (context menus, dropdown menus, action widgets) uses the same rounding, but computes it from the geometry it has already measured instead of re-reading layout after writing the position. This matters because s"},{"repo":"vscode","full":"microsoft/vscode","title":"Support file URLs and vscode-remote resources in the integrated browser on remotes","comments":2,"url":"https://github.com/microsoft/vscode/pull/347936","body":"In remote workspaces (SSH, WSL, dev containers) and in Agents window sessions on remote agent hosts, you couldn't open an HTML file in the integrated browser. The \"Open in Integrated Browser\" action and the editor association that opens HTML files in the browser only covered local `file:` resources. The browser also can't read a remote's disk, and Chromium refuses to redirect from a custom scheme like `vscode-remote://` to `file:`.\n\nThis PR lets the integrated browser open HTML files that live on a remote. The browser keeps showing a normal `file://` URL, and the requests for it are answered with the file's content read from the remote.\n\n- Remote HTML files show up in the editor association and in \"Open in Integrated Browser\", like local ones. These entries are only offered when `workbench.browser.enableRemoteProxy` is on, because only tabs with a remote network can load them. Agent host files are only offered in the Agents window, the only window that can provide a network for them.\n- When a tab opens a `vscode-remote://` or `vscode-agent-host://` URL, it is turned into the equivalent `file://` URL. This happens on load, in the browser navigation tool used by agents, and when a tab is renamed after its file is renamed. The query and fragment are kept as written.\n- A browser session tied to a remote network never reads the local disk. Its `file:` requests are read from the remote through the window of a live tab on that session, since that window is the one connected to the r"},{"repo":"rust","full":"rust-lang/rust","title":"Add `#[rustc_test_entrypoint_marker]` back !","comments":26,"url":"https://github.com/rust-lang/rust/pull/165879","body":"<!-- homu-ignore:start -->\n*[View all comments](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/165879)*\n<!-- homu-ignore:end -->\n\nRe-add the unstable and internal `#[rustc_test_entrypoint_marker]` (first sighted in rust-lang/rust#158854)! This is helpful for tools like [Charon](https://github.com/AeneasVerif/charon) to translate test entry points, since once test generation is done there is no simple way of finding these: otherwise one needs to look for statics with `#[rustc_test_marker]`, visit their body, and look for a path to a function inside that body (ugly!) \n\nnow that synthetic attributes exist doing this is simple and shouldnt cause any regressions :3 (fingers crossed)\n\nr? jdonszelmann\n\n<!-- homu-ignore:start -->\n<!--\nPlease read our [LLM policy] before opening a PR,\nIf you used an LLM to generate any part of this PR, including the PR description, please disclose that according to our [guidelines][disclosure guidelines].\nLLM contributions are not banned, but are held to a higher standard of review and correctness.\n\n[LLM policy]: https://forge.rust-lang.org/policies/llm-usage.html\n[disclosure guidelines]: https://rustc-dev-guide.rust-lang.org/llm-guidance/writing.html#disclosure-guidelines\n\nIf this PR is related to an unstable feature or an otherwise tracked effort,\nplease link to the relevant tracking issue here. If you don't know of a related\ntracking issue or there are none, feel free to ignore this.\n\nThis PR will get automatically assigned t"},{"repo":"next.js","full":"vercel/next.js","title":"Add experimental native Go proxy support","comments":3,"url":"https://github.com/vercel/next.js/pull/101464","body":"## Summary\n\nAdd `proxy.go` and `src/proxy.go` with a `Proxy(http.ResponseWriter, *http.Request)` handler. `experimental.goRoutes: true` enables both Go routes and proxies. This first version matches all paths and uses deployment defaults; file-local configuration follows in [#101551](https://github.com/vercel/next.js/pull/101551). Turbopack compiles the handler into a native HTTP worker for `next dev` and `next start`, with continuation, rewrites, redirects, request-header overrides, cookies, body replay, and streaming responses.\n\nAdapter builds emit a `MIDDLEWARE` output with `runtime: 'go'` and a PORT-based executable. Hosted rollout also requires Go middleware packaging in [adapter-vercel #156](https://github.com/nextjs/adapter-vercel/pull/156) and proxy-only build preparation in `@vercel/next`.\n\nGo directory snapshots now respect the filesystem's denied paths, allowing a project-root proxy to compile alongside excluded `.next` output directories.\n\n## Differences from JavaScript proxies\n\n- **Empty request-header replacement:** in Go, a non-nil empty `ProxyOptions.Request.Headers` (`http.Header{}`) removes every downstream request header, while a `nil` map preserves them. In JavaScript, `NextResponse.next({ request: { headers: new Headers() } })` is a no-op and the incoming headers are kept. Go expresses the empty replacement with an internal override name (`x-next-internal-go-empty-override`) so the JavaScript behavior is unchanged; Flight headers are still preserved. How "},{"repo":"vscode","full":"microsoft/vscode","title":"Chat view: list the sessions of the Agents window (chat.viewSessions.sessionsList.enabled)","comments":18,"url":"https://github.com/microsoft/vscode/pull/348283","body":"<!-- Thank you for submitting a Pull Request. Please:\n* Read our Pull Request guidelines:\n  https://github.com/microsoft/vscode/wiki/How-to-Contribute#pull-requests\n* Associate an issue with the Pull Request.\n* Ensure that the code is up-to-date with the `main` branch.\n* Include a description of the proposed changes and how to test them.\n-->\n\n**Sessions list in the Chat view** (`chat.viewSessions.sessionsList.enabled`). The Chat view of an editor window shows the sessions of the Agents window, in the shared Sessions list of editor windows, in place of its own sessions list. The Chat view keeps its own chat input, for new chats and for the chats it shows.\n\n**Stack / merge order:** a feature PR; merge LAST, after its infra: #348290 (shared sessions list), #348302 (Chat view seams), #348308 (sessions runtime), #348309 (chat part). All are merged in; the diff shrinks as they land. Up to date with `main`.\n\n### Setting\n\n- `chat.viewSessions.sessionsList.enabled`: experimental, experiment `startup`, default off. It applies live, without a reload: turning it on registers the list and its providers' hold; turning it off disposes all of it and the Chat view shows its own sessions list again. While off, nothing is registered or created.\n- Not in remote windows, whose Chat view stays as it is.\n- If #347688's `chat.sessionsView.enabled` is on, this feature stays off. That setting takes effect on restart, so its value as the window started counts (read once per window).\n- AI features: the "},{"repo":"rust","full":"rust-lang/rust","title":"OIDC artifact pushes","comments":34,"url":"https://github.com/rust-lang/rust/pull/165609","body":"<!-- homu-ignore:start -->\n*[View all comments](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/165609)*\n<!-- homu-ignore:end -->\n\nThis implements the r-l/r side of https://github.com/rust-lang/simpleinfra/pull/1305."},{"repo":"node","full":"nodejs/node","title":"http2: enforce maxSessionMemory for client requests","comments":11,"url":"https://github.com/nodejs/node/pull/67361","body":"The documentation for `maxSessionMemory` says new `Http2Stream` instances are rejected while the limit is exceeded. That was only enforced for streams opened by the peer (`Http2Session::CanAddStream()`). `session.request()` went straight to `nghttp2_submit_request()`, so a client whose socket stopped draining could keep submitting requests, queuing them in nghttp2 without bound.\n\nThis checks the session memory in `Http2Session::Request()` before submitting and fails only that request with a new `ERR_HTTP2_SESSION_MEMORY_EXCEEDED` error. Nothing is sent to the peer, so the request is safe to retry, and the session stays usable. As with response headers (#67114), request bodies queued for flow control are not counted, so a large upload does not block unrelated requests on the same session.\n\nThe rejection is signalled by returning `false` from the internal `request()` binding rather than a new constant, to avoid adding to the public `http2.constants` or the `NGHTTP2_ERR_*` set that `test-http2-client-onconnect-errors` iterates.\n\n## Verification\n\n`test-http2-max-session-memory-client-request.js` uses a minimal HTTP/2 peer on a plain TCP socket, so it can actually stop reading:\n\n- While the peer answers requests, submitting batches of requests (yielding between batches) rejects nothing.\n- Once it stops reading, requests are rejected with `ERR_HTTP2_SESSION_MEMORY_EXCEEDED` and the session stays open.\n- After it reads again, a retried request is accepted on the same session.\n- A re"},{"repo":"rust","full":"rust-lang/rust","title":"Auto trait finder: Avoid recomputing `ParamEnv` if nothing changed","comments":53,"url":"https://github.com/rust-lang/rust/pull/165774","body":"<!-- homu-ignore:start -->\n*[View all comments](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/165774)*\n<!-- homu-ignore:end -->\n\nr? @fmease\n\n> [!NOTE] \n> <table>\n> <tr><td>\n> \n> ![ai:0](https://github.com/jdonszelmann/0rwx.com/blob/main/static/50x50/AI-0-50x50.png?raw=true)\n> \n> </td><td>\n> \n> [I've not used an LLM for any part of this PR, or any other PR I make. This includes any related work like research.](https://0rwx.com/.)\n> \n> </td></tr>\n> </table> "},{"repo":"rust","full":"rust-lang/rust","title":"bootstrap: Make low priority the default","comments":39,"url":"https://github.com/rust-lang/rust/pull/165707","body":"<!-- homu-ignore:start -->\n*[View all comments](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/165707)*\n<!-- homu-ignore:end -->\n\nThe `low-priority` option is tucked away so far in `bootstrap.example.toml` that it's nearly impossible to discover by anyone who doesn't think they're doing anything niche (see rust-lang/rust#165702). However, it is beneficial to have it enabled on nearly every system, since a build is a CPU-saturating batch job that has no business preempting foreground applications, which predominantly have nice 0. Consider the following four scenarios ensuing from the change from `low-priority = \"false\"` to `low-priority = \"true\"`:\n\n- There are no processes with non-negligible CPU usage between nice 0 and 10, and bootstrap builds do not get preempted by anything. A system on which this is the case will be unaffected by this change. Examples include CI runners and other build environments with proper build queuing.\n- There are foreground processes between nice 0 and 10 that are relatively light on CPU compared to a bootstrap build and were previously being heavily preempted by bootstrap builds. With this change, a system on which this is the case will see a significant improvement to the latency of interactive programs, enabling the user to comfortably do other things while the build is running without affecting the throughput of the build itself (as the programs are, as established above, light on CPU).\n- There are CPU-intensive but not C"},{"repo":"rust","full":"rust-lang/rust","title":"Add CI workflow to publish backtrace after a push to main","comments":29,"url":"https://github.com/rust-lang/rust/pull/165802","body":"<!-- homu-ignore:start -->\n*[View all comments](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/165802)*\n<!-- homu-ignore:end -->\n\nThis PR implements crate publishing, which is required for https://github.com/rust-lang/backtrace-rs/issues/778, and would be useful also for other use-cases in the future.\nTo keep things simple, I reused the existing post-merge workflow, and implemented the publishing in bash.\n\nTo make this work, we will also need to make changes in team: https://github.com/rust-lang/team/pull/2941\n\nI think that we could start by moving the publishing to `rust-lang/rust`, while still keeping the submodule, and test whether the publishing works as expected. Then we can get rid of the submodule and inline `backtrace` into `rust-lang/rust`.\n\nCC @workingjubilee\n\nI used a chatbot to generate the if condition line in bash (lol), and the `cargo metadata` command.\n\nr? jieyouxu\n"},{"repo":"next.js","full":"vercel/next.js","title":"turbo-tasks-backend: delay collectible propagation until tasks are clean","comments":2,"url":"https://github.com/vercel/next.js/pull/101748","body":"## Summary\n\nBased directly on `canary`; independent of #100889 (see below). Leave this PR in draft.\n\nDelay outgoing collectible deltas while a task is dirty, including through dirty children, and net opposite deltas before propagating them. On the generated 5,000-route `bench/large-app-router` fixture, a warm trigger build drops from **221 to 49 seconds** of Turbopack compilation at 32 CPUs, and main-process peak RSS drops from **19.7 to 13.0 GiB**. This is always enabled; there is no flag or kill-switch.\n\n### Why / how\n\nDuring recomputation, an operation taking/dropping collectibles can repeatedly add and remove the same effects in its aggregated data. Sending every intermediate delta through thousands of uppers amplifies the work, even though many deltas ultimately cancel.\n\n- Add a persisted, transient-filtered meta counter map, `pending_collectibles`, per task/aggregation node.\n- Stage outgoing collectible changes while the task is effectively dirty (self-dirty **or** has dirty containers), also when it has no uppers yet; positive and negative counts cancel in the map. Dirty-state propagation is never delayed.\n- When the task becomes clean, the update's own collectible changes are netted into the map and the whole map is drained into that clean-state update, so it stays one entry per collectible. Without uppers the update isn't sent, which drops the pending changes. `stage_outgoing_collectibles` is called explicitly by the collectible-changing call sites and by `update_dir"},{"repo":"next.js","full":"vercel/next.js","title":"Turbopack: diff server HMR pulls against a Rust-owned loaded-module set","comments":3,"url":"https://github.com/vercel/next.js/pull/102016","body":"### What?\n\nWith Turbopack in `next dev`, a route that is added after editing an already-loaded server module now sees that module's current code. Before, a new route handler importing a newly added export of such a module failed with `TypeError: … is not a function` (HTTP 500).\n\n### Why?\n\nServer HMR pulls are lazy and per route: each route kept its own opaque version baseline, and a route's first pull had no baseline, so it applied nothing. All routes share one module cache in the server runtime, and loading a chunk never replaces a factory the runtime already has. So a shared module kept its pre-edit code for the new route until the route that first loaded it was requested again.\n\nAn alternative fix that catches up earlier routes in JS is in #101721. This PR instead moves the knowledge of what is loaded into Turbopack, so JS doesn't track HMR versions at all.\n\n### How?\n\n- **Rust owns the loaded-module set.** A project-global `State` records, per runtime output directory and module id (externals share ids across runtimes), the content hash the runtime was given, plus which routes have been pulled.\n- **Every pull diffs at module granularity.** The route snapshot groups the route's chunks by runtime output directory, with each module's hash. For each runtime, Rust compares those with the state:\n  - a module the runtime may hold at code that is no longer current is shipped. With server-side nested async chunking, chunks of one runtime can have different code for the same async l"},{"repo":"rust","full":"rust-lang/rust","title":"Pin MSVC to 14.44","comments":42,"url":"https://github.com/rust-lang/rust/pull/166302","body":"<!-- homu-ignore:start -->\n*[View all comments](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/166302)*\n<!-- homu-ignore:end -->\n\nPin all jobs to MSVC 1.44 as a workaround for rust-lang/rust#166301.\n\nr? jieyouxu"}];

const AN = {"gh":{"https://github.com/nodejs/node/pull/66698":{"titleZh":"tls：将缓冲的记录合并为一次读取","pre":true,"sents":[["[[SSL_read() returns at most one TLS record per call]], and TLSWrap::ClearOut() emits a separate read for each one.","SSL_read() 每次调用最多返回一条 TLS 记录，而 ClearOut() 会为每条记录单独触发一次读取。"],["Records can be up to 16 KiB, but [[plenty of servers send smaller ones]]: nginx defaults ssl_buffer_size to 4 KiB.","记录最大可达 16 KiB，但很多服务器发得更小：nginx 默认 ssl_buffer_size 是 4 KiB。"],["With this change ClearOut() [[keeps calling SSL_read() into the same 16 KiB buffer]] while the next record is application data.","这个改动让 ClearOut() 持续把 SSL_read() 读进同一个 16 KiB 缓冲区，只要下一条是应用数据。"],["It never waits for more input, [[it only merges records that have already arrived]], and reads never get bigger than one full record already makes them.","它从不等待更多输入，只合并已经到达的记录，读取从不会超过单条完整记录本身的量。"]],"phrases":[["returns at most one X per call","每次调用最多返回一个 X","描述 API 行为边界","/ɹɪtˈɝnz ˈæt mˈoʊst wˈʌn … pˈɝ kˈɔl/"],["plenty of ... do","很多……会","口语但正式可用","/ˈplɛnti əv ... du/"],["keeps doing X while Y","在 Y 成立时持续做 X","描述循环条件","/kˈips dˈuɪŋ … wˈaɪl …/"],["never waits for more input","从不等待更多输入","强调非阻塞语义","/nˈɛvɚ wˈeɪts fˈɔɹ mˈɔɹ ˈɪnpˌʊt/"],["already arrived","已经到达的","区分缓冲与网络","/ɔlɹˈɛdi ɚˈaɪvd/"]],"sentsHl":[["[[SSL_read() returns at most one TLS record per call]], and TLSWrap::ClearOut() emits a separate read for each one.","SSL_read() 每次调用最多返回一条 TLS 记录，而 ClearOut() 会为每条记录单独触发一次读取。"],["Records can be up to 16 KiB, but [[plenty of servers send smaller ones]]: nginx defaults ssl_buffer_size to 4 KiB.","记录最大可达 16 KiB，但很多服务器发得更小：nginx 默认 ssl_buffer_size 是 4 KiB。"],["With this change ClearOut() [[keeps calling SSL_read() into the same 16 KiB buffer]] while the next record is application data.","这个改动让 ClearOut() 持续把 SSL_read() 读进同一个 16 KiB 缓冲区，只要下一条是应用数据。"],["It never waits for more input, [[it only merges records that have already arrived]], and reads never get bigger than one full record already makes them.","它从不等待更多输入，只合并
