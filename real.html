`vscode-remote://` 或 `vscode-agent-host://` URL 时，它会被转换为等效的 `file://` URL。"]],"phrases":[["integrated browser","集成浏览器","指 IDE 内置的浏览器视图，常与“外部浏览器”相对。","/ˈɪntəɡɹˌeɪtəd bɹˈaʊzɚ/"],["remote workspace","远程工作区","泛指 SSH、WSL、容器等非本机开发环境，是可数名词。","/ɹɪmˈoʊt wˈɝkspˌeɪs/"],["editor association","编辑器关联","指按文件类型指定默认打开方式的配置项，技术文档中常见。","/ˈɛdətɚ əsˌoʊsiˈeɪʃən/"],["custom scheme","自定义协议","URL 中 `://` 前的协议名，如 `vscode-remote://`；scheme 不要译成“计划”。","/kˈʌstəm skˈim/"],["read from the remote","从远程读取","被动语态常用搭配，强调数据来源而非本地磁盘。","/ɹˈɛd fɹˈʌm ðə ɹɪmˈoʊt/"]],"sentsHl":[["In [[remote workspace]]s (SSH, WSL, dev containers) and in Agents window sessions on remote agent hosts, you couldn't open an HTML file in the [[integrated browser]].","在远程工作区（SSH、WSL、开发容器）以及远程代理主机上的 Agents 窗口会话中，你无法在集成浏览器中打开 HTML 文件。"],["The \"Open in [[Integrated Browser]]\" action and the editor association that opens HTML files in the browser only covered local `file:` resources.","“在集成浏览器中打开”操作以及在浏览器中打开 HTML 文件的编辑器关联仅覆盖了本地 `file:` 资源。"],["The browser also can't read a remote's disk, and Chromium refuses to redirect from a [[custom scheme]] like `vscode-remote://` to `file:`.","浏览器也无法读取远程磁盘，并且 Chromium 拒绝从 `vscode-remote://` 这类自定义协议重定向到 `file:`。"],["This PR lets the [[integrated browser]] open HTML files that live on a remote.","此 PR 使集成浏览器能够打开位于远程的 HTML 文件。"],["The browser keeps showing a normal `file://` URL, and the requests for it are answered with the file's content [[read from the remote]].","浏览器继续显示普通的 `file://` URL，而对其请求的响应则使用从远程读取的文件内容来作答。"],["When a tab opens a `vscode-remote://` or `vscode-agent-host://` URL, it is turned into the equivalent `file://` URL.","当标签页打开 `vscode-remote://` 或 `vscode-agent-host://` URL 时，它会被转换为等效的 `file://` URL。"]]},"https://github.com/rust-lang/rust/pull/165879":{"titleZh":"重新添加 `#[rustc_test_entrypoint_marker]` ！","sents":[["Re-add the unstable and internal `#[rustc_test_entrypoint_marker]` (first sighted in rust-lang/rust#158854)!","重新添加不稳定的、内部的 `#[rustc_test_entrypoint_marker]`（首次出现于 rust-lang/rust#158854）！"],["This is helpful for tools like [Charon](https://github.com/AeneasVerif/charon) to translate test entry points, since once test generation is done there is no simple way of finding these: otherwise one needs to look for statics with `#[rustc_test_marker]`, visit their body, and look for a path to a function inside that body (ugly!)","这对像 [Charon](https://github.com/AeneasVerif/charon) 这样的工具在翻译测试入口点时有帮助，因为一旦测试生成完成，就没有简单的方法找到这些入口点：否则就需要查找带有 `#[rustc_test_marker]` 的静态项、访问它们的函数体，并在该函数体内寻找指向某个函数的路径（很难看！）"],["now that synthetic attributes exist doing this is simple and shouldnt cause any regressions :3 (fingers crossed)","既然现在已有合成属性，做这件事就很简单，而且应该不会造成任何回归 :3（祈祷）"],["If you used an LLM to generate any part of this PR, including the PR description, please disclose that according to our [guidelines][disclosure guidelines].","如果你使用 LLM 生成了本 PR 的任何部分（包括 PR 描述），请按照我们的[指南][disclosure guidelines]进行披露。"],["LLM contributions are not banned, but are held to a higher standard of review and correctness.","LLM 贡献并未被禁止，但会被要求达到更高的审查和正确性标准。"],["If this PR is related to an unstable feature or an otherwise tracked effort, please link to the relevant tracking issue here.","如果本 PR 与某个不稳定特性或其他已跟踪的工作相关，请在此处链接相关的跟踪 issue。"]],"phrases":[["re-add an attribute","重新添加属性","用于 PR 标题，表示此前移除或改动过的属性再次被加回。","/riˈæd ən ˈætrəˌbjut/"],["test entry points","测试入口点","编译器与工具链语境中指测试用例最终调用的函数入口。","/tˈɛst ˈɛntɹi pˈɔɪnts/"],["synthetic attributes","合成属性","Rust 编译器内部机制，指编译器自动生成的属性，而非用户手写。","/sɪnθˈɛtɪk ˈætɹəbjˌuts/"],["cause regressions","造成回归","描述代码改动引入旧功能退化时的高频表达，常搭配 should not / might。","/kˈɑz ɹəɡɹˈɛʃənz/"],["tracking issue","跟踪 issue","Rust 社区用语，指用于追踪某个不稳定特性进展的长期 issue。","/tɹˈækɪŋ ˈɪʃu/"]],"sentsHl":[["Re-add the unstable and internal `#[rustc_test_entrypoint_marker]` (first sighted in rust-lang/rust#158854)!","重新添加不稳定的、内部的 `#[rustc_test_entrypoint_marker]`（首次出现于 rust-lang/rust#158854）！"],["This is helpful for tools like [Charon](https://github.com/AeneasVerif/charon) to translate [[test entry points]], since once test generation is done there is no simple way of finding these: otherwise one needs to look for statics with `#[rustc_test_marker]`, visit their body, and look for a path to a function inside that body (ugly!)","这对像 [Charon](https://github.com/AeneasVerif/charon) 这样的工具在翻译测试入口点时有帮助，因为一旦测试生成完成，就没有简单的方法找到这些入口点：否则就需要查找带有 `#[rustc_test_marker]` 的静态项、访问它们的函数体，并在该函数体内寻找指向某个函数的路径（很难看！）"],["now that [[synthetic attributes]] exist doing this is simple and shouldnt cause any regressions :3 (fingers crossed)","既然现在已有合成属性，做这件事就很简单，而且应该不会造成任何回归 :3（祈祷）"],["If you used an LLM to generate any part of this PR, including the PR description, please disclose that according to our [guidelines][disclosure guidelines].","如果你使用 LLM 生成了本 PR 的任何部分（包括 PR 描述），请按照我们的[指南][disclosure guidelines]进行披露。"],["LLM contributions are not banned, but are held to a higher standard of review and correctness.","LLM 贡献并未被禁止，但会被要求达到更高的审查和正确性标准。"],["If this PR is related to an unstable feature or an otherwise tracked effort, please link to the relevant [[tracking issue]] here.","如果本 PR 与某个不稳定特性或其他已跟踪的工作相关，请在此处链接相关的跟踪 issue。"]]},"https://github.com/vercel/next.js/pull/101464":{"titleZh":"添加实验性原生 Go 代理支持","sents":[["Add `proxy.go` and `src/proxy.go` with a `Proxy(http.ResponseWriter, *http.Request)` handler.","添加 `proxy.go` 和 `src/proxy.go`，其中包含一个 `Proxy(http.ResponseWriter, *http.Request)` 处理函数。"],["`experimental.goRoutes: true` enables both Go routes and proxies.","`experimental.goRoutes: true` 会同时启用 Go 路由和代理。"],["Turbopack compiles the handler into a native HTTP worker for `next dev` and `next start`, with continuation, rewrites, redirects, request-header overrides, cookies, body replay, and streaming responses.","Turbopack 将该处理函数编译为原生 HTTP worker，用于 `next dev` 和 `next start`，支持继续处理、重写、重定向、请求头覆盖、cookie、请求体重放和流式响应。"],["Adapter builds emit a `MIDDLEWARE` output with `runtime: 'go'` and a PORT-based executable.","适配器构建会产出带有 `runtime: 'go'` 的 `MIDDLEWARE` 输出以及一个基于 PORT 的可执行文件。"],["Go directory snapshots now respect the filesystem's denied paths, allowing a project-root proxy to compile alongside excluded `.next` output directories.","Go 目录快照现在会遵循文件系统的拒绝路径，从而允许项目根目录的代理与被排除的 `.next` 输出目录一起编译。"],["**Empty request-header replacement:** in Go, a non-nil empty `ProxyOptions.Request.Headers` (`http.Header{}`) removes every downstream request header, while a `nil` map preserves them.","**空请求头替换：** 在 Go 中，非 nil 的空 `ProxyOptions.Request.Headers`（`http.Header{}`）会移除所有下游请求头，而 `nil` map 会保留它们。"]],"phrases":[["native HTTP worker","原生 HTTP worker","指编译成可独立处理 HTTP 请求的进程，常见于运行时/构建工具文档。","/nˈeɪtɪv ˌeɪtʃtˌitˌipˈi wˈɝkɚ/"],["request-header override","请求头覆盖","描述代理或中间件修改转发请求头的功能，常与 cookies、redirects 并列。","/ɹɪˈkwɛstˌhɛdɚ ˌoʊvɚˈɹaɪd/"],["body replay","请求体重放","指代理读取请求体后重新构造并转发，用于流式或中间件场景。","/bˈɑdi ɹiplˈeɪ/"],["streaming responses","流式响应","指边生成边发送的响应，常与 worker、handler 等词搭配。","/stɹˈimɪŋ ɹɪspˈɑnsɪz/"],["denied paths","拒绝路径","文件系统快照/遍历场景中指不允许访问的路径，常与 respect 搭配。","/dɪnˈaɪd pˈæðz/"]],"sentsHl":[["Add `proxy.go` and `src/proxy.go` with a `Proxy(http.ResponseWriter, *http.Request)` handler.","添加 `proxy.go` 和 `src/proxy.go`，其中包含一个 `Proxy(http.ResponseWriter, *http.Request)` 处理函数。"],["`experimental.goRoutes: true` enables both Go routes and proxies.","`experimental.goRoutes: true` 会同时启用 Go 路由和代理。"],["Turbopack compiles the handler into a [[native HTTP worker]] for `next dev` and `next start`, with continuation, rewrites, redirects, request-header overrides, cookies, body replay, and streaming responses.","Turbopack 将该处理函数编译为原生 HTTP worker，用于 `next dev` 和 `next start`，支持继续处理、重写、重定向、请求头覆盖、cookie、请求体重放和流式响应。"],["Adapter builds emit a `MIDDLEWARE` output with `runtime: 'go'` and a PORT-based executable.","适配器构建会产出带有 `runtime: 'go'` 的 `MIDDLEWARE` 输出以及一个基于 PORT 的可执行文件。"],["Go directory snapshots now respect the filesystem's [[denied paths]], allowing a project-root proxy to compile alongside excluded `.next` output directories.","Go 目录快照现在会遵循文件系统的拒绝路径，从而允许项目根目录的代理与被排除的 `.next` 输出目录一起编译。"],["**Empty request-header replacement:** in Go, a non-nil empty `ProxyOptions.Request.Headers` (`http.Header{}`) removes every downstream request header, while a `nil` map preserves them.","**空请求头替换：** 在 Go 中，非 nil 的空 `ProxyOptions.Request.Headers`（`http.Header{}`）会移除所有下游请求头，而 `nil` map 会保留它们。"]]},"https://github.com/microsoft/vscode/pull/348306":{"titleZh":"编辑器窗口：工作树支持（chat.editorWindow.enableWorktree）","sents":[["In a window with a single local folder, `chat.editorWindow.enableWorktree` (experimental, default off) lets local agent host chats work in git worktrees of that folder: the window's folder follows the chat you open to its worktree, and new chats can start in a new worktree.","在只有一个本地文件夹的窗口中，`chat.editorWindow.enableWorktree`（实验性功能，默认关闭）允许本地代理宿主聊天在该文件夹的 git 工作树中工作：窗口的文件夹会跟随你打开的聊天切换到其工作树，新聊天也可以在新的工作树中启动。"],["opening a chat moves the folder to where it works, and back for a local chat; it also follows a chat's working directory as it changes.","打开聊天会把文件夹移动到它工作所在的位置，对于本地聊天则移回原处；它还会随聊天工作目录的变化而跟随。"],["worktrees that agent host sessions work in become folder locations, for every folder location picker.","代理宿主会话所使用的工作树会成为文件夹位置，适用于所有文件夹位置选择器。"],["on the first send of a new chat in a folder with another chat active there in the last day, a callout on the worktree control asks once; later chats use the answer.","当在一个文件夹中首次发送新聊天，而该文件夹在过去一天内有另一个活跃聊天时，工作树控件上会弹出提示询问一次；后续聊天会沿用该回答。"],["**Worktrees filter** in both sessions lists (editor windows only): pick a folder to see only its sessions; picking opens its last-shown session.","两个会话列表中的**工作树筛选器**（仅限编辑器窗口）：选择一个文件夹即可只查看其会话；选择后会打开该文件夹最后显示的会话。"]],"phrases":[["default off","默认关闭","描述功能开关的初始状态，常见于实验性功能说明。","/dɪfˈɔlt ˈɔf/"],["work in git worktrees","在 git 工作树中工作","worktree 是 git 的多工作目录机制，注意与 working directory 区分。","/wɝk ɪn ɡɪt ˈwɝkˌtriz/"],["folder location picker","文件夹位置选择器","UI 组件名称，picker 指下拉或弹窗式的选择控件。","/fˈoʊldɚ loʊkˈeɪʃən pˈɪkɚ/"],["New Chat in Worktree","在工作树中新建聊天","菜单项名称，介词 in 表示聊天运行的环境。","/nu tʃæt ɪn ˈwɝkˌtri/"],["Submit handlers","提交处理程序","handler 指处理某类事件或请求的函数，技术文档中高频出现。","/səbmˈɪt hˈændlɚz/"]],"sentsHl":[["In a window with a single local folder, `chat.editorWindow.enableWorktree` (experimental, [[default off]]) lets local agent host chats work in git worktrees of that folder: the window's folder follows the chat you open to its worktree, and new chats can start in a new worktree.","在只有一个本地文件夹的窗口中，`chat.editorWindow.enableWorktree`（实验性功能，默认关闭）允许本地代理宿主聊天在该文件夹的 git 工作树中工作：窗口的文件夹会跟随你打开的聊天切换到其工作树，新聊天也可以在新的工作树中启动。"],["opening a chat moves the folder to where it works, and back for a local chat; it also follows a chat's working directory as it changes.","打开聊天会把文件夹移动到它工作所在的位置，对于本地聊天则移回原处；它还会随聊天工作目录的变化而跟随。"],["worktrees that agent host sessions work in become folder locations, for every [[folder location picker]].","代理宿主会话所使用的工作树会成为文件夹位置，适用于所有文件夹位置选择器。"],["on the first send of a new chat in a folder with another chat active there in the last day, a callout on the worktree control asks once; later chats use the answer.","当在一个文件夹中首次发送新聊天，而该文件夹在过去一天内有另一个活跃聊天时，工作树控件上会弹出提示询问一次；后续聊天会沿用该回答。"],["**Worktrees filter** in both sessions lists (editor windows only): pick a folder to see only its sessions; picking opens its last-shown session.","两个会话列表中的**工作树筛选器**（仅限编辑器窗口）：选择一个文件夹即可只查看其会话；选择后会打开该文件夹最后显示的会话。"]]},"https://github.com/microsoft/vscode/pull/348283":{"titleZh":"聊天视图：列出智能体窗口的会话（chat.viewSessions.sessionsList.enabled）","sents":[["The Chat view of an editor window shows the sessions of the Agents window, in the shared Sessions list of editor windows, in place of its own sessions list.","编辑器窗口的聊天视图会在编辑器窗口的共享会话列表中显示智能体窗口的会话，以替代它自己的会话列表。"],["The Chat view keeps its own chat input, for new chats and for the chats it shows.","聊天视图保留自己的聊天输入框，用于新聊天以及它显示的聊天。"],["**Stack / merge order:** a feature PR; merge LAST, after its infra: #348290 (shared sessions list), #348302 (Chat view seams), #348308 (sessions runtime), #348309 (chat part).","**堆叠/合并顺序：** 这是一个功能 PR；最后合并，在其基础设施之后：#348290（共享会话列表）、#348302（聊天视图接缝）、#348308（会话运行时）、#348309（聊天部分）。"],["All are merged in; the diff shrinks as they land.","它们都已合并进来；随着它们落地，diff 会缩小。"],["It applies live, without a reload: turning it on registers the list and its providers' hold; turning it off disposes all of it and the Chat view shows its own sessions list again.","它实时生效，无需重新加载：开启它会注册该列表及其提供者的持有；关闭它会释放所有这些内容，聊天视图再次显示自己的会话列表。"],["If #347688's `chat.sessionsView.enabled` is on, this feature stays off.","如果 #347688 的 `chat.sessionsView.enabled` 处于开启状态，则此功能保持关闭。"]],"phrases":[["merge order","合并顺序","描述多个 PR 的合并先后时使用，常与 stack 搭配。","/mˈɝdʒ ˈɔɹdɚ/"],["up to date with main","与 main 分支同步","PR 描述中说明分支已同步主分支的常用说法。","/ˈʌp tˈu dˈeɪt wˈɪð mˈeɪn/"],["default off","默认关闭","描述实验性开关时常用，与 default on 相对。","/dɪfˈɔlt ˈɔf/"],["applies live","实时生效","说明配置修改无需重启即可生效。","/əplˈaɪz lˈaɪv/"],["take effect on restart","重启后生效","与 applies live 对比，强调需要重启才生效的配置。","/tˈeɪk ɪfˈɛkt ˈɑn ɹistˈɑɹt/"]],"sentsHl":[["The Chat view of an editor window shows the sessions of the Agents window, in the shared Sessions list of editor windows, in place of its own sessions list.","编辑器窗口的聊天视图会在编辑器窗口的共享会话列表中显示智能体窗口的会话，以替代它自己的会话列表。"],["The Chat view keeps its own chat input, for new chats and for the chats it shows.","聊天视图保留自己的聊天输入框，用于新聊天以及它显示的聊天。"],["**Stack / [[merge order]]:** a feature PR; merge LAST, after its infra: #348290 (shared sessions list), #348302 (Chat view seams), #348308 (sessions runtime), #348309 (chat part).","**堆叠/合并顺序：** 这是一个功能 PR；最后合并，在其基础设施之后：#348290（共享会话列表）、#348302（聊天视图接缝）、#348308（会话运行时）、#348309（聊天部分）。"],["All are merged in; the diff shrinks as they land.","它们都已合并进来；随着它们落地，diff 会缩小。"],["It [[applies live]], without a reload: turning it on registers the list and its providers' hold; turning it off disposes all of it and the Chat view shows its own sessions list again.","它实时生效，无需重新加载：开启它会注册该列表及其提供者的持有；关闭它会释放所有这些内容，聊天视图再次显示自己的会话列表。"],["If #347688's `chat.sessionsView.enabled` is on, this feature stays off.","如果 #347688 的 `chat.sessionsView.enabled` 处于开启状态，则此功能保持关闭。"]]},"https://github.com/rust-lang/rust/pull/165609":{"titleZh":"OIDC 制品推送","sents":[["This implements the r-l/r side of https://github.com/rust-lang/simpleinfra/pull/1305.","这实现了 https://github.com/rust-lang/simpleinfra/pull/1305 中 r-l/r 一侧的工作。"]],"phrases":[["implement the ... side of","实现……一侧（的工作）","用于说明某个跨仓库改动中本方负责的部分。","/ˈɪmpləˌmɛnt ðə saɪd ʌv/"],["artifact push","制品推送","指把构建产物上传到存储或分发系统，常见于 CI/CD 场景。","/ˈɑɹtəfˌækt pˈʊʃ/"],["pull request","拉取请求","GitHub 协作流程中的核心概念，常缩写为 PR。","/pˈʊl ɹɪkwˈɛst/"]],"sentsHl":[["This implements the r-l/r side of https://github.com/rust-lang/simpleinfra/pull/1305.","这实现了 https://github.com/rust-lang/simpleinfra/pull/1305 中 r-l/r 一侧的工作。"]]},"https://github.com/nodejs/node/pull/67361":{"titleZh":"http2：对客户端请求强制执行 maxSessionMemory","sents":[["The documentation for `maxSessionMemory` says new `Http2Stream` instances are rejected while the limit is exceeded.","`maxSessionMemory` 的文档说明，当超出限制时，新的 `Http2Stream` 实例会被拒绝。"],["`session.request()` went straight to `nghttp2_submit_request()`, so a client whose socket stopped draining could keep submitting requests, queuing them in nghttp2 without bound.","`session.request()` 直接调用 `nghttp2_submit_request()`，因此当客户端的套接字停止排空时，它可以继续提交请求，无限制地在 nghttp2 中排队。"],["This checks the session memory in `Http2Session::Request()` before submitting and fails only that request with a new `ERR_HTTP2_SESSION_MEMORY_EXCEEDED` error.","此改动在提交前于 `Http2Session::Request()` 中检查会话内存，并仅以新的 `ERR_HTTP2_SESSION_MEMORY_EXCEEDED` 错误使该请求失败。"],["Nothing is sent to the peer, so the request is safe to retry, and the session stays usable.","不会向对端发送任何内容，因此该请求可以安全重试，会话也保持可用。"],["As with response headers (#67114), request bodies queued for flow control are not counted, so a large upload does not block unrelated requests on the same session.","与响应头（#67114）一样，为流控而排队的请求体不计入统计，因此大文件上传不会阻塞同一会话上的无关请求。"],["The rejection is signalled by returning `false` from the internal `request()` binding rather than a new constant, to avoid adding to the public `http2.constants` or the `NGHTTP2_ERR_*` set that `test-http2-client-onconnect-errors` iterates.","拒绝通过从内部 `request()` 绑定返回 `false` 来表示，而非新增常量，以避免添加到公共的 `http2.constants` 或 `test-http2-client-onconnect-errors` 所遍历的 `NGHTTP2_ERR_*` 集合中。"]],"phrases":[["enforce a limit","强制执行限制","常用于描述对资源上限的实际检查与拦截。","/ɛnfˈɔɹs ə lˈɪmət/"],["go straight to","直接调用／直接进入","强调跳过中间检查或封装，直接调用底层函数。","/ɡˈoʊ stɹˈeɪt tˈu/"],["be safe to retry","可以安全重试","用于说明失败操作没有副作用，重试不会造成重复影响。","/bˈi sˈeɪf tˈu ɹitɹˈaɪ/"],["count towards","计入","说明某部分数据是否纳入配额或统计，否定式常用 not counted。","/kˈaʊnt təwˈɔɹdz/"],["stay usable","保持可用","描述出错后连接或会话仍能继续正常工作。","/stˈeɪ jˈuzəbəl/"]],"sentsHl":[["The documentation for `maxSessionMemory` says new `Http2Stream` instances are rejected while the limit is exceeded.","`maxSessionMemory` 的文档说明，当超出限制时，新的 `Http2Stream` 实例会被拒绝。"],["`session.request()` went straight to `nghttp2_submit_request()`, so a client whose socket stopped draining could keep submitting requests, queuing them in nghttp2 without bound.","`session.request()` 直接调用 `nghttp2_submit_request()`，因此当客户端的套接字停止排空时，它可以继续提交请求，无限制地在 nghttp2 中排队。"],["This checks the session memory in `Http2Session::Request()` before submitting and fails only that request with a new `ERR_HTTP2_SESSION_MEMORY_EXCEEDED` error.","此改动在提交前于 `Http2Session::Request()` 中检查会话内存，并仅以新的 `ERR_HTTP2_SESSION_MEMORY_EXCEEDED` 错误使该请求失败。"],["Nothing is sent to the peer, so the request is safe to retry, and the session stays usable.","不会向对端发送任何内容，因此该请求可以安全重试，会话也保持可用。"],["As with response headers (#67114), request bodies queued for flow control are not counted, so a large upload does not block unrelated requests on the same session.","与响应头（#67114）一样，为流控而排队的请求体不计入统计，因此大文件上传不会阻塞同一会话上的无关请求。"],["The rejection is signalled by returning `false` from the internal `request()` binding rather than a new constant, to avoid adding to the public `http2.constants` or the `NGHTTP2_ERR_*` set that `test-http2-client-onconnect-errors` iterates.","拒绝通过从内部 `request()` 绑定返回 `false` 来表示，而非新增常量，以避免添加到公共的 `http2.constants` 或 `test-http2-client-onconnect-errors` 所遍历的 `NGHTTP2_ERR_*` 集合中。"]]},"https://github.com/nodejs/node/pull/67452":{"titleZh":"[v26.x] V8 向后移植","sents":[["Extracted from:","提取自："],["Bundling them optimistically, to run CI once","乐观地将它们打包，以便只运行一次 CI"]],"phrases":[["backport","向后移植","指把新版本的修复移植回旧版本分支，常见于维护分支的 PR 标题。","/ˈbækˌpɔrt/"],["bundle them","将它们打包合并","把多个改动合并到一起处理，bundle 后可接 together 或 into one PR。","/bˈʌndəl ðˈɛm/"],["run CI","运行持续集成","CI 作不可数名词使用，前面常加 the，如 run the CI。","/rʌn ˌsiˈaɪ/"],["optimistically","乐观地（先假定可行）","在工程语境中表示先按乐观假设推进，失败再调整。","/ˌɑptɪmˈɪstɪkəli/"]],"sentsHl":[["Extracted from:","提取自："],["Bundling them [[optimistically]], to [[run CI]] once","乐观地将它们打包，以便只运行一次 CI"]]},"https://github.com/rust-lang/rust/pull/165774":{"titleZh":"自动 trait 查找器：无变化时避免重新计算 `ParamEnv`","sents":[["Auto trait finder: Avoid recomputing `ParamEnv` if nothing changed","自动 trait 查找器：如果没有任何变化，就避免重新计算 `ParamEnv`"],["I've not used an LLM for any part of this PR, or any other PR I make.","我在这个 PR 或我提交的任何其他 PR 的任何环节中都没有使用过 LLM。"],["This includes any related work like research.","这包括任何相关的工作，比如调研。"],["View all comments","查看所有评论"],["r? @fmease","请求 @fmease 评审"]],"phrases":[["avoid recomputing","避免重新计算","性能优化类 PR 的常见说法，后接名词或动名词，表示省去重复计算。","/əˈvɔɪd ˌɹiːkəmˈpjuːtɪŋ/"],["if nothing changed","如果没有任何变化","常用于缓存或增量更新的条件判断，说明只在状态变化时才执行。","/ˈɪf nˈʌθɪŋ tʃˈeɪndʒd/"],["use an LLM for","为……使用大语言模型","AI 使用声明中的固定搭配，后接具体用途或环节。","/juːz ən ˌɛl ˌɛl ˈɛm fɔɹ/"],["related work","相关工作","学术与技术写作中泛指与主题相关的其他工作或研究。","/ɹɪlˈeɪtɪd wˈɝk/"],["View all comments","查看所有评论","GitHub 界面中的链接文本，动词短语作祈使式标题。","/vjˈu ˈɔl kˈɑmɛnts/"]],"sentsHl":[["Auto trait finder: [[Avoid recomputing]] `ParamEnv` if nothing changed","自动 trait 查找器：如果没有任何变化，就避免重新计算 `ParamEnv`"],["I've not used an LLM for any part of this PR, or any other PR I make.","我在这个 PR 或我提交的任何其他 PR 的任何环节中都没有使用过 LLM。"],["This includes any [[related work]] like research.","这包括任何相关的工作，比如调研。"],["[[View all comments]]","查看所有评论"],["r? @fmease","请求 @fmease 评审"]]},"https://github.com/rust-lang/rust/pull/165707":{"titleZh":"bootstrap：将低优先级设为默认","sents":[["The `low-priority` option is tucked away so far in `bootstrap.example.toml` that it's nearly impossible to discover by anyone who doesn't think they're doing anything niche (see rust-lang/rust#165702).","`low-priority` 选项在 `bootstrap.example.toml` 中被藏得太深，以至于任何不认为自己正在做冷门事情的人几乎都不可能发现它（见 rust-lang/rust#165702）。"],["However, it is beneficial to have it enabled on nearly every system, since a build is a CPU-saturating batch job that has no business preempting foreground applications, which predominantly have nice 0.","然而，在几乎所有系统上启用它都是有益的，因为构建是一个会占满 CPU 的批处理任务，没有理由抢占前台应用程序，而前台应用通常具有 nice 0。"],["Consider the following four scenarios ensuing from the change from `low-priority = \"false\"` to `low-priority = \"true\"`:","考虑从 `low-priority = \"false\"` 改为 `low-priority = \"true\"` 后出现的以下四种场景："],["There are no processes with non-negligible CPU usage between nice 0 and 10, and bootstrap builds do not get preempted by anything.","在 nice 0 到 10 之间没有 CPU 使用率不可忽略的进程，且 bootstrap 构建不会被任何东西抢占。"],["There are foreground processes between nice 0 and 10 that are relatively light on CPU compared to a bootstrap build and were previously being heavily preempted by bootstrap builds.","在 nice 0 到 10 之间存在前台进程，它们相对于 bootstrap 构建而言 CPU 负载较轻，并且此前一直被 bootstrap 构建大量抢占。"],["With this change, a system on which this is the case will see a significant improvement to the latency of interactive programs, enabling the user to comfortably do other things while the build is running without affecting the throughput of the build itself (as the programs are, as established above, light on CPU).","通过此更改，处于这种情况的系统将看到交互式程序的延迟显著改善，使用户能够在构建运行期间舒适地做其他事情，而不会影响构建本身的吞吐量（如上所述，这些程序的 CPU 负载较轻）。"]],"phrases":[["tucked away","藏起来；放在不显眼处","常用来形容配置项、功能入口隐蔽、不易发现。","/tˈʌkt əwˈeɪ/"],["CPU-saturating batch job","占满 CPU 的批处理任务","描述长时间高负载任务时很地道的搭配，saturate 表示使饱和。","/ˌsiːpiːˈjuː ˈsætʃəreɪtɪŋ bætʃ dʒɑːb/"],["have no business doing sth.","没有理由做某事；不该做某事","口语化表达，强调某行为不合理或越界，技术讨论中可用于说明优先级设计。","/hæv noʊ ˈbɪznəs ˈduːɪŋ ˈsʌmθɪŋ/"],["get preempted by","被……抢占","操作系统调度语境常用被动语态，preempt 指高优先级任务打断低优先级任务。","/ɡˈɛt pɹiˈɛmptɪd bˈaɪ/"],["see a significant improvement to","在……方面看到显著改善","技术写作中描述性能或体验提升的常见句式，后接名词。","/sˈi ə səɡnˈɪfɪkənt ˌɪmpɹˈuvmənt tˈu/"]],"sentsHl":[["The `low-priority` option is [[tucked away]] so far in `bootstrap.example.toml` that it's nearly impossible to discover by anyone who doesn't think they're doing anything niche (see rust-lang/rust#165702).","`low-priority` 选项在 `bootstrap.example.toml` 中被藏得太深，以至于任何不认为自己正在做冷门事情的人几乎都不可能发现它（见 rust-lang/rust#165702）。"],["However, it is beneficial to have it enabled on nearly every system, since a build is a [[CPU-saturating batch job]] that has no business preempting foreground applications, which predominantly have nice 0.","然而，在几乎所有系统上启用它都是有益的，因为构建是一个会占满 CPU 的批处理任务，没有理由抢占前台应用程序，而前台应用通常具有 nice 0。"],["Consider the following four scenarios ensuing from the change from `low-priority = \"false\"` to `low-priority = \"true\"`:","考虑从 `low-priority = \"false\"` 改为 `low-priority = \"true\"` 后出现的以下四种场景："],["There are no processes with non-negligible CPU usage between nice 0 and 10, and bootstrap builds do not [[get preempted by]] anything.","在 nice 0 到 10 之间没有 CPU 使用率不可忽略的进程，且 bootstrap 构建不会被任何东西抢占。"],["There are foreground processes between nice 0 and 10 that are relatively light on CPU compared to a bootstrap build and were previously being heavily preempted by bootstrap builds.","在 nice 0 到 10 之间存在前台进程，它们相对于 bootstrap 构建而言 CPU 负载较轻，并且此前一直被 bootstrap 构建大量抢占。"],["With this change, a system on which this is the case will [[see a significant improvement to]] the latency of interactive programs, enabling the user to comfortably do other things while the build is running without affecting the throughput of the build itself (as the programs are, as established above, light on CPU).","通过此更改，处于这种情况的系统将看到交互式程序的延迟显著改善，使用户能够在构建运行期间舒适地做其他事情，而不会影响构建本身的吞吐量（如上所述，这些程序的 CPU 负载较轻）。"]]},"https://github.com/rust-lang/rust/pull/165802":{"titleZh":"添加 CI 工作流：在推送到 main 后发布 backtrace","sents":[["This PR implements crate publishing, which is required for https://github.com/rust-lang/backtrace-rs/issues/778, and would be useful also for other use-cases in the future.","这个 PR 实现了 crate 发布，这是 https://github.com/rust-lang/backtrace-rs/issues/778 所需要的，将来对其他用例也会有用。"],["To keep things simple, I reused the existing post-merge workflow, and implemented the publishing in bash.","为了保持简单，我复用了现有的合并后工作流，并用 bash 实现了发布。"],["To make this work, we will also need to make changes in team: https://github.com/rust-lang/team/pull/2941","为了让这个方案生效，我们还需要在 team 仓库中做修改：https://github.com/rust-lang/team/pull/2941"],["I think that we could start by moving the publishing to `rust-lang/rust`, while still keeping the submodule, and test whether the publishing works as expected.","我认为我们可以先把发布流程迁移到 `rust-lang/rust`，同时仍然保留子模块，并测试发布是否按预期工作。"],["Then we can get rid of the submodule and inline `backtrace` into `rust-lang/rust`.","然后我们可以去掉子模块，把 `backtrace` 内联到 `rust-lang/rust` 中。"],["I used a chatbot to generate the if condition line in bash (lol), and the `cargo metadata` command.","我用聊天机器人生成了 bash 中的 if 条件行（哈哈），以及 `cargo metadata` 命令。"]],"phrases":[["crate publishing","crate 发布","指把 Rust crate 发布到 crates.io 等 registry 的流程。","/kɹˈeɪt pˈʌblɪʃɪŋ/"],["post-merge workflow","合并后工作流","指 PR 合并或推送到主分支后触发的 CI 流程。","/ˈpoʊstˌmɝdʒ ˈwɝkˌfloʊ/"],["move ... to ...","把……迁移到……","描述重构或迁移逻辑时常用，如 move the publishing to another repo。","/muv ... tu .../"],["get rid of","去掉、移除","口语化表达，技术讨论中常指删除不再需要的东西，如 get rid of the submodule。","/ɡˈɛt ɹˈɪd ˈʌv/"],["work as expected","按预期工作","测试和验证场景常用，表示行为符合预期。","/wˈɝk ˈæz ɪkspˈɛktəd/"]],"sentsHl":[["This PR implements [[crate publishing]], which is required for https://github.com/rust-lang/backtrace-rs/issues/778, and would be useful also for other use-cases in the future.","这个 PR 实现了 crate 发布，这是 https://github.com/rust-lang/backtrace-rs/issues/778 所需要的，将来对其他用例也会有用。"],["To keep things simple, I reused the existing [[post-merge workflow]], and implemented the publishing in bash.","为了保持简单，我复用了现有的合并后工作流，并用 bash 实现了发布。"],["To make this work, we will also need to make changes in team: https://github.com/rust-lang/team/pull/2941","为了让这个方案生效，我们还需要在 team 仓库中做修改：https://github.com/rust-lang/team/pull/2941"],["I think that we could start by moving the publishing to `rust-lang/rust`, while still keeping the submodule, and test whether the publishing works as expected.","我认为我们可以先把发布流程迁移到 `rust-lang/rust`，同时仍然保留子模块，并测试发布是否按预期工作。"],["Then we can [[get rid of]] the submodule and inline `backtrace` into `rust-lang/rust`.","然后我们可以去掉子模块，把 `backtrace` 内联到 `rust-lang/rust` 中。"],["I used a chatbot to generate the if condition line in bash (lol), and the `cargo metadata` command.","我用聊天机器人生成了 bash 中的 if 条件行（哈哈），以及 `cargo metadata` 命令。"]]},"https://github.com/vercel/next.js/pull/101748":{"titleZh":"turbo-tasks-backend：延迟可收集项的传播，直到任务变为干净状态","sents":[["Delay outgoing collectible deltas while a task is dirty, including through dirty children, and net opposite deltas before propagating them.","当任务处于脏状态时，延迟向外发送可收集项的增量，包括通过脏子任务传递的情况，并在传播之前将相反的增量进行净额抵消。"],["On the generated 5,000-route `bench/large-app-router` fixture, a warm trigger build drops from **221 to 49 seconds** of Turbopack compilation at 32 CPUs, and main-process peak RSS drops from **19.7 to 13.0 GiB**.","在生成的包含 5,000 条路由的 `bench/large-app-router` 测试夹具上，32 核 CPU 下的 Turbopack 编译热触发构建从 **221 秒降至 49 秒**，主进程峰值 RSS 从 **19.7 GiB 降至 13.0 GiB**。"],["During recomputation, an operation taking/dropping collectibles can repeatedly add and remove the same effects in its aggregated data.","在重新计算期间，一个获取/丢弃可收集项的操作可能会在其聚合数据中反复添加和移除相同的效果。"],["Sending every intermediate delta through thousands of uppers amplifies the work, even though many deltas ultimately cancel.","将每个中间增量发送给数千个上层任务会放大工作量，尽管许多增量最终会相互抵消。"],["Stage outgoing collectible changes while the task is effectively dirty (self-dirty **or** has dirty containers), also when it has no uppers yet; positive and negative counts cancel in the map.","在任务实际处于脏状态时（自身脏 **或** 拥有脏容器），暂存向外发送的可收集项变更，即使它还没有上层任务也这样做；正负计数在地图中相互抵消。"],["When the task becomes clean, the update's own collectible changes are netted into the map and the whole map is drained into that clean-state update, so it stays one entry per collectible.","当任务变为干净状态时，该更新自身的可收集项变更会被净额计入地图，整个地图被排空到该干净状态更新中，因此每个可收集项保持一个条目。"]],"phrases":[["delay outgoing collectible deltas","延迟向外发送可收集项增量","delay 后接动名词或名词短语，表示推迟某类数据的发送时机","/dɪlˈeɪ ˈaʊtɡˌoʊɪŋ kəlˈɛktəbəl dˈɛltəz/"],["net opposite deltas","净额抵消相反的增量","net 作动词表示将正负相抵后的净值计算出来，技术文档中常与 delta、change 搭配","/nˈɛt ˈɑpəzət dˈɛltəz/"],["warm trigger build","热触发构建","warm 指缓存已预热后的状态，与 cold build 相对，常用于构建性能描述","/wˈɔɹm tɹˈɪɡɚ bˈɪld/"],["peak RSS","峰值常驻内存集","RSS 即 Resident Set Size，描述进程实际占用的物理内存峰值","/piːk ɑr ɛs ˈɛs/"],["kill-switch","紧急关闭开关","指可立即禁用某项功能的开关，常用于说明功能默认开启且无关闭途径","/ˈkɪl ˌswɪtʃ/"]],"sentsHl":[["[[Delay outgoing collectible deltas]] while a task is dirty, including through dirty children, and net opposite deltas before propagating them.","当任务处于脏状态时，延迟向外发送可收集项的增量，包括通过脏子任务传递的情况，并在传播之前将相反的增量进行净额抵消。"],["On the generated 5,000-route `bench/large-app-router` fixture, a [[warm trigger build]] drops from **221 to 49 seconds** of Turbopack compilation at 32 CPUs, and main-process peak RSS drops from **19.7 to 13.0 GiB**.","在生成的包含 5,000 条路由的 `bench/large-app-router` 测试夹具上，32 核 CPU 下的 Turbopack 编译热触发构建从 **221 秒降至 49 秒**，主进程峰值 RSS 从 **19.7 GiB 降至 13.0 GiB**。"],["During recomputation, an operation taking/dropping collectibles can repeatedly add and remove the same effects in its aggregated data.","在重新计算期间，一个获取/丢弃可收集项的操作可能会在其聚合数据中反复添加和移除相同的效果。"],["Sending every intermediate delta through thousands of uppers amplifies the work, even though many deltas ultimately cancel.","将每个中间增量发送给数千个上层任务会放大工作量，尽管许多增量最终会相互抵消。"],["Stage outgoing collectible changes while the task is effectively dirty (self-dirty **or** has dirty containers), also when it has no uppers yet; positive and negative counts cancel in the map.","在任务实际处于脏状态时（自身脏 **或** 拥有脏容器），暂存向外发送的可收集项变更，即使它还没有上层任务也这样做；正负计数在地图中相互抵消。"],["When the task becomes clean, the update's own collectible changes are netted into the map and the whole map is drained into that clean-state update, so it stays one entry per collectible.","当任务变为干净状态时，该更新自身的可收集项变更会被净额计入地图，整个地图被排空到该干净状态更新中，因此每个可收集项保持一个条目。"]]},"https://github.com/vercel/next.js/pull/102016":{"titleZh":"Turbopack：将服务器 HMR 拉取与 Rust 持有的已加载模块集进行差异对比","sents":[["With Turbopack in `next dev`, a route that is added after editing an already-loaded server module now sees that module's current code.","在 `next dev` 中使用 Turbopack 时，在编辑一个已加载的服务器模块之后新增的路由，现在能看到该模块的当前代码。"],["Server HMR pulls are lazy and per route: each route kept its own opaque version baseline, and a route's first pull had no baseline, so it applied nothing.","服务器 HMR 拉取是惰性的，并且按路由进行：每个路由都保留着自己不透明的版本基线，而路由的首次拉取没有基线，因此它没有应用任何内容。"],["All routes share one module cache in the server runtime, and loading a chunk never replaces a factory the runtime already has.","所有路由在服务器运行时中共享同一个模块缓存，而加载一个 chunk 从不会替换运行时已经拥有的工厂。"],["An alternative fix that catches up earlier routes in JS is in #101721.","一个在 JS 中追赶更早路由的替代修复方案在 #101721 中。"],["This PR instead moves the knowledge of what is loaded into Turbopack, so JS doesn't track HMR versions at all.","而本 PR 将已加载内容的知识移入 Turbopack，因此 JS 完全不再跟踪 HMR 版本。"]],"phrases":[["loaded module","已加载模块","指运行时已经持有其代码的模块，常用于 HMR/模块缓存语境。","/lˈoʊdɪd mˈɑdʒul/"],["version baseline","版本基线","表示用于比较增量变化的基准版本；'baseline' 强调参照点。","/vˈɝʒən bˈeɪslˌaɪn/"],["module cache","模块缓存","运行时或构建工具中保存已解析模块的缓存，避免重复加载。","/mˈɑdʒul kˈæʃ/"],["at module granularity","以模块为粒度","技术写作中 'at … granularity' 表示比较/处理的细化程度。","/æt ˈmɑdʒul ˌɡrænjəˈlærəti/"],["content hash","内容哈希","根据文件内容计算出的哈希值，用于判断内容是否变化。","/kˈɑntɛnt hˈæʃ/"]],"sentsHl":[["With Turbopack in `next dev`, a route that is added after editing an already-loaded server module now sees that module's current code.","在 `next dev` 中使用 Turbopack 时，在编辑一个已加载的服务器模块之后新增的路由，现在能看到该模块的当前代码。"],["Server HMR pulls are lazy and per route: each route kept its own opaque [[version baseline]], and a route's first pull had no baseline, so it applied nothing.","服务器 HMR 拉取是惰性的，并且按路由进行：每个路由都保留着自己不透明的版本基线，而路由的首次拉取没有基线，因此它没有应用任何内容。"],["All routes share one [[module cache]] in the server runtime, and loading a chunk never replaces a factory the runtime already has.","所有路由在服务器运行时中共享同一个模块缓存，而加载一个 chunk 从不会替换运行时已经拥有的工厂。"],["An alternative fix that catches up earlier routes in JS is in #101721.","一个在 JS 中追赶更早路由的替代修复方案在 #101721 中。"],["This PR instead moves the knowledge of what is loaded into Turbopack, so JS doesn't track HMR versions at all.","而本 PR 将已加载内容的知识移入 Turbopack，因此 JS 完全不再跟踪 HMR 版本。"]]},"https://github.com/rust-lang/rust/pull/165971":{"titleZh":"修复：链接器映射中非确定性的临时对象路径","sents":[["rustc creates temporary `rmeta.o` and `symbols.o` files in randomly named directories,","rustc 会在随机命名的目录中创建临时的 `rmeta.o` 和 `symbols.o` 文件，"]],"phrases":[["non-deterministic temporary object paths","非确定性的临时对象路径","描述构建产物路径不稳定导致可复现性问题的典型说法。","/ˌnɑndɪˌtɜrməˈnɪstɪk ˈtɛmpəˌrɛri ˈɑbdʒɛkt pæðz/"],["linker maps","链接器映射（文件）","指链接器生成的 map 文件，常用复数形式。","/lˈɪŋkɚ mˈæps/"],["randomly named directories","随机命名的目录","形容路径含随机成分、每次构建都不同。","/ɹˈændəmli nˈeɪmd daɪɹˈɛktɚiz/"],["automatically assigned to a reviewer","自动分配给审阅者","GitHub/自动化流程中描述指派审阅人的常见短语。","/ˌɔtəmˈætɪkli əsˈaɪnd tˈu ə ɹivjˈuɚ/"],["commit message of a merge commit","合并提交的提交信息","讨论 git 历史与 PR 描述关系时的固定搭配。","/kəmˈɪt mˈɛsədʒ ˈʌv ə mˈɝdʒ kəmˈɪt/"]],"sentsHl":[["rustc creates temporary `rmeta.o` and `symbols.o` files in [[randomly named directories]],","rustc 会在随机命名的目录中创建临时的 `rmeta.o` 和 `symbols.o` 文件，"]]},"https://github.com/vercel/next.js/pull/102093":{"titleZh":"Turbopack：针对动态 process.env 访问的有限逃逸分析","sents":[["Adds a limited escape analysis for dynamic `process.env` access to `turbopack-ecmascript`.","为 `turbopack-ecmascript` 添加针对动态 `process.env` 访问的有限逃逸分析。"],["When a module uses `process.env` in a way that can't be analyzed statically (so it could read any env var), `EnvVarInfo.runtime_all` is set to `true`.","当模块以无法静态分析的方式使用 `process.env`（因此可能读取任何环境变量）时，`EnvVarInfo.runtime_all` 会被设为 `true`。"],["Optional method calls on `process.env` (`process.env.hasOwnProperty?.(key)`), conservatively, because the analyzer has no call effect for optional calls","对 `process.env` 的可选方法调用（`process.env.hasOwnProperty?.(key)`），采取保守处理，因为分析器对可选调用没有调用效果信息"],["`process.env` escaping as a whole value: `foo(process.env)`, `const env = process.env`, `export const e = process.env`, `{ ...rest } = process.env`, default parameters, and a destructuring assignment whose result is consumed","`process.env` 作为整体值逃逸：`foo(process.env)`、`const env = process.env`、`export const e = process.env`、`{ ...rest } = process.env`、默认参数，以及结果被使用的解构赋值"],["`process` itself escaping (`foo(process)`), and `foo(process[key])` with a completely unknown key, to avoid broad deopts","`process` 本身逃逸（`foo(process)`），以及使用完全未知键的 `foo(process[key])`，以避免大范围的去优化"]],"phrases":[["escape analysis","逃逸分析","指分析一个值是否“逃出”当前作用域被外部使用，是编译器优化的常见术语。","/ɪskˈeɪp ənˈæləsəs/"],["static analysis","静态分析","在运行前分析代码，常与 can't be analyzed statically 搭配表示“无法静态分析”。","/stˈætɪk ənˈæləsəs/"],["set to `true`","被设为 `true`","描述标志位赋值，英文常用被动 set to + 值，注意 to 不可省。","/sˈɛt tˈu tɹˈu/"],["optional method call","可选方法调用","指 `obj.method?.()` 形式，问号加点的可选链写法。","/ˈɑpʃənəl mˈɛθəd kˈɔl/"],["avoid broad deopts","避免大范围去优化","deopt 是 deoptimization 的缩写；broad deopts 指影响面广的性能退化。","/əˈvɔɪd bɹɔd diˈɑpts/"]],"sentsHl":[["Adds a limited [[escape analysis]] for dynamic `process.env` access to `turbopack-ecmascript`.","为 `turbopack-ecmascript` 添加针对动态 `process.env` 访问的有限逃逸分析。"],["When a module uses `process.env` in a way that can't be analyzed statically (so it could read any env var), `EnvVarInfo.runtime_all` is [[set to `true`]].","当模块以无法静态分析的方式使用 `process.env`（因此可能读取任何环境变量）时，`EnvVarInfo.runtime_all` 会被设为 `true`。"],["[[Optional method call]]s on `process.env` (`process.env.hasOwnProperty?.(key)`), conservatively, because the analyzer has no call effect for optional calls","对 `process.env` 的可选方法调用（`process.env.hasOwnProperty?.(key)`），采取保守处理，因为分析器对可选调用没有调用效果信息"],["`process.env` escaping as a whole value: `foo(process.env)`, `const env = process.env`, `export const e = process.env`, `{ ...rest } = process.env`, default parameters, and a destructuring assignment whose result is consumed","`process.env` 作为整体值逃逸：`foo(process.env)`、`const env = process.env`、`export const e = process.env`、`{ ...rest } = process.env`、默认参数，以及结果被使用的解构赋值"],["`process` itself escaping (`foo(process)`), and `foo(process[key])` with a completely unknown key, to [[avoid broad deopts]]","`process` 本身逃逸（`foo(process)`），以及使用完全未知键的 `foo(process[key])`，以避免大范围的去优化"]]},"https://github.com/vercel/next.js/pull/102284":{"titleZh":"Turbopack：将 process.env.hasOwnProperty(key) 视为环境变量存在性检查","sents":[["Turbopack's env var tracking (`EnvVarInfo.runtime`) now treats these as existence checks of `FOO`, like `'FOO' in process.env`:","Turbopack 的环境变量跟踪（`EnvVarInfo.runtime`）现在将这些视为对 `FOO` 的存在性检查，就像 `'FOO' in process.env` 一样："],["Since this works on linked values rather than syntax, it also covers `import { env } from 'node:process'`, aliases (`const e = process.env`), computed method names (`process.env['hasOwnProperty']`) and keys that resolve to a constant (`const key = 'FOO'`).","由于这基于链接后的值而非语法，因此它还覆盖 `import { env } from 'node:process'`、别名（`const e = process.env`）、计算属性名（`process.env['hasOwnProperty']`）以及解析为常量的键（`const key = 'FOO'`）。"],["Before this, these calls weren't understood: `FOO` wasn't listed at all.","在此之前，这些调用不会被理解：`FOO` 根本不会被列出。"],["Only `hasOwnProperty` itself was recorded as a runtime env var read (from the `process.env.hasOwnProperty` member expression).","只有 `hasOwnProperty` 本身被记录为运行时环境变量读取（来自 `process.env.hasOwnProperty` 成员表达式）。"],["Code checks for an env var with `process.env.hasOwnProperty(name)` and its equivalents, so its result depends on whether `FOO` is set.","代码使用 `process.env.hasOwnProperty(name)` 及其等价形式检查环境变量，因此其结果取决于 `FOO` 是否被设置。"],["Consumers of `EnvVarInfo.runtime` should see that dependency, consistently for all of these forms.","`EnvVarInfo.runtime` 的使用者应当能看到该依赖关系，并且对所有这类形式保持一致。"]],"phrases":[["env var tracking","环境变量跟踪","指构建工具记录代码对哪些环境变量产生了依赖的机制。","/ˈɛnvɛɹ ˈvɑɹ ˈtɹækɪŋ/"],["existence check","存在性检查","常用于判断某个键或变量是否已定义，如 `'FOO' in obj`。","/ɛɡzˈɪstəns tʃˈɛk/"],["member expression","成员表达式","JavaScript 语法术语，指 `obj.prop` 或 `obj['prop']` 这类访问形式。","/mˈɛmbɚ ɪkspɹˈɛʃən/"],["destructured method","解构出的方法","指通过解构赋值取出的函数，如 `const { hasOwn } = Object`。","/diˈstɹʌktʃɚd ˈmɛθəd/"],["computed method names","计算属性名","指用方括号和表达式动态指定属性名，如 `obj['hasOwnProperty']`。","/kəmpjˈutəd mˈɛθəd nˈeɪmz/"]],"sentsHl":[["Turbopack's [[env var tracking]] (`EnvVarInfo.runtime`) now treats these as existence checks of `FOO`, like `'FOO' in process.env`:","Turbopack 的环境变量跟踪（`EnvVarInfo.runtime`）现在将这些视为对 `FOO` 的存在性检查，就像 `'FOO' in process.env` 一样："],["Since this works on linked values rather than syntax, it also covers `import { env } from 'node:process'`, aliases (`const e = process.env`), [[computed method names]] (`process.env['hasOwnProperty']`) and keys that resolve to a constant (`const key = 'FOO'`).","由于这基于链接后的值而非语法，因此它还覆盖 `import { env } from 'node:process'`、别名（`const e = process.env`）、计算属性名（`process.env['hasOwnProperty']`）以及解析为常量的键（`const key = 'FOO'`）。"],["Before this, these calls weren't understood: `FOO` wasn't listed at all.","在此之前，这些调用不会被理解：`FOO` 根本不会被列出。"],["Only `hasOwnProperty` itself was recorded as a runtime env var read (from the `process.env.hasOwnProperty` [[member expression]]).","只有 `hasOwnProperty` 本身被记录为运行时环境变量读取（来自 `process.env.hasOwnProperty` 成员表达式）。"],["Code checks for an env var with `process.env.hasOwnProperty(name)` and its equivalents, so its result depends on whether `FOO` is set.","代码使用 `process.env.hasOwnProperty(name)` 及其等价形式检查环境变量，因此其结果取决于 `FOO` 是否被设置。"],["Consumers of `EnvVarInfo.runtime` should see that dependency, consistently for all of these forms.","`EnvVarInfo.runtime` 的使用者应当能看到该依赖关系，并且对所有这类形式保持一致。"]]},"https://github.com/microsoft/vscode/pull/350048":{"titleZh":"在 PR 检查中核查新增依赖的发布时长与来源","sents":[["Adds a **Dependency Release Age** job to the PR workflow, which PR Gate reports.","在 PR 工作流中新增一个 **Dependency Release Age** 作业，由 PR Gate 报告。"],["It checks the package versions that a change adds to `pnpm-lock.yaml`, `package-lock.json` and `Cargo.lock` against the dependency policy, using only public registry data, so it works the same for pull requests from forks and in the merge queue.","它依据依赖策略检查变更添加到 `pnpm-lock.yaml`、`package-lock.json` 和 `Cargo.lock` 中的包版本，并且只使用公共注册表数据，因此对来自 fork 的拉取请求和合并队列中的情况行为一致。"],["**Source:** it must resolve from `registry.npmjs.org` or crates.io.","**来源：** 它必须解析自 `registry.npmjs.org` 或 crates.io。"],["**Release age:** it must have been published at least `minimumReleaseAge` minutes ago, as set by the nearest `pnpm-workspace.yaml` (the root one for `Cargo.lock`).","**发布时长：** 它必须至少在 `minimumReleaseAge` 分钟之前发布，该值由最近的 `pnpm-workspace.yaml` 设定（对于 `Cargo.lock` 则使用根目录的那个）。"],["Versions that its `minimumReleaseAgeExclude` lists are exempt, matched the way pnpm matches them.","其 `minimumReleaseAgeExclude` 中列出的版本可获豁免，匹配方式与 pnpm 的匹配方式相同。"],["**Output:** each failure is an annotation on the lockfile that names the package, the version, when it was published and when it becomes allowed.","**输出：** 每个失败项都是锁文件上的一条注解，注明包名、版本、发布时间以及何时变为允许。"]],"phrases":[["pull request from fork","来自 fork 的拉取请求","fork PR 默认无法读取私有密钥，因此检查逻辑要只用公开数据。","/pˈʊl ɹɪkwˈɛst fɹˈʌm fˈɔɹk/"],["merge queue","合并队列","GitHub 的合并队列会批量测试 PR，写法常为 in the merge queue。","/mˈɝdʒ kjˈu/"],["base branch","基础分支","对比变更时指目标分支，常用 compared with the base branch。","/bˈeɪs bɹˈæntʃ/"],["lockfile","锁文件","指 pnpm-lock.yaml、package-lock.json、Cargo.lock 等记录精确版本的清单。","/ˈlɑkfaɪl/"],["merge conflict markers","合并冲突标记","指 <<<<<<<、=======、>>>>>>> 等残留符号，常导致文件无法解析。","/mˈɝdʒ kˈɑnflɪkt mˈɑɹkɚz/"]],"sentsHl":[["Adds a **Dependency Release Age** job to the PR workflow, which PR Gate reports.","在 PR 工作流中新增一个 **Dependency Release Age** 作业，由 PR Gate 报告。"],["It checks the package versions that a change adds to `pnpm-lock.yaml`, `package-lock.json` and `Cargo.lock` against the dependency policy, using only public registry data, so it works the same for pull requests from forks and in the [[merge queue]].","它依据依赖策略检查变更添加到 `pnpm-lock.yaml`、`package-lock.json` 和 `Cargo.lock` 中的包版本，并且只使用公共注册表数据，因此对来自 fork 的拉取请求和合并队列中的情况行为一致。"],["**Source:** it must resolve from `registry.npmjs.org` or crates.io.","**来源：** 它必须解析自 `registry.npmjs.org` 或 crates.io。"],["**Release age:** it must have been published at least `minimumReleaseAge` minutes ago, as set by the nearest `pnpm-workspace.yaml` (the root one for `Cargo.lock`).","**发布时长：** 它必须至少在 `minimumReleaseAge` 分钟之前发布，该值由最近的 `pnpm-workspace.yaml` 设定（对于 `Cargo.lock` 则使用根目录的那个）。"],["Versions that its `minimumReleaseAgeExclude` lists are exempt, matched the way pnpm matches them.","其 `minimumReleaseAgeExclude` 中列出的版本可获豁免，匹配方式与 pnpm 的匹配方式相同。"],["**Output:** each failure is an annotation on the [[lockfile]] that names the package, the version, when it was published and when it becomes allowed.","**输出：** 每个失败项都是锁文件上的一条注解，注明包名、版本、发布时间以及何时变为允许。"]]},"https://github.com/nodejs/node/pull/67456":{"titleZh":"lib：在 ZIP 中央目录解析器中使用索引追加","sents":[["`readCentralDirectory()` appends one entry per archive file with `ArrayPrototypePush`, which `doc/contributing/primordials.md` lists among primordials with known performance issues.","`readCentralDirectory()` 使用 `ArrayPrototypePush` 为每个归档文件追加一个条目，而 `doc/contributing/primordials.md` 将其列为存在已知性能问题的原始方法之一。"],["This uses an indexed assignment instead.","这里改用索引赋值。"],["Behavior and errors are unchanged.","行为和错误均保持不变。"],["The scope is narrowed to this one loop, which runs once per archive entry.","改动范围缩小到这一个循环，该循环对每个归档条目运行一次。"],["Local comparison of the header parsing loop (10 rounds, 3 runs each, Node v28.0.0-pre, V8 15.8.62.44-node.4, macOS arm64):","头部解析循环的本地对 案。"],["[[r?]] jieyouxu","请求 jieyouxu 审查。"]]}},"hn":{"Local Wikipedia: Wikipedia, but only for things a half hour walk from you":{"zh":"本地维基：只收录步行半小时内的地点","note":"only for things 后接范围定语，是英语里压缩信息的高频结构"},"Anthropic S-1":{"zh":"Anthropic 提交 S-1（上市招股书）","note":"S-1 是美国 IPO 招股说明书，属专业术语"},"Quad9 to exit France":{"zh":"Quad9 宣布退出法国市场","note":"to exit 用于新闻标题，省略 will"},"Ghostty 1.4":{"zh":"终端模拟器 Ghostty 发布 1.4","note":"版本号直接作标题"},"eMudhra to exit global SSL/TLS certificate business":{"zh":"eMudhra 将退出全球 SSL/TLS 证书业务","note":"business 前叠加多个名词作定语"},"Three new discoveries in mathematics, computer science, and physics":{"zh":"数学、计算机科学与物理学的三项新发现","note":"列举学科的标准句式"},"Today, we hacked what we'd set out to hack: the iPhone":{"zh":"今天我们攻破了原本要攻破的目标：iPhone","note":"what 引导名词性从句，回指目标"},"Evidence of a spying operation by ICE against left-wing social movements":{"zh":"有证据显示 ICE 对左翼社会运动实施监视行动","note":"by/against 双介词叠加的信息密度"},"sshole":{"zh":"sshole（原文如此）","note":"sshole 不是标准英文单词，疑为截断或拼写错误；单独成题时通常只能保留原形并加注说明。"},"Astra can read and write weights to improve Qwen":{"zh":"Astra 能读写权重以改进 Qwen","note":"read and write 为并列动词结构；weights 在 AI 语境中指模型权重/参数。"},"WTF Ubuntu?":{"zh":"Ubuntu 搞什么鬼？","note":"WTF 是非正式缩略语；标题采用省略式疑问片段，表达惊讶或不满。"},"Claude Code sends your email address to websites":{"zh":"Claude Code 会把你的邮箱地址发送给网站","note":"send sth to sb/sth 表示把某物发送给某人/某处。"},"Postman silently auto-installs AI plugins and attempts to share all API data":{"zh":"Postman 静默自动安装 AI 插件，并试图共享所有 API 数据","note":"attempt to do sth 表示试图做某事；silently 作副词修饰 auto-installs。"},"AI is forcing us to pay off 40 years of technical debt":{"zh":"AI 正迫使我们偿还 40 年的技术债","note":"force sb to do sth 表示迫使某人做某事；pay off debt 意为还清债务。"},"Residential proxies detected on White House network":{"zh":"白宫网络中发现住宅代理","note":"detected 为过去分词，标题中省略了 be 动词，构成紧缩被动结构。"},"Tesla to wind down Cybertruck production":{"zh":"特斯拉将逐步停止 Cybertruck 生产","note":"be to do 可表计划或安排；wind down 是短语动词，意为逐步缩减直至停止。"},"Need for Speed Underground 2 online in the browser":{"zh":"《极品飞车：地下狂 enticated remote code execution in Nginx":{"zh":"Nginx 中的未认证远程代码执行漏洞","note":"unauthenticated 是形容词“未认证的”，remote code execution 是复合名词短语，常用来指“远程代码执行漏洞”。"},"Hurried Announcement: Alessandro Masullo GRH":{"zh":"仓促宣布：Alessandro Masullo 的 GRH","note":"Hurried 是过去分词作形容词，表示“仓促的”；GRH 是 Generalized Riemann Hypothesis 的缩写。"},"Inkling 2 Mini":{"zh":"Inkling 2 Mini","note":"这是一条没有谓语的标题，只以“产品名+版本号”出现：数字 2 读作“two”，Mini 作型号后缀；英文新闻标题常省略动词（如“is launched”），直接靠名词短语传达信息。"},"Pill to treat pancreatic cancer hailed as 'biggest breakthrough in decades'":{"zh":"治疗胰腺癌的口服药被誉为“数十年来最大突破”","note":"“hailed as...” 是过去分词，用于被动结构，表示“被誉为……”（hail A as B = 称赞 A 为 B）；“Pill to treat...” 用不定式作后置定语，说明药片的用途；“in decades” 中 decades 用复数，表示“数十年来”。"},"Nvidia Reinstates Jensen Huang as CEO":{"zh":"英伟达重新任命黄仁勋为首席执行官","note":"reinstate 意为“使复职、恢复职位”，常用结构为 reinstate somebody as + 职位。"},"Jensen Huang Reinstated as Nvidia CEO":{"zh":"黄仁勋复任英伟达首席执行官","note":"新闻标题常省略 be 动词，直接用过去分词 reinstated 表示被动，即“(is) reinstated”。"},"Toyota, Nissan, and Honda to standardize parts to lower costs":{"zh":"丰田、日产和本田将统一零部件以降低成本","note":"标题中“to + 动词原形”常用来表示将来计划，相当于 are to 或 will；句末的 to lower costs 是不定式表目的。"},"Ladybird is now in alpha":{"zh":"Ladybird 现已进入 alpha 阶段","note":"“be in alpha”表示处于软件早期测试阶段；结构为 be in + 阶段名词。"},"\"Dario is hyping the dangers so OSS models are illegal and he stays in control\"":{"zh":"“Dario 在炒作危险，让开源模型变得非法，从而保持控制权”","note":"hype 作动词表示“大肆宣传、炒作”；so 引导结果或目的，后可接从句。"}}};

function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function hl(t){ return esc(t).replace(/\[\[(.+?)\]\]/g,"<mark>$1</mark>"); }

function ghCard(item){
  const a = AN.gh[item.url] || {};
  const sents = a.sentsHl || a.sents || [];
  let h = '<article class="card">';
  h += '<div class="meta"><span class="chip repo">' + esc(item.full) + '</span>' +
       '<span class="chip">' + item.comments + ' 条评论</span>' +
       '<a class="link" href="' + esc(item.url) + '" target="_blank" rel="noopener">GitHub ↗</a></div>';
  if (a.titleZh) h += '<h2 class="zh">' + esc(a.titleZh) + '</h2>';
  h += '<p class="en">' + hl(item.title) + '</p>';
  if (sents.length) {
    h += '<ol class="sents">' + sents.map(function(p){
      return '<li><div class="en-line">' + hl(p[0]) + '</div><div class="zh-line">' + esc(p[1]) + '</div></li>';
    }).join("") + '</ol>';
  } else {
    h += '<div class="note">本条尚未生成中英对照（下次运行 refresh 时自动补齐）</div>';
  }
  if (a.phrases && a.phrases.length) {
    h += '<div class="phrases"><h3>重点搭配 · Key Collocations</h3><table class="ptable"><tbody>' +
      a.phrases.map(function(p){
        var ipaTxt = (p && p[3]) ? '<span class="ipa">' + esc(p[3]) + '</span>' : '';
        return '<tr><td class="k"><button class="say" data-say="' + esc(p[0]) + '" title="朗读">🔊</button>' +
               esc(p[0]) + ipaTxt + '</td><td>' + esc(p[1]) +
               (p[2] ? '<div class="n">' + esc(p[2]) + '</div>' : '') + '</td></tr>';
      }).join("") + '</tbody></table></div>';
  }
  if (item.body) {
    h += '<details class="raw"><summary>英文原文</summary><pre>' + esc(item.body) + '</pre></details>';
  }
  h += '</article>';
  return h;
}

function hnCard(item){
  const a = AN.hn[item.title] || {};
  let h = '<article class="card">';
  h += '<div class="meta">' +
       (item.points >= 800 ? '<span class="chip hot">' + item.points + ' 分</span>' : '<span class="chip">' + item.points + ' 分</span>') +
       '<span class="chip">' + item.comments + ' 条评论</span>' +
       '<a class="link" href="' + esc(item.hn) + '" target="_blank" rel="noopener">HN 讨论 ↗</a></div>';
  if (a.zh) h += '<h2 class="zh">' + esc(a.zh) + '</h2>';
  h += '<p class="en">' + hl(item.title) + '</p>';
  if (a.note) h += '<div class="note">' + esc(a.note) + '</div>';
  if (!a.zh) h += '<div class="note">本条尚未生成中文标题</div>';
  h += '</article>';
  return h;
}

function renderGh(){
  document.getElementById("tabGh").className = "on";
  document.getElementById("tabHn").className = "";
  document.getElementById("view").innerHTML = GH.length ? GH.map(ghCard).join("") : '<p class="empty">暂无数据</p>';
}
function renderHn(){
  document.getElementById("tabGh").className = "";
  document.getElementById("tabHn").className = "on";
  document.getElementById("view").innerHTML = HN.hn.length ? HN.hn.map(hnCard).join("") : '<p class="empty">暂无数据</p>';
}
function speak(text){
  try {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.9;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
document.addEventListener("click", function(ev){
  var btn = ev.target.closest("[data-say]");
  if (!btn) return;
  ev.preventDefault();
  speak(btn.getAttribute("data-say"));
});
document.getElementById("tabGh").addEventListener("click", renderGh);
document.getElementById("tabHn").addEventListener("click", renderHn);
(location.hash === "#hn") ? renderHn() : renderGh();
</script>
