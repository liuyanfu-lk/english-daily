<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>真实语料 · Real English</title>
<style>
:root{
  --bg:#f6f7f9; --bg-2:#eef1f4; --card:#ffffff; --ink:#14181c; --ink-2:#3d4650;
  --muted:#6b7684; --line:#e4e8ed; --line-2:#f0f3f6;
  --brand:#0b7a5a; --brand-2:#0fa472; --brand-soft:#e7f6ef;
  --mark:#fff3c4; --mark-ink:#6b4d00;
  --code:#f4f6f8; --shadow:0 1px 2px rgba(16,24,32,.04),0 8px 24px -12px rgba(16,24,32,.14);
  --shadow-hover:0 2px 6px rgba(16,24,32,.06),0 18px 40px -18px rgba(16,24,32,.22);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1216; --bg-2:#131a20; --card:#161d24; --ink:#e8eef4; --ink-2:#c3ced8;
    --muted:#8b98a5; --line:#25303a; --line-2:#1d262e;
    --brand:#3ddc9f; --brand-2:#2ec98f; --brand-soft:#143027;
    --mark:#5a4a10; --mark-ink:#ffe89a; --code:#1b242c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
    --shadow-hover:0 2px 8px rgba(0,0,0,.35),0 20px 48px -20px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.68;-webkit-font-smoothing:antialiased;font-size:15px}
.wrap{max-width:920px;margin:0 auto;padding:0 20px 96px}

/* ---------- sticky header ---------- */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 72%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  padding:18px 0 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:19px;margin:0;letter-spacing:-.2px;font-weight:650}
.brand .latin{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.3px}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);display:inline-block;
  box-shadow:0 0 0 4px var(--brand-soft);margin-right:2px}
.sub{margin-top:5px;font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sep{width:1px;height:11px;background:var(--line);display:inline-block}
.bar{margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.segment{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.segment button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink-2);
  padding:6px 14px;border-radius:9px;cursor:pointer;transition:.18s;font-weight:500}
.segment button:hover{color:var(--ink)}
.segment button.on{background:var(--card);color:var(--brand);box-shadow:0 1px 3px rgba(16,24,32,.1);font-weight:600}
.ghost{margin-left:auto;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);
  color:var(--ink-2);padding:7px 13px;border-radius:10px;cursor:pointer;text-decoration:none;transition:.18s}
.ghost:hover{border-color:var(--brand);color:var(--brand)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px 20px;
  margin-top:16px;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));opacity:.85}
.card:hover{box-shadow:var(--shadow-hover)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.chip{background:var(--bg-2);border:1px solid var(--line);color:var(--ink-2);
  padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:500;letter-spacing:.2px}
.chip.repo{background:var(--brand-soft);border-color:transparent;color:var(--brand);font-weight:600}
.chip.hot{background:var(--mark);border-color:transparent;color:var(--mark-ink);font-weight:600}
.meta .link{margin-left:auto;color:var(--muted);text-decoration:none;font-size:12px;border-bottom:1px dashed var(--line)}
.meta .link:hover{color:var(--brand);border-color:var(--brand)}

h2.zh{margin:11px 0 3px;font-size:17.5px;line-height:1.45;font-weight:650;letter-spacing:-.15px}
p.en{margin:0;font-size:13.5px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  word-break:break-word}
p.en mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 2px;font-weight:600}

/* ---------- sentences ---------- */
ol.sents{list-style:none;margin:16px 0 0;padding:0;counter-reset:s}
ol.sents li{counter-increment:s;position:relative;padding:13px 0 13px 36px;border-top:1px solid var(--line-2)}
ol.sents li:first-child{border-top:0}
ol.sents li::before{content:counter(s);position:absolute;left:0;top:15px;width:22px;height:22px;
  border-radius:8px;background:var(--brand-soft);color:var(--brand);font-size:11.5px;display:grid;
  place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.en-line{font-size:15px;line-height:1.62;color:var(--ink)}
.en-line mark{background:var(--mark);color:var(--mark-ink);padding:1px 3px;border-radius:4px;font-weight:600}
.zh-line{margin-top:5px;color:var(--muted);font-size:13.5px;line-height:1.6}

/* ---------- phrases ---------- */
.phrases{margin-top:16px;border-top:1px solid var(--line-2);padding-top:14px}
.phrases h3{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.6px;text-transform:uppercase;margin:0 0 10px}
.ptable{width:100%;border-collapse:collapse;font-size:13.5px}
.ptable td{padding:7px 10px 7px 0;vertical-align:top;border-top:1px solid var(--line-2)}
.ptable tr:first-child td{border-top:0}
.ptable td.k{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.8px;
  color:var(--brand);font-weight:600;white-space:nowrap;padding-right:16px}
.ptable td.n{color:var(--muted);font-size:12.5px}

/* ---------- raw ---------- */
details.raw{margin-top:14px;border-top:1px solid var(--line-2);padding-top:10px}
details.raw summary{cursor:pointer;font-size:12.5px;color:var(--muted);list-style:none;user-select:none}
details.raw summary::-webkit-details-marker{display:none}
details.raw summary::before{content:"▸ ";color:var(--brand)}
details.raw[open] summary::before{content:"▾ "}
details.raw pre{margin:10px 0 0;background:var(--code);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
  max-height:260px;overflow:auto;color:var(--ink-2)}

/* ---------- notes ---------- */
.note{margin-top:10px;background:var(--brand-soft);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--brand)}
.empty{color:var(--muted);font-size:14px;padding:32px 0;text-align:center}
.foot{margin-top:36px;text-align:center;color:var(--muted);font-size:12px}
@media (max-width:620px){
  .wrap{padding:0 14px 72px}
  .card{padding:18px 16px 16px;border-radius:16px}
  h2.zh{font-size:16px}
  .ptable td.k{white-space:normal}
  .ghost{margin-left:0}
}
</style>
</head>

      <span class="dot"></span>

      <span>每条均含中英对照</span><span class="sep"></span><span>更新 <span id="upd">2026/11/10</span></span>

      <div class="segment">
        <button id="tabGh" class="on">GitHub PR</button>
        <button id="tabHn">Hacker News</button>

<script>
const GH = [{"repo":"next.js","full":"vercel/next.js","title":"turbo-tasks: add batched keyed reads via KeyedReadRef","comments":1,"url":"https://github.com/vercel/next.js/pull/100884","body":"## Summary\n\nAdds `vc.keyed_reader().await?`, which returns a `KeyedReadRef<T>` for `cell = \"keyed\"` values, and uses it for NFT generation (`crates/next-api/src/nft.rs`, `crates/next-api/src/nft_json.rs`).\n\n### Why\n\n`vc.get(key).await?` and `vc.contains_key(key).await?` register a fine-grained dependency per read. Every read is a separate future that takes backend locks to register its dependency. That gets expensive when one task reads many keys from the same map, as the NFT tasks do.\n\n### How\n\n- **API:** `keyed_reader()` returns a `ReadKeyedReaderVcFuture<T>` resolving to `Result<KeyedReadRef<T>>`. It reads the cell once. The `KeyedReadRef` only allows synchronous `get(key)` and `contains_key(key)` calls. It records the hashes of the accessed keys (the same hash `vc.get` uses), not the keys themselves.\n- **Dependency while alive:** calling `keyed_reader()` allocates a dedicated `CellKey::Keyed(id)` dependency for the current task execution before the future is created. `id` is unique within that execution. For invalidation it behaves like a full-cell dependency, but as a separate entry it can be removed without affecting normal full reads of the same cell or other `KeyedReadRef`s. A call outside a task execution is a normal full-dependency read.\n- **Dropped within the same execution:** one batched backend call replaces the `Keyed(id)` dependency with `CellKey::Hash(h)` dependencies for the accessed keys. Like `vc.get`, the reader is then only invalidated when one of those k"},{"repo":"next.js","full":"vercel/next.js","title":"Fix layout client chunk leakage across async server imports","comments":1,"url":"https://github.com/vercel/next.js/pull/101040","body":"## Summary\n\nWhen a layout reaches a shared client reference through a server-side `import()`, the reference can belong to different chunk groups than its owner. Falling back to every group containing that reference could then pull unrelated page code into the layout’s initial client chunks.\n\nSelect groups by direct owner membership or transitive async-import ancestry, with cycle detection. Only fall back when owner information is absent; error when a known owner cannot be matched.\n\nFixes #100893.\n\n## Verification\n\nAdded async/nested/cyclic regression coverage. Existing layout chunk-sharing and CSS-order tests pass in production and development with rebuilt native bindings.\n\n<!-- NEXT_JS_LLM -->\n\n<!-- fleet 0ee043f2-90a6-4f09-8d0f-973c1aae4e2c -->"},{"repo":"vscode","full":"microsoft/vscode","title":"Keep quick input open while its context menu has focus","comments":7,"url":"https://github.com/microsoft/vscode/pull/344806","body":"🤖 Closes #153267\n\n### Problem\nWith HTML (custom) context menus, right-clicking the Command Palette or any quick pick dismisses it as soon as the menu appears. Custom menus are always used on web, and on desktop by default with the custom title bar. The menu takes DOM focus into a context view outside `.quick-input-widget`, so the quick input's focus tracker sees a blur and hides. #155546 only changed the z-index. Native macOS menus never move DOM focus, so they were not affected.\n\nHosting the menu inside its owner (`domForShadowRoot`) keeps focus in the owner, but then the owner's `overflow: hidden` and transforms clip the menu. That is why earlier revisions of this PR needed animation and `will-change` workarounds, and why item-row menus could not be fixed at all.\n\n### Change: an opt-in popover mode in ContextView\nThe creator of a context view still passes its owner explicitly, as before. It can now also ask for the view to be hosted **as a popover** there (`IContextMenuDelegate.hostAsPopover` / `IContextViewDelegate.hostAsPopover`). The view's DOM is a `popover=\"manual\"` element (optionally with a shadow root) inside the owner, so:\n- focus stays inside the owner, and the owner's focus tracker never sees a blur;\n- the menu renders in the top layer, unclipped by the owner's overflow or transforms.\n\nAll popover behaviour lives in `ContextView` (`base/browser/ui/contextview/contextview.ts`):\n- `showPopover()` with fallback: if it throws (e.g. the owner is disconnected or popov"},{"repo":"vscode","full":"microsoft/vscode","title":"Agent Host: model routers for Copilot (experimental)","comments":1,"url":"https://github.com/microsoft/vscode/pull/346652","body":"This adds model routers to Copilot in Agent Host sessions. A model router is a `<name>.model-router.yaml` file that lists models and when to use each. It appears as a model in the picker, and each main-agent turn asks `gpt-6-luna-decisions` which route fits the request.\n\nSpec: microsoft/vscode-internalbacklog#10628 (see the YAML revision in the comments).\n\n## Setting\n\n`chat.copilot.modelRouter.enabled` (default `false`). The setting is experimental, tagged `preview`, `advanced` and `experimental`, and hidden from the Settings editor, so turn it on in `settings.json`:\n\n```json\n\"chat.copilot.modelRouter.enabled\": true\n```\n\nWith the setting off, nothing changes: no router rows, no skill, no check tool, and the runtime's `DECISIONS_API` flag stays off.\n\n## What's in it\n\n1. **File format.** The router format lives in `common/modelRouter.ts`:\n   - `version: 1`, a description, effort, switching, guidance, and 2–10 routes with fallback lists;\n   - a strictly checked YAML subset (`base/common/yaml.ts` is lenient, and it is not changed); files saved with a UTF-8 BOM are read;\n   - a 32 KiB file limit, and a 64 KiB limit on the decision text after JSON escaping;\n   - matching against the account's models: BYOK ids must match exactly one model, policy-disabled models count as unavailable, and the effective effort level is checked;\n   - `effort: off` leaves each model's default effort, and the checker warns that any route `effort` is ignored.\n2. **Telemetry.** Router names are written by "},{"repo":"rust","full":"rust-lang/rust","title":"Use the `2.38` binutils version in CI","comments":53,"url":"https://github.com/rust-lang/rust/pull/165078","body":"<!-- homu-ignore:start -->\n*[View all comments](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/165078)*\n<!-- homu-ignore:end -->\n\nBlocked on https://github.com/rust-lang/ci-mirrors/pull/61.\n\nr? @Kobzol "},{"repo":"rust","full":"rust-lang/rust","title":"Add `Forget` trait feature gate","comments":40,"url":"https://github.com/rust-lang/rust/pull/165376","body":"<!-- homu-ignore:start -->\n*[View all comments](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/165376)*\n<!-- homu-ignore:end -->\n\nr? jonathanbrouwer\n\nAdd an unstable feature gate for the `Forget` trait. Creating the feature gate allows experimentation with its implementation. Note that this does not commit to anything w.r.t. stabilization of the forget trait. A feature gate can be removed at any time.\n\nPart of https://github.com/rust-lang/rust/issues/165370"},{"repo":"node","full":"nodejs/node","title":"http: batch body spans per parser execute","comments":10,"url":"https://github.com/nodejs/node/pull/67187","body":"Buffer body spans in `on_body()` and deliver them to JS once per `execute()` call instead of once per chunk. A body sent as many small chunks no longer costs one C++ to JS call and `Buffer` per chunk.\n\nChunks that arrive in the same read now produce a single `'data'` event on `IncomingMessage`. Chunk boundaries were never documented, but code that treats each `'data'` event as a full message could break, so this needs a CITGM run.\n"},{"repo":"openai-python","full":"openai/openai-python","title":"feat(api): improve WebSocket recovery and delivery reporting","comments":6,"url":"https://github.com/openai/openai-python/pull/4213","body":"## Summary\n\nApply the configured recovery policy to eligible WebSocket closures and report queued frames that could not be sent.\n\n## Changes\n\n- Recover from close codes 1001 and 1005 when reconnection is enabled; normal close 1000 without pending work still ends iteration.\n- Preserve typed and raw frame order through recovery and after an initial write fails. Keep once and persistent listener registrations independent.\n- For callers waiting on an ordinary queued send, report a failure of their own frame even if another caller sent it. Report known terminal closure when a waiting caller's frame remains unattempted. Preserve the original error from an active transport write.\n- A final close prevents the old flusher from starting frames already reported unsent, while keeping those frames available for the reader's report.\n- If recovery takes over queued work, sends remain deferred and nonblocking. The reader reports the remaining frames if recovery later fails; a successful return during recovery does not confirm delivery.\n\n## Compatibility\n\nThis update is intended for a minor release. If your application treats close codes 1001 or 1005 as completion, disable recovery or abort the connection when that work is complete. Handle WebSocketConnectionClosedError and inspect unsent_frames (or unsent_messages for text) when queued work cannot be delivered. Messages retained after an initial write fails count toward the queue's byte limit. Handle WebSocketQueueFullError when a later mess"},{"repo":"node","full":"nodejs/node","title":"tls: coalesce buffered records into one read","comments":11,"url":"https://github.com/nodejs/node/pull/66698","body":"`SSL_read()` returns at most one TLS record per call, and `TLSWrap::ClearOut()` emits a separate read for each one. Records can be up to 16 KiB, but plenty of servers send smaller ones: nginx defaults `ssl_buffer_size` to 4 KiB, and servers that do dynamic record sizing start out at around 1 KiB. Every record then pays for its own buffer allocation and call into JS.\n\nWith this change `ClearOut()` keeps calling `SSL_read()` into the same 16 KiB buffer while the next record in `enc_in_` is application data. It never waits for more input, it only merges records that have already arrived, and reads never get bigger than one full record already makes them.\n\nSome notes:\n\n- Batching stops in front of any other record type, and in front of application data records that are short enough to be empty, since `SSL_read()` skips empty records and goes straight on to the next one. In TLS 1.2 that means handshake and alert records are still processed after the preceding data has been emitted, so a `'data'` handler can e.g. still call `disableRenegotiation()` before a renegotiation that arrived in the same read. `test-tls-coalesce-renegotiation` covers that, and fails if the record type check is re"},{"repo":"rust","full":"rust-lang/rust","title":"Fix transmutability type mismatch bug","comments":24,"url":"https://github.com/rust-lang/rust/pull/163946","body":"<!-- homu-ignore:start -->\n*[View all comments](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/163946)*\n<!-- homu-ignore:end -->\n\n\nFixes rust-lang/rust#161251\n\nr? @ShoyuVanilla \n\nThe change was done as instructed by @ShoyuVanilla and @lcnr on Zulip.\nThere are some leftover questions I'll add as comments (self review).\nBut the original examples are both fixed."},{"repo":"next.js","full":"vercel/next.js","title":"turbo-bitset: add Bitset, a fast bitset over a bounded bit range","comments":2,"url":"https://github.com/vercel/next.js/pull/100566","body":"Stacked on #100452. This PR only adds the crate; the PRs above use it: #100643 (`compute_chunk_group_info`) → #100567 (`collect_graph`) → #100568 (`compute_merged_modules`) → #100630 (persisted chunk group sets) → #100724 (removes the FixedBitSet/Roaring comparisons from the benchmarks).\n\n## Summary\n\nThe module graph fixed-point traversals track set membership with `RoaringBitmap`, which is built for compact storage, not speed. They check \"would `current |= parent` change `current`?\" on every edge and then do the union; on array containers both cost time proportional to the number of bits.\n\nThis PR adds a new `turbo-bitset` crate with `Bitset`: a `Vec<usize>` of blocks plus an offset counted in whole blocks.\n\n- Bit `i` is stored at `i - offset * usize::BITS`, so a set only stores the word range between its lowest and highest bit. Sets whose bits are clustered at high indices stay small.\n- Unions, intersections, differences, subset checks, `is_disjoint` and `intersection_len` are word loops over the overlapping range, so their cost is proportional to the range, not the number of bits. The subset check reduces chunks of 4 words before branching, so it vectorizes.\n- `union_with` returns whether it added a bit. It ORs the words and collects the added bits in the same loop, so a traversal checks for a change and applies the union in one pass instead of a subset check plus `|=`. If the set stores no blocks (a module's first visit), it copies `other` without its zero edge blocks, re"},{"repo":"next.js","full":"vercel/next.js","title":"turbo-persistence: parallelize large batch_get reads","comments":1,"url":"https://github.com/vercel/next.js/pull/100620","body":"### What?\n\nParallelize large `TurboPersistence::batch_get` calls in `turbo-persistence`.\n\n- Batches with **more than 2048 keys** (`PARALLEL_BATCH_GET_THRESHOLD`) are split into chunks and run on the database's existing `ParallelScheduler`. Smaller batches run serially, one chunk per shard.\n- `split_into_batch_chunks` aims for **4 chunks per task the scheduler can run at the same time** (like `turbo_tasks::util::good_chunk_size`). Every chunk stays inside _one shard_ of the family's current shard index, so small shards produce smaller chunks.\n- New `ParallelScheduler` methods:\n  - `parallelism()`: the number of tasks the scheduler can run at once. The turbo-tasks scheduler returns `turbo_tasks::parallel::available_parallelism()`, `SerialScheduler` returns 1.\n  - `try_parallel_for_each_task_mut`: runs exactly one task per (already chunked) item.\n- Less memory traffic in `batch_get`:\n  - The sort is over compact `(u64 hash, u32 index)` cells.\n  - Values are materialized as soon as an SST lookup finds them and written directly into the output `Vec`. There is no final loop to re-order the results.\n  - Parallel chunks write disjoint indices concurrently through a small `ConcurrentSlice`.\n  - Each chunk tracks the keys already found in newer SST files with a `turbo_bitset::Bitset` backed by a `SmallVec`, plus a counter. The bitset is preallocated for the chunk's positions (`Bitset::with_len`) and its `SmallVec` stores up to 256 positions inline, so typical chunks don't heap-allocate"},{"repo":"vscode","full":"microsoft/vscode","title":"sanity: keep the app logs of failed desktop UI tests","comments":3,"url":"https://github.com/microsoft/vscode/pull/343329","body":"This is a diagnostics-only change to the sanity tests. When a desktop UI test fails, it keeps the app's own logs so the failure's real cause can be identified.\n\n## Why\nTwice in 14 days, the macOS universal desktop sanity test failed with `Failed to install extension after 3 attempts; last failure: Install button became available again before installation completed`. The runs were [484098](https://dev.azure.com/monacotools/Monaco/_build/results?buildId=484098) (Oct 14) and [487409](https://dev.azure.com/monacotools/Monaco/_build/results?buildId=487409) (Oct 21, attempt 3), both on arm64 agents.\n\nThis isn't a race in the test:\n- All 3 install attempts in the same app instance failed 0.3–0.9 s after clicking Install.\n- The uploaded screenshots (`screenshots-macos_arm64-3/desktop-darwin-universal-2..4.png`) show the product's **\"Error while installing 'GitHub Pull Requests' extension. Please check the log for more details\"**. The extension editor also shows **\"The editor could not be opened due to an unexpected error\"**.\n- Mocha's retry, which starts a new app instance, passed immediately.\n\nThe product's reason for the failure is only in the app's logs. Those live in a temporary user data dir that the test deletes, so they never reach the artifacts.\n\n## Change\n- `TestContext.captureLogs(logsDir)` copies VS Code's own process logs (an allowlist: `main`, `sharedprocess`, `renderer`, `exthost`, `ptyhost`, `agenthost` and `network`) from a logs folder into the existing screenshots di"},{"repo":"vscode","full":"microsoft/vscode","title":"Canvases: Gate project canvas extensions on workspace trust","comments":3,"url":"https://github.com/microsoft/vscode/pull/342372","body":"<!-- Thank you for submitting a Pull Request. Please:\n* Read our Pull Request guidelines:\n  https://github.com/microsoft/vscode/wiki/How-to-Contribute#pull-requests\n* Associate an issue with the Pull Request.\n* Ensure that the code is up-to-date with the `main` branch.\n* Include a description of the proposed changes and how to test them.\n-->\n\nProject Copilot extensions can execute code to contribute canvases, but their launch path previously checked only that the extension was located under an active working directory. This allowed project extensions to launch while the workspace was untrusted.\n\nThis change gates project extension launches on the Agent Host workspace trust configuration. Project extension paths, admitted roots, and trusted roots are canonicalized to the same filesystem identity; trust, containment, and admission are revalidated after asynchronous resolution. Missing trust configuration and untrusted workspaces fail closed, while Workspace Trust disablement and explicit remote or cloud-sandbox connection-authority trust preserve expected launches. Structurally validated VS Code isolated worktrees inherit project-extension launch trust from a currently trusted base repository, with revocation rechecked at launch and a canonical directory/repository grant persisted across first send, eager peers, moves, rollback, and runtime resume/restart. User and plugin extension sources are unchanged.\n\nThe project-extension authorization logic is isolated in `CopilotProjectE"},{"repo":"rust","full":"rust-lang/rust","title":"Declare `SyntaxContext` through `rustc_index::newtype_index!`","comments":26,"url":"https://github.com/rust-lang/rust/pull/164425","body":"<!-- homu-ignore:start -->\n*[View all comments](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/164425)*\n<!-- homu-ignore:end -->\n\n`SyntaxContext` is basically an index type but it is not declared through `newtype_index`.\n\nr? @petrochenkov"},{"repo":"rust","full":"rust-lang/rust","title":"Avoid stdlib's `impl Hash for Path` for stable hashing","comments":25,"url":"https://github.com/rust-lang/rust/pull/164458","body":"<!-- homu-ignore:start -->\n*[View all comments](https://triagebot.infra.rust-lang.org/gh-comments/rust-lang/rust/pull/164458)*\n<!-- homu-ignore:end -->\n\n<!-- homu-ignore:start -->\n- Intended to unblock https://github.com/rust-lang/rust/pull/164384\n- Also deals with https://github.com/rust-lang/rust/issues/164348\n- [Zulip thread](https://rust-lang.zulipchat.com/#narrow/channel/131828-t-compiler/topic/Hashing.20details.20from.20stage0.20stdlib.20leaking.20into.20stage1/with/632509711)\n---\n<!-- homu-ignore:end -->\n\nA subtle consequence of the stage0 redesign is that the compiler must take care to avoid relying on any stdlib-provided Hash impl when computing stable hashes, or at least any such impl that is actually liable to change.\n\nThis was noticed when trying to strengthen the provided Hash impl for Path, which triggered baffling CI failures because the stable hashes produced by the stage1 compiler (built against stage0 stdlib) were inconsistent with the ones that would have been produced by the stage2 compiler (built against in-tree stdlib).\n\nThis PR aims to unblock changes to `impl Hash for Path`, by making the compiler not rely on it for stable hashing. It does not attempt to solve the broader problem of the compiler relying on stdlib hash details."},{"repo":"node","full":"nodejs/node","title":"src: fix build with `--shared-brotli`","comments":12,"url":"https://github.com/nodejs/node/pull/66895","body":"`BROTLI_DECODER_ERROR_FORMAT_BLOCK_SWITCH` isn't in any brotli release yet (1.2.0 is the latest), so building with `--shared-brotli` fails since 7ba22c2812. It's an enum value and the bundled brotli still reports 1.2.0, so there's nothing to `#ifdef` on. This only exposes the constant when brotli is bundled and skips the matching test otherwise.\n\nI built with `--shared-brotli` against Homebrew brotli 1.2.0 and ran `parallel/test-zlib*` (90 tests, all pass). The GN change is untested, I had no `gn` locally.\n\nFixes: https://github.com/nodejs/node/issues/66894"},{"repo":"node","full":"nodejs/node","title":"deps: patch V8 to 15.6.75.25","comments":19,"url":"https://github.com/nodejs/node/pull/66820","body":"This is an automated patch update of V8 to 15.6.75.25."},{"repo":"openai-python","full":"openai/openai-python","title":"feat(api): expand Live Decision item and question types","comments":7,"url":"https://github.com/openai/openai-python/pull/4175","body":"## Summary\n\nSupport more message, tool call, and question input types in Live Decisions.\n\n## Changes\n\n- Accept user, developer, system, and assistant messages in Live Decision items.\n- Add function and custom tool call and output types.\n- Allow strings or structured instruction parts in Live Decision questions.\n"},{"repo":"openai-python","full":"openai/openai-python","title":"fix(examples): handle interruptions and disconnects in push-to-talk","comments":6,"url":"https://github.com/openai/openai-python/pull/4192","body":"Pressing Enter tried to use a button the app never mounted, and transcripts containing Rich tags could crash the session. This change displays transcripts and API errors as literal text, reports failed or incomplete responses, and closes the audio device and SDK client on exit. Q exits with code 0; an unexpected normal or abnormal disconnect exits with code 1.\n\nWhen K interrupts playback, the sample cancels the active response and truncates unheard audio, including queued items after response.done. Capture starts before awaiting cancellation and truncation; microphone sends wait until those writes finish. If audio or its transcript arrives after interruption, the sample truncates each previously unknown item part to zero once. It retains the original cutoff for partly played audio. Manual mode skips commit and response.create if no audio was sent before release. Manual finalization also reserves the server input buffer before the next recording can append, so successive recordings remain separate while capture and interruption can still proceed.\n\nA response.created event that arrives after K, before any new audio is offered, belongs to the earlier turn. The sample reserves interruption work before it waits for the send lock. Microphone appends and manual commits recheck that work after obtaining the lock and yield outside it when necessary. They cannot overtake a cancellation or truncation that was queued while they waited. It suppresses late audio and transcripts and truncat"},{"repo":"node","full":"nodejs/node","title":"2026-10-28, Version 27.0.0-alpha.0.0.0 (Alpha)","comments":17,"url":"https://github.com/nodejs/node/pull/67062","body":"## 2026-10-28, Version 27.0.0-alpha.0.0.0 (Alpha), @RafaelGSS\n\n### Notable Changes\n\n#### V8 15.6\n\nThe V8 engine is updated to version 15.6.75.13, up from 14.6 in Node.js 26. Highlights:\n\n* New language features enabled by default: `Math.sumPrecise()`, `Intl.Locale.prototype.variants`, `Iterator.prototype.join()`, `Iterator.prototype.includes()`, `Iterator.zip()` and `Iterator.zipKeyed()`.\n* Experimental features behind flags: `import defer` (`--js-defer-import-eval`), Immutable `ArrayBuffer` (`--js-immutable-arraybuffer`) and RegExp buffer boundaries (`--js-regexp-buffer-boundaries`).\n* Memory: when `--max-old-space-size` is not set, the default heap size limit is now half of the physical memory clamped between 256 MB and 4 GB, and memory held by `Buffer` and `ArrayBuffer` instances now counts toward the heap limit. Applications that relied on the previous defaults should set `--max-old-space-size` explicitly.\n* Serialization: `v8.serialize()`, `structuredClone()` and `postMessage()` use a new format that older Node.js releases cannot read. `v8.cachedDataVersionTag()` and the compile cache also change on every Node.js patch of V8, not only on V8 version changes.\n* Observable behavior changes: `Math` methods now use LLVM's libm and may differ in the last bit; `Math.random()` sequences change for a given `--random-seed`; `error.stack` is no longer looked up through the prototype chain; `await` incurs fewer microtasks; `Array.prototype.sort()` uses PowerSort for large arrays and"},{"repo":"node","full":"nodejs/node","title":"test: skip readFileSync pipe test without proc io","comments":10,"url":"https://github.com/nodejs/node/pull/67242","body":"The readFileSync short reads regression test depends on /proc/<pid>/io, which is not present on some Linux systems. It now skips when /proc/self/io is unavailable.\n\nVerification: git diff --check passed. python tools/test.py --mode=release parallel/test-fs-readfilesync-pipe-short-reads could not run because this checkout has no built Release/node.exe.\n\n**Regression test:** untested: CONTRIBUTING does not mention tests\n\nFixes #67241"},{"repo":"openai-python","full":"openai/openai-python","title":"feat(api): add organization external key management","comments":3,"url":"https://github.com/openai/openai-python/pull/4205","body":"## Summary\n\nAdd organization external-key registration and validation for AWS, GCP and Azure.\n\n## Changes\n\n- Create, retrieve, list, delete and validate organization external-key registrations.\n- Filter external-key listings by purpose and paginate through results.\n"}];
