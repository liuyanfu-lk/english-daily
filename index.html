<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日工作英语 · Daily Work English</title>
<style>
:root{
  --bg:#f7f8f7; --card:#ffffff; --ink:#1c1f1d; --muted:#6b7280; --line:#e5e7eb;
  --brand:#0a7d55; --brand-soft:#e8f5ef; --mark:#fff3bf; --warn:#b45309;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:24px 18px 80px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);
  background:#fff;color:var(--ink);padding:7px 12px;font-size:13px;transition:.15s}
button:hover{border-color:var(--brand);color:var(--brand)}
button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
button.primary:hover{opacity:.9;color:#fff}
button.ghost{background:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 2px}
h2 .en{color:var(--muted);font-weight:500;font-size:14px;display:block;margin-top:2px}
.goal{margin:10px 0 0;color:var(--brand);background:var(--brand-soft);
  border-radius:10px;padding:8px 12px;font-size:13px}
ol.sents{list-style:none;margin:16px 0 0;padding:0;counter-reset:s}
ol.sents li{counter-increment:s;padding:12px 0 12px 34px;border-top:1px solid var(--line);position:relative}
ol.sents li:first-child{border-top:0}
ol.sents li::before{content:counter(s);position:absolute;left:0;top:14px;width:22px;height:22px;
  border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:12px;
  display:grid;place-items:center;font-weight:600}
.en-line{font-size:15.5px}
.zh-line{margin-top:6px;color:var(--muted);font-size:13.5px}
.challenge .zh-line{display:none}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:3px;font-weight:600}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12.5px;border-top:0}
td.k{font-weight:600;white-space:nowrap}
td.n{color:var(--muted);font-size:12.5px}
.drill{border-top:1px solid var(--line);padding:14px 0}
.drill:first-of-type{border-top:0}
.drill p{margin:0 0 4px;font-size:14px}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 8px}
textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;font:inherit;font-size:14px;resize:vertical;background:#fbfbfb}
textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.answer{margin-top:8px;background:var(--brand-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.answer[hidden]{display:none}
.answer .lbl{color:var(--brand);font-weight:600;font-size:12px;display:block;margin-bottom:2px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.dot{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#fff;
  font-size:12px;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.dot.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.dot.done{border-color:var(--brand);color:var(--brand)}
.dot.active.done{color:#fff}
.progress{font-size:12.5px;color:var(--muted)}
@media (max-width:600px){ .wrap{padding:16px 12px 60px} .card{padding:16px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>每日工作英语</h1>
      <div class="sub" id="dateLine"></div>
    </div>
    <div class="toolbar">
      <button id="btnChallenge" class="ghost">隐藏中文</button>
      <a class="ghost" href="real.html" style="text-decoration:none;display:inline-flex;align-items:center;padding:7px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink)">真实语料 →</a>
      <button id="btnPrev" class="ghost">上一课</button>
      <button id="btnToday" class="primary">今日</button>
      <button id="btnNext" class="ghost">下一课</button>
    </div>
  </header>

  <section class="card" id="lessonCard">
    <h2 id="lessonTitle"></h2>
    <p class="goal" id="lessonGoal"></p>
    <ol class="sents" id="sentList"></ol>
  </section>

  <section class="card">
    <h2>重点搭配<span class="en">Key Collocations</span></h2>
    <table><thead><tr><th>表达</th><th>释义</th><th>用法提示</th></tr></thead>
    <tbody id="phraseBody"></tbody></table>
  </section>

  <section class="card">
    <h2>练习<span class="en">Practice — 先自己写，再看参考</span></h2>
    <div id="drillList"></div>
  </section>

  <section class="card">
    <div class="foot">
      <div class="progress" id="progressText"></div>
      <button id="btnDone" class="primary">标记今天已练完</button>
    </div>
    <div class="dots" id="dots"></div>
  </section>
</div>

<script>
const LESSONS = [{"t":"Pull Request 描述","te":"Writing a Pull Request Description","goal":"让 reviewer 在 30 秒内看懂改了什么、为什么改、怎么验证。","s":[["This PR [[splits the payment retry logic]] out of the checkout service so the two concerns can fail and recover independently.","这个 PR 把支付重试逻辑从结算服务里拆出来，让两件事可以独立失败、独立恢复。"],["The retry budget was previously shared, which meant [[a spike in checkout traffic]] could starve payment retries.","之前重试额度是共用的，意味着结算流量一涨就可能把支付重试饿死。"],["Behavior is unchanged for callers: the public API and the response schema [[stay exactly the same]].","对调用方行为不变：公开 API 和响应结构完全保持一致。"],["I verified it by [[replaying last week's production traffic]] against both versions and comparing the outputs.","我用上周的生产流量做回放，对比两个版本的输出做了验证。"],["The main risk is a slightly higher cold-start latency, which I [[benchmarked at roughly 40 ms]].","主要风险是冷启动延迟略微升高，我测下来大约 40 毫秒。"]],"p":[["split X out of Y","把 X 从 Y 中拆出","重构类 PR 的开头句式"],["a spike in ...","……的激增","描述流量/错误波动"],["stay exactly the same","完全保持一致","强调无破坏性变更"],["verify by doing X","通过做 X 来验证","比 test it 更具体"],["benchmark at ...","测得为……","给数字时的高频动词"]],"d":[["翻译：这个 PR 把重试逻辑拆出来，方便单独测试。","用 split ... out of ...","This PR splits the retry logic out of checkout so it can be tested on its own."],["翻译：对调用方行为不变，API 完全保持一致。","用 stay exactly the same","Behavior is unchanged for callers; the API stays exactly the same."],["翻译：我用回放生产流量验证了改动。","用 verify by doing X","I verified the change by replaying production traffic."]]},{"t":"Code Review 提出异议","te":"Disagreeing in a Code Review","goal":"既要指出问题，又不让对方觉得被针对。","s":[["I might be missing context here, but [[I'm not sure this handles the empty-list case]].","我可能缺上下文，但我不确定这里处理了空列表的情况。"],["Could we [[pull this into a helper]] instead of duplicating it in three places?","我们能不能把它抽成一个 helper，而不是在三处重复？"],["The tradeoff I see is that a helper makes the call sites cleaner but [[adds one more indirection]].","我看到的一个权衡是：helper 让调用处更干净，但多了一层间接。"],["This is a nit, so [[feel free to ignore it]] if you'd rather ship today.","这是个小事，如果你今天想发版，完全可以忽略。"],["Either way works for me; [[I'd just like us to decide before merge]].","两种都行，我只是希望合并前先定下来。"]],"p":[["I might be missing context","我可能不了解上下文","降低对抗性的开场"],["pull X into a helper","把 X 抽成 helper","重构建议的标准说法"],["the tradeoff I see is ...","我看到的权衡是……","把意见变成分析"],["this is a nit","这是小问题","区分优先级"],["feel free to ignore","可以忽略","软性收尾"]],"d":[["翻译：我可能缺上下文，但这里可能有性能问题。","用 I might be missing context","I might be missing context, but I think there may be a performance issue here."],["翻译：我们能不能把这段抽成公共函数？","用 pull X into ...","Could we pull this block into a shared function?"],["翻译：这是个小事，先合也行。","用 this is a nit","This is a nit — feel free to merge as is."]]},{"t":"每日站会更新","te":"Standup Update","goal":"60 秒说完：做了什么、卡在哪、下一步。","s":[["Yesterday I [[wrapped up the migration script]] and ran it against a staging snapshot.","昨天我把迁移脚本收尾，并在预发快照上跑了一遍。"],["Today I'm [[digging into the timeout reports]] from the mobile client.","今天我准备深入排查移动端的超时上报。"],["I'm [[blocked on a schema decision]] — we need to know whether older clients must keep working.","我被一个表结构决策卡住了，需要确认老版本客户端是否必须兼容。"],["If nobody objects, [[I'll go with the backward-compatible option]] and revisit after launch.","如果没人反对，我先选向后兼容的方案，上线后再回头处理。"],["No other risks on my side; [[I should have something reviewable by tomorrow]].","我这边没有其他风险，明天应该能有可评审的东西。"]],"p":[["wrap up ...","收尾、完成","比 finish 更自然"],["dig into ...","深入排查","调试/分析常用"],["blocked on ...","被……卡住","站会必用"],["if nobody objects","如果没人反对","无异议通过的说法"],["should have X by tomorrow","明天前会有 X","给承诺不用 will"]],"d":[["翻译：昨天我把迁移做完了。","用 wrap up","Yesterday I wrapped up the migration."],["翻译：我今天在查超时问题。","用 dig into","Today I'm digging into the timeout issue."],["翻译：我被数据表结构的决定卡住了。","用 blocked on","I'm blocked on the schema decision."]]},{"t":"设计文档开篇","te":"Opening a Design Doc","goal":"三段话交代背景、目标和非目标。","s":[["This doc [[proposes a queue-based approach]] to decouple ingestion from processing.","这份文档提出用队列解耦写入与处理。"],["The problem today is that [[a slow consumer blocks the entire pipeline]].","现在的问题是，一个慢消费者会堵住整条链路。"],["The goal is to [[keep p99 ingestion latency under 200 ms]] while allowing consumers to lag.","目标是把写入 p99 控制在 200 毫秒内，同时允许消费者滞后。"],["Explicitly out of scope: [[backfilling historical data]] and changing the public API.","明确不在范围内的是：历史数据回填和改动公开 API。"],["I'd like feedback on the failure model before [[I start the spike next week]].","我希望在下周开始技术验证前，先收到对故障模型的反馈。"]],"p":[["propose an approach","提出一种方案","设计文档标题句式"],["keep X under Y","把 X 控制在 Y 以内","写指标"],["explicitly out of scope","明确不在范围内","划清边界"],["I'd like feedback on ...","我希望就……收到反馈","征集意见"],["start the spike","开始做技术验证","spike 指探索性验证"]],"d":[["翻译：这份文档提出用队列解耦写入和处理。","用 propose an approach","This doc proposes a queue-based approach to decouple ingestion from processing."],["翻译：目标是把延迟控制在 200 毫秒内。","用 keep X under Y","The goal is to keep latency under 200 ms."],["翻译：历史数据回填明确不在范围内。","用 out of scope","Backfilling historical data is explicitly out of scope."]]},{"t":"事故复盘","te":"Incident Postmortem","goal":"陈述事实、影响、根因、改进项，不追责。","s":[["At 14:02 UTC the API [[started returning 5xx errors]] for roughly 12% of requests.","UTC 14:02，API 开始对约 12% 的请求返回 5xx。"],["The trigger was a config rollout that [[removed a connection-pool limit]] nobody realized was load-bearing.","触发点是一次配置发布，移除了一项没人意识到关键的连接池上限。"],["We [[rolled back within nine minutes]], and error rates returned to baseline by 14:15.","我们在九分钟内回滚，14:15 错误率回到基线。"],["Root cause: the config schema allowed an unset value to [[silently default to unlimited]].","根因是配置结构允许未设置的值静默变成无上限。"],["Action items: [[add a validation rule]], [[page on pool exhaustion]], and [[require a canary for config changes]].","改进项：加校验规则、连接池耗尽告警、配置变更必须灰度。"]],"p":[["start returning 5xx","开始返回 5xx","描述现象"],["roll back within X minutes","在 X 分钟内回滚","响应时间写法"],["return to baseline","回到基线","恢复状态"],["silently default to ...","静默地默认为……","描述隐性缺陷"],["action items","改进项","复盘的固定词"]],"d":[["翻译：我们在九分钟内回滚了。","用 roll back within","We rolled back within nine minutes."],["翻译：根本原因是未设置的值会静默变成无上限。","用 silently default to","The root cause is that an unset value silently defaults to unlimited."],["翻译：改进项包括加一条校验规则。","用 action items","Action items include adding a validation rule."]]},{"t":"异步提问","te":"Asking for Clarification Asynchronously","goal":"提问自带上下文，别人一趟就能回。","s":[["Quick question on the billing ticket — [[am I right that retries should not be charged]]?","关于计费工单快速问一句：我理解重试不应该计费，对吗？"],["Context: we saw 2,300 retries yesterday, [[which would be about 4% of revenue]] if billed.","背景：昨天有 2300 次重试，如果计费大约是收入的 4%。"],["What I've tried: I checked the docs and [[the wording is ambiguous on this point]].","我已经做的：查了文档，这一点表述含糊。"],["No rush — [[end of week is fine]], but I'll assume retries aren't billed unless I hear otherwise.","不急，这周末前都行；如果没有别的说法，我先按不计费处理。"],["Happy to jump on a call if [[it's faster to talk it through]].","如果当面聊更快，我随时可以开个会。"]],"p":[["quick question on ...","关于……快速问一句","异步开场"],["am I right that ...","我理解……对吗","确认假设"],["what I've tried","我已经尝试的","体现自助排查"],["no rush","不急","降低对方压力"],["unless I hear otherwise","除非另有说明","默认推进"]],"d":[["翻译：关于计费工单，我理解重试不计费，对吗？","用 am I right that","Quick question on the billing ticket — am I right that retries aren't billed?"],["翻译：不着急，这周内回复就行。","用 no rush","No rush — sometime this week is fine."],["翻译：除非另有说明，我按方案 A 推进。","用 unless I hear otherwise","I'll proceed with option A unless I hear otherwise."]]},{"t":"技术自我介绍","te":"Technical Self-Introduction","goal":"一分钟讲清：做什么、多深、做成过什么。","s":[["I'm a backend-leaning engineer who [[spends most of my time on agent orchestration]] and data pipelines.","我是偏后端的工程师，大部分时间在做 agent 编排和数据管道。"],["Most recently I [[led the design of a sales assistant]] that routes requests across six internal services.","最近我主导设计了一个销售助手，把请求分发到六个内部服务。"],["The hard part wasn't the model — it was [[keeping latency predictable under bursty traffic]].","难的部分不是模型，而是在突发流量下保持延迟可预测。"],["I ended up [[cutting p95 latency by about 40%]] by splitting the hot path from the enrichment path.","最终我把热路径和富化路径拆开，p95 延迟降了约 40%。"],["I'm now looking for a team where [[correctness and latency matter equally]].","我现在想找一个同时在意正确性和延迟的团队。"]],"p":[["-leaning engineer","偏……方向的工程师","self-description"],["lead the design of ...","主导……的设计","体现 ownership"],["the hard part wasn't X — it was Y","难的不是 X 而是 Y","结构化表达"],["cut X by about N%","把 X 降低约 N%","量化成果"],["where X matters","在意 X 的地方","表达求职标准"]],"d":[["翻译：我大部分时间在做 agent 编排。","用 spend most of my time on","I spend most of my time on agent orchestration."],["翻译：最难的不是模型，而是延迟。","用 the hard part wasn't X","The hard part wasn't the model — it was latency."],["翻译：我把 p95 延迟降低了约 40%。","用 cut X by about N%","I cut p95 latency by about 40%."]]},{"t":"讲清系统架构","te":"Explaining Your Architecture","goal":"用三层结构讲：入口、核心、存储。","s":[["At a high level, [[there are three moving parts]]: the gateway, the orchestrator, and the event store.","整体上看有三块：网关、编排器和事件存储。"],["The gateway [[does nothing but authenticate and route]].","网关只做鉴权和路由，别的都不做。"],["The orchestrator [[fans out to worker agents]] and merges their results.","编排器把任务分发给各个 worker agent，再合并结果。"],["Everything is written to an append-only event store, which is [[what makes replay possible]].","所有内容写入只追加的事件存储，这才使回放成为可能。"],["The main constraint is that [[workers must be idempotent]], because retries are unavoidable.","主要约束是 worker 必须幂等，因为重试不可避免。"]],"p":[["at a high level","整体来看","讲架构的开场"],["three moving parts","三块可动部件","形象化表达"],["does nothing but ...","只做……","划定职责"],["fan out to ...","分发到……","并发调度常用"],["what makes X possible","使 X 成为可能的原因","解释设计动机"]],"d":[["翻译：整体上看有三块：网关、编排器和存储。","用 at a high level","At a high level, there are three parts: the gateway, the orchestrator, and the store."],["翻译：网关只做鉴权和路由。","用 does nothing but","The gateway does nothing but authenticate and route."],["翻译：主要约束是 worker 必须幂等。","用 the main constraint is","The main constraint is that workers must be idempotent."]]},{"t":"讨论范围与排期","te":"Negotiating Scope and Deadline","goal":"不硬顶也不全接，给出选项。","s":[["I can [[ship the core flow by Friday]], but the export feature won't make that date.","核心流程我周五能发，但导出功能赶不上这个日期。"],["Here's the tradeoff: [[we could either cut scope or add a week]].","权衡是这样：要么砍范围，要么多给一周。"],["My recommendation is to [[ship without export first]] and follow up next sprint.","我的建议是先发不含导出的版本，下个迭代补上。"],["If the deadline is fixed for a customer commitment, [[I'll need one more pair of hands]].","如果日期被客户承诺锁死，我需要再一个人手。"],["Either way, [[I'll put the plan in writing]] so we're aligned.","不管哪种，我都会把方案写下来，保证大家理解一致。"]],"p":[["make that date","赶上那个日期","谈排期的固定说法"],["the tradeoff is ...","权衡是……","把选择讲清楚"],["cut scope","削减范围","项目谈判高频"],["one more pair of hands","多一个人手","要资源的委婉说法"],["put it in writing","写成文字","对齐共识"]],"d":[["翻译：核心流程周五能发，导出赶不上。","用 make that date","I can ship the core flow by Friday, but export won't make that date."],["翻译：要么砍范围，要么多给一周。","用 we could either ... or ...","We could either cut scope or add a week."],["翻译：我会把方案写下来。","用 put it in writing","I'll put the plan in writing."]]},{"t":"写 Bug 报告","te":"Writing a Bug Report","goal":"五段式：现象、复现、预期、实际、影响。","s":[["Steps to reproduce: open Settings, [[toggle dark mode twice]], then refresh.","复现步骤：打开设置，把深色模式切换两次，然后刷新。"],["Expected: the theme persists. Actual: [[it silently reverts to light]].","预期：主题保持不变。实际：静默回退到浅色。"],["This reproduces on Chrome 140 and Safari 18, [[but not on Firefox]], so it looks browser-specific.","在 Chrome 140 和 Safari 18 都能复现，Firefox 不行，看起来和浏览器有关。"],["Impact: cosmetic, but [[it undermines trust in saved settings]].","影响：外观层面，但会削弱用户对设置保存的信任。"],["I've attached a screen recording and [[a minimal repro repo]].","我附了录屏和一个最小复现仓库。"]],"p":[["steps to reproduce","复现步骤","Bug 报告标题"],["expected ... actual ...","预期……实际……","对照结构"],["reproduces on X but not Y","X 上能复现、Y 上不能","缩小范围"],["it undermines trust in ...","削弱对……的信任","说明影响"],["minimal repro","最小复现","工程师必备词"]],"d":[["翻译：预期主题保持不变，实际会回退。","用 expected / actual","Expected: the theme persists. Actual: it reverts to light."],["翻译：这个问题在 Chrome 上能复现。","用 reproduces on" ed from me in the meantime]].","这期间如果需要我提供什么，请告诉我。"]],"p":[["I'm writing to ...","我写这封邮件是为了……","正式邮件开场"],["sponsored by the company","由公司担保","签证语境"],["connect me with X","帮我对接 X","礼貌请求"],["be on site by ...","在……前到岗","到岗时间"],["in the meantime","在此期间","收尾常用"]],"d":[["翻译：我写这封邮件确认接受录用。","用 I'm writing to","I'm writing to confirm my acceptance of the offer."],["翻译：能否帮我对接移民团队？","用 connect me with","Could you connect me with the immigration team?"],["翻译：这期间如果需要我做什么，请告知。","用 in the meantime","Please let me know if there's anything you need from me in the meantime."]]}];

const store = {
  key: "eng-daily-v1",
  load(){ try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch(e){ return {}; } },
  save(o){ try { localStorage.setItem(this.key, JSON.stringify(o)); } catch(e){} }
};
let state = store.load();
let challenge = false;
let current = null;

function dayIndex(){
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 1);
  const dayOfYear = Math.floor((now - start) / 86400000) + 1;
  return dayOfYear % LESSONS.length;
}
function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function hl(text){
  return esc(text).replace(/\[\[(.+?)\]\]/g, "<mark>$1</mark>");
}

function render(i){
  current = i;
  const L = LESSONS[i];
  document.getElementById("lessonTitle").innerHTML = L.t + '<span class="en">' + esc(L.te) + '</span>';
  document.getElementById("lessonGoal").textContent = L.goal;

  const ol = document.getElementById("sentList");
  ol.innerHTML = "";
  L.s.forEach(function(pair){
    const li = document.createElement("li");
    li.innerHTML = '<div class="en-line">' + hl(pair[0]) + '</div><div class="zh-line">' + esc(pair[1]) + '</div>';
    ol.appendChild(li);
  });

  const tb = document.getElementById("phraseBody");
  tb.innerHTML = "";
  L.p.forEach(function(row){
    const tr = document.createElement("tr");
    tr.innerHTML = '<td class="k">' + esc(row[0]) + '</td><td>' + esc(row[1]) + '</td><td class="n">' + esc(row[2]) + '</td>';
    tb.appendChild(tr);
  });

  const dl = document.getElementById("drillList");
  dl.innerHTML = "";
  L.d.forEach(function(item, n){
    const box = document.createElement("div");
    box.className = "drill";
    const id = "drill-" + i + "-" + n;
    box.innerHTML = '<p>' + esc(item[0]) + '</p><p class="hint">提示：' + esc(item[1]) + '</p>' +
      '<textarea id="' + id + '" placeholder="在这里写英文…"></textarea>' +
      '<div style="margin-top:8px"><button data-ans="' + n + '">看参考译文</button></div>' +
      '<div class="answer" id="ans-' + i + '-' + n + '" hidden><span class="lbl">参考</span>' + esc(item[2]) + '</div>';
    dl.appendChild(box);
  });
  dl.querySelectorAll("button[data-ans]").forEach(function(btn){
    btn.addEventListener("click", function(){
      const n = btn.getAttribute("data-ans");
      const el = document.getElementById("ans-" + i + "-" + n);
      el.hidden = !el.hidden;
      btn.textContent = el.hidden ? "看参考译文" : "收起参考";
    });
  });

  document.getElementById("lessonCard").className = "card" + (challenge ? " challenge" : "");

  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  LESSONS.forEach(function(L2, idx){
    const d = document.createElement("button");
    const done = state.done && state.done[idx];
    d.className = "dot" + (idx === i ? " active" : "") + (done ? " done" : "");
    d.textContent = idx + 1;
    d.title = L2.t;
    d.addEventListener("click", function(){ render(idx); window.scrollTo({top:0,behavior:"smooth"}); });
    dots.appendChild(d);
  });

  const doneCount = Object.keys(state.done || {}).length;
  document.getElementById("progressText").textContent = "已完成 " + doneCount + " / " + LESSONS.length + " 课";
  const b = document.getElementById("btnDone");
  b.textContent = (state.done && state.done[i]) ? "✓ 今天已标记完成" : "标记今天已练完";
}

document.getElementById("btnPrev").addEventListener("click", function(){ render((current - 1 + LESSONS.length) % LESSONS.length); window.scrollTo({top:0,behavior:"smooth"}); });
document.getElementById("btnNext").addEventListener("click", function(){ render((current + 1) % LESSONS.length); window.scrollTo({top:0,behavior:"smooth"}); });
document.getElementById("btnToday").addEventListener("click", function(){ render(dayIndex()); window.scrollTo({top:0,behavior:"smooth"}); });
document.getElementById("btnChallenge").addEventListener("click", function(e){
  challenge = !challenge;
  e.target.textContent = challenge ? "显示中文" : "隐藏中文";
  document.getElementById("lessonCard").className = "card" + (challenge ? " challenge" : "");
});
document.getElementById("btnDone").addEventListener("click", function(){
  state.done = state.done || {};
  state.done[current] = true;
  store.save(state);
  render(current);
});

(function(){
  const d = new Date();
  document.getElementById("dateLine").textContent = d.getFullYear() + " 年 " + (d.getMonth()+1) + " 月 " + d.getDate() + " 日 · 自动匹配今日课程";
  render(dayIndex());
})();
</script>
